      ctx.fillStyle = 'rgba(170,182,204,0.5)';
      for (var ry = y + 10; ry < y + h - 8; ry += 24) {
        ctx.beginPath(); ctx.arc(x + 6, ry, 1.8, 0, TAU); ctx.fill();
        ctx.beginPath(); ctx.arc(x + w - 6, ry, 1.8, 0, TAU); ctx.fill();
      }
      // strobing warning bar across the face
      ctx.fillStyle = 'rgba(' + dan + ',' + (0.14 + 0.3 * pulse).toFixed(3) + ')';
      ctx.fillRect(x + 3, y + h * 0.5 - 4, w - 6, 8);
    }
    ctx.restore();

    ctx.strokeStyle = 'rgba(' + dan + ',' + (0.32 + 0.28 * pulse).toFixed(3) + ')';
    ctx.lineWidth = 2;
    ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);

    if (isCrusher) {
      // danger shadow it will slam into
      ctx.fillStyle = 'rgba(' + dan + ',' + (0.05 + 0.06 * pulse).toFixed(3) + ')';
      ctx.fillRect(x + 2, y + h, w - 4, 26);
    }
  };

  /* ------------------------------------------------------------------- lava */

  function lavaSurfY(x, yTop, t) {
    return yTop + Math.sin(x * 0.05 + t * 2.2) * 2.6 + Math.sin(x * 0.021 - t * 1.1) * 1.9;
  }

  ART3.drawLava = function (ctx, x0, x1, yTop, H, t) {
    x0 = num(x0, 0); x1 = num(x1, 0); yTop = num(yTop, 0); H = num(H, 760); t = num(t, 0);
    var w = x1 - x0;
    if (!(w > 0) || !(H > yTop)) return;

    // flat molten bands, no gradient allocation (V5: hotter top strip)
    ctx.fillStyle = '#f2461f';
    ctx.fillRect(x0, yTop, w, Math.min(26, H - yTop));
    ctx.fillStyle = 'rgba(255,190,90,0.30)';
    ctx.fillRect(x0, yTop, w, Math.min(8, H - yTop));
    if (H - yTop > 26) {
      ctx.fillStyle = '#8c1116';
      ctx.fillRect(x0, yTop + 26, w, Math.min(60, H - yTop - 26));
    }
    if (H - yTop > 86) {
      ctx.fillStyle = '#2c030b';
      ctx.fillRect(x0, yTop + 86, w, H - yTop - 86);
    }
    // heat glow rising off the pool: two stacked flat bands, ember-bright
    var hpu = 0.5 + 0.5 * Math.sin(t * 1.8 + x0 * 0.01);
    ctx.fillStyle = 'rgba(255,150,50,' + (0.06 + 0.04 * hpu).toFixed(3) + ')';
    ctx.fillRect(x0, yTop - 44, w, 44);
    ctx.fillStyle = 'rgba(255,120,40,' + (0.09 + 0.05 * hpu).toFixed(3) + ')';
    ctx.fillRect(x0, yTop - 20, w, 20);

    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(x0, lavaSurfY(x0, yTop, t));
    for (var sx = x0 + 8; sx <= x1; sx += 8) ctx.lineTo(sx, lavaSurfY(sx, yTop, t));
    ctx.strokeStyle = 'rgba(255,140,60,0.30)'; ctx.lineWidth = 16; ctx.stroke();
    ctx.strokeStyle = 'rgba(255,184,96,0.8)'; ctx.lineWidth = 6.5; ctx.stroke();
    ctx.strokeStyle = '#fff8dc'; ctx.lineWidth = 2.6; ctx.stroke();
    ctx.restore();

    var nb = clamp(Math.round(w / 60), 2, 8), i;
    for (i = 0; i < nb; i++) {
      var bx = x0 + 8 + h1(i * 17.3 + x0) * (w - 16);
      var per = 1.6 + h1(i * 3.7) * 1.6;
      var cyc = (t / per + h1(i * 7.1)) % 1;
      var br = cyc * 6;
      var by = lavaSurfY(bx, yTop, t) + 3 - cyc * 5;
      ctx.strokeStyle = 'rgba(255,204,112,' + (0.85 * (1 - cyc)).toFixed(3) + ')';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(bx, by, br, 0, TAU); ctx.stroke();
    }
    // occasional BIG slow bubbles with a highlight — the pool is boiling
    for (i = 0; i < 2; i++) {
      var Bx = x0 + 14 + h1(i * 23.1 + x0 * 0.7) * Math.max(1, w - 28);
      var Bper = 3.4 + h1(i * 5.9) * 2.2;
      var Bcyc = (t / Bper + h1(i * 11.3)) % 1;
      var Br = Bcyc * Bcyc * 13;
      var By = lavaSurfY(Bx, yTop, t) + 4 - Bcyc * 8;
      var Ba = 0.9 * (1 - Bcyc);
      ctx.strokeStyle = 'rgba(255,214,130,' + Ba.toFixed(3) + ')';
      ctx.lineWidth = 2.4;
      ctx.beginPath(); ctx.arc(Bx, By, Br, 0, TAU); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,248,220,' + (Ba * 0.6).toFixed(3) + ')';
      ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(Bx - Br * 0.3, By - Br * 0.3, Br * 0.4, 0, TAU); ctx.stroke();
    }
    for (i = 0; i < 8; i++) {
      var ex = x0 + h1(i * 9.9 + x1) * w;
      var eh = 20 + h1(i * 4.4) * 44;
      var ey = yTop - ((t * (16 + h1(i) * 22) + h1(i * 2.2) * eh) % eh);
      ctx.fillStyle = 'rgba(255,182,90,' + (0.6 * (1 - (yTop - ey) / eh)).toFixed(3) + ')';
      ctx.fillRect(ex, ey, 2.5, 2.5);
    }
  };

  /* -------------------------------------------------------------- boost pad */

  ART3.drawBoost = function (ctx, x, y, angle, t) {
    // V5: a big bright chevron RUNWAY on the road (~96 world px), unmissable.
    // The engine additionally wraps this in a ~1.25x scale on phones.
    x = num(x, 0); y = num(y, 0); angle = num(angle, 0); t = num(t, 0);
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // runway plate hugging the ink, with a pulsing energy interior
    var pu = 0.5 + 0.5 * Math.sin(t * 5.2);
    ctx.beginPath();
    ctx.moveTo(-48, 1.5); ctx.lineTo(48, 1.5); ctx.lineTo(42, -16); ctx.lineTo(-42, -16);
    ctx.closePath();
    ctx.fillStyle = 'rgba(4,24,26,0.88)';
    ctx.fill();
    ctx.fillStyle = 'rgba(60,255,190,' + (0.05 + 0.08 * pu).toFixed(3) + ')';
    ctx.fill();
    ctx.strokeStyle = 'rgba(80,255,200,0.16)';
    ctx.lineWidth = 7;
    ctx.stroke();
    ctx.strokeStyle = 'rgba(130,255,222,0.6)';
    ctx.lineWidth = 2.2;
    ctx.stroke();

    // three BIG forward arrows with a pulse racing through them
    for (var i = 0; i < 3; i++) {
      var cx = -26 + i * 26;
      var ph = (t * 1.7 - i * 0.28) % 1;
      if (ph < 0) ph += 1;
      var w = Math.sin(Math.PI * ph);
      var a = 0.30 + 0.70 * w * w;
      ctx.beginPath();
      ctx.moveTo(cx - 8, -13); ctx.lineTo(cx + 8, -7.2); ctx.lineTo(cx - 8, -1.5);
      ctx.strokeStyle = 'rgba(90,255,205,' + (a * 0.38).toFixed(3) + ')';
      ctx.lineWidth = 9;
      ctx.stroke();
      ctx.strokeStyle = 'rgba(190,255,235,' + a.toFixed(3) + ')';
      ctx.lineWidth = 4;
      ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,' + (a * 0.8).toFixed(3) + ')';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    // deck light where plate meets road + launch glow smear ahead
    ctx.strokeStyle = 'rgba(160,255,230,0.8)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-46, 0); ctx.lineTo(46, 0); ctx.stroke();
    ctx.strokeStyle = 'rgba(120,255,225,' + (0.10 + 0.16 * pu).toFixed(3) + ')';
    ctx.lineWidth = 10;
    ctx.beginPath(); ctx.moveTo(48, -7); ctx.lineTo(76 + pu * 14, -7); ctx.stroke();
    ctx.strokeStyle = 'rgba(220,255,244,' + (0.22 + 0.26 * pu).toFixed(3) + ')';
    ctx.lineWidth = 2.6;
    ctx.beginPath(); ctx.moveTo(48, -7); ctx.lineTo(66 + pu * 10, -7); ctx.stroke();
    ctx.restore();
  };

  /* ------------------------------------------------------------- spring pad */

  ART3.drawSpring = function (ctx, x, y, t, compress) {
    // V5: proper chunky machine, ~2x the old footprint (56 wide, ~52 tall).
    // Squash-and-stretch rides the compress arg: fires -> coil slams down,
    // then overshoots past rest height as compress decays back to 0.
    x = num(x, 0); y = num(y, 0); t = num(t, 0);
    var c = clamp(num(compress, 0), 0, 1);
    var restH = 38;
    var hh = restH * (1 - 0.66 * c + 0.38 * Math.sin(Math.PI * c) * (1 - c));
    ctx.save();
    ctx.translate(x, y);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // heavy machined foot with a gold edge light and bolts
    ctx.fillStyle = 'rgba(8,14,32,0.94)';
    ctx.fillRect(-28, -6, 56, 8);
    ctx.fillStyle = 'rgba(255,210,74,0.20)';
    ctx.fillRect(-28, -6, 56, 2);
    ctx.strokeStyle = 'rgba(255,210,74,0.5)';
    ctx.lineWidth = 1.4;
    ctx.strokeRect(-28, -6, 56, 8);
    ctx.fillStyle = 'rgba(255,225,140,0.7)';
    ctx.fillRect(-24, -3.6, 3, 3);
    ctx.fillRect(21, -3.6, 3, 3);

    // coil: 5 fat turns, layered warm-gold neon
    ctx.beginPath();
    var turns = 5, py = -6;
    ctx.moveTo(-16, py);
    for (var i = 0; i < turns; i++) {
      var y1 = py - (hh / turns) * (i + 0.5);
      var y2 = py - (hh / turns) * (i + 1);
      ctx.lineTo(16, y1);
      ctx.lineTo(-16, y2);
    }
    ctx.strokeStyle = 'rgba(255,210,74,0.16)'; ctx.lineWidth = 11; ctx.stroke();
    ctx.strokeStyle = 'rgba(255,210,74,0.45)'; ctx.lineWidth = 6; ctx.stroke();
    ctx.strokeStyle = '#ffd24a'; ctx.lineWidth = 3.4; ctx.stroke();
    ctx.strokeStyle = 'rgba(255,252,230,0.9)'; ctx.lineWidth = 1.3; ctx.stroke();

    // top plate: bounces with the coil, squashes WIDE under compression
    var topY = py - hh, tw = 24 * (1 + 0.3 * c);
    ctx.fillStyle = '#1a1330';
    ctx.fillRect(-tw, topY - 8, tw * 2, 9);
    ctx.fillStyle = 'rgba(255,210,74,' + (0.55 + 0.4 * c).toFixed(2) + ')';
    ctx.fillRect(-tw, topY - 8, tw * 2, 3);
    ctx.strokeStyle = 'rgba(255,240,180,0.8)';
    ctx.lineWidth = 1.3;
    ctx.strokeRect(-tw, topY - 8, tw * 2, 9);

    // up-arrows breathing above the pad
    var idle = 0.5 + 0.5 * Math.sin(t * 3.4);
    for (var k = 0; k < 2; k++) {
      var ay = topY - 16 - k * 14 - idle * 4;
      var aa = (0.38 - k * 0.14) * (0.55 + 0.45 * idle) + c * 0.4;
      ctx.strokeStyle = 'rgba(255,225,140,' + clamp(aa, 0, 1).toFixed(3) + ')';
      ctx.lineWidth = 3.4;
      ctx.beginPath();
      ctx.moveTo(-11, ay); ctx.lineTo(0, ay - 9); ctx.lineTo(11, ay);
      ctx.stroke();
    }
    if (c > 0.35) {   // just fired: double shock ring
      var rr = (1 - c) * 60 + 10;
      ctx.strokeStyle = 'rgba(255,240,190,' + (c * 0.55).toFixed(3) + ')';
      ctx.lineWidth = 2.6;
      ctx.beginPath(); ctx.arc(0, topY - 5, rr, 0, TAU); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,' + (c * 0.3).toFixed(3) + ')';
      ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(0, topY - 5, rr * 0.66, 0, TAU); ctx.stroke();
    }
    ctx.restore();
  };

  /* -------------------------------------------------------------- wind zone */

  ART3.drawWind = function (ctx, x0, y0, x1, y1, ax, t) {
    x0 = num(x0, 0); y0 = num(y0, 0); x1 = num(x1, 0); y1 = num(y1, 0);
    ax = num(ax, 0); t = num(t, 0);
    var w = x1 - x0, h = y1 - y0;
    if (!(w > 0) || !(h > 0)) return;
    var dir = ax < 0 ? -1 : 1;
    var spd = clamp(Math.abs(ax) / 260, 0.4, 2.4);

    ctx.save();
    ctx.beginPath(); ctx.rect(x0, y0, w, h); ctx.clip();

    // faint field wash + boundary tick marks
    ctx.fillStyle = 'rgba(150,220,255,0.045)';
    ctx.fillRect(x0, y0, w, h);
    ctx.strokeStyle = 'rgba(180,235,255,0.16)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x0 + 0.5, y0); ctx.lineTo(x0 + 0.5, y1);
    ctx.moveTo(x1 - 0.5, y0); ctx.lineTo(x1 - 0.5, y1);
    ctx.stroke();

    // drifting streaks, each with a little arrow head
    ctx.lineCap = 'round';
    var n = clamp(Math.round(w * h / 5200), 8, 26);
    for (var i = 0; i < n; i++) {
      var lane = h1(i * 3.7 + x0 * 0.01);
      var sy = y0 + 6 + lane * (h - 12);
      var len = 22 + h1(i * 5.3) * 44;
      var travel = (t * (70 + h1(i * 2.1) * 130) * spd + h1(i * 9.7) * (w + 200)) % (w + 200);
      var sx = dir > 0 ? (x0 - 120 + travel) : (x1 + 120 - travel);
      var wob = Math.sin(t * 2.2 + i * 1.7) * 4;
      var a = 0.10 + 0.24 * Math.sin(Math.PI * clamp((sx - x0) / w, 0, 1));
      ctx.strokeStyle = 'rgba(196,240,255,' + a.toFixed(3) + ')';
      ctx.lineWidth = 1 + h1(i * 7.1) * 1.6;
      ctx.beginPath();
      ctx.moveTo(sx, sy + wob);
      ctx.lineTo(sx + dir * len, sy + wob * 0.6);
      ctx.stroke();
      if (h1(i * 13.3) > 0.55) {
        ctx.beginPath();
        ctx.moveTo(sx + dir * len, sy + wob * 0.6);
        ctx.lineTo(sx + dir * (len - 6), sy + wob * 0.6 - 3.5);
        ctx.moveTo(sx + dir * len, sy + wob * 0.6);
        ctx.lineTo(sx + dir * (len - 6), sy + wob * 0.6 + 3.5);
        ctx.stroke();
      }
    }
    ctx.restore();
  };

  /* ------------------------------------------------------------------- star */

  var starP = null;
  function starPath() {
    if (starP || !HAS_P2D) return starP;
    starP = new Path2D();
    for (var i = 0; i < 10; i++) {
      var rr = (i % 2 === 0) ? 1 : 0.44;
      var a = -Math.PI / 2 + i * Math.PI / 5;
      var px = Math.cos(a) * rr, py = Math.sin(a) * rr;
      if (i === 0) starP.moveTo(px, py); else starP.lineTo(px, py);
    }
    starP.closePath();
    return starP;
  }
  function fillStar(ctx, s, col) {
    var p = starPath();
    ctx.save();
    ctx.scale(s, s);
    ctx.fillStyle = col;
    if (p) {
      ctx.fill(p);
    } else {
      ctx.beginPath();
      for (var i = 0; i < 10; i++) {
        var rr = (i % 2 === 0) ? 1 : 0.44;
        var a = -Math.PI / 2 + i * Math.PI / 5;
        var px = Math.cos(a) * rr, py = Math.sin(a) * rr;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  function strokeStar(ctx, s, col, lw) {
    var p = starPath();
    ctx.save();
    ctx.scale(s, s);
    ctx.strokeStyle = col;
    ctx.lineWidth = lw / s;
    ctx.lineJoin = 'round';
    if (p) {
      ctx.stroke(p);
    } else {
      ctx.beginPath();
      for (var i = 0; i < 10; i++) {
        var rr = (i % 2 === 0) ? 1 : 0.44;
        var a = -Math.PI / 2 + i * Math.PI / 5;
        var px = Math.cos(a) * rr, py = Math.sin(a) * rr;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.stroke();
    }
    ctx.restore();
  }

  ART3.drawStar = function (ctx, x, y, t, collected) {
    // V5: faceted-gem reading — big glow, amber under-facet, hot core,
    // rim line, plus a tiny orbiting sparkle. Collected = dim hollow shell.
    x = num(x, 0); y = num(y, 0); t = num(t, 0);
    ctx.save();
    ctx.translate(x, y);

    if (collected) {
      ctx.rotate(h1(x * 0.37) * TAU);
      ctx.globalAlpha *= 0.30;
      fillStar(ctx, 10, 'rgba(203,187,141,0.35)');
      strokeStar(ctx, 10, 'rgba(230,214,168,0.8)', 1.2);
      ctx.restore();
      return;
    }

    var bob = Math.sin(t * 2.2 + x * 0.03) * 3;
    ctx.translate(0, bob);
    var s = 12 * (1 + 0.08 * Math.sin(t * 2.8 + x * 0.05));
    ctx.rotate(t * 0.7 + x * 0.01);
    if (QUAL !== 0) fillStar(ctx, s * 2.9, 'rgba(255,210,74,0.07)');
    fillStar(ctx, s * 2.0, 'rgba(255,210,74,0.13)');
    fillStar(ctx, s * 1.38, 'rgba(255,210,74,0.28)');
    fillStar(ctx, s, '#ffd24a');
    fillStar(ctx, s * 0.72, '#e8a92c');          // under-facet: cut-gem depth
    fillStar(ctx, s * 0.44, '#fff3c4');
    fillStar(ctx, s * 0.22, '#ffffff');
    strokeStar(ctx, s, 'rgba(255,246,214,0.85)', 1.3);
    ctx.restore();

    // sparkle cross, counter-rotating so the pickup twinkles
    var tw = 0.35 + 0.65 * Math.abs(Math.sin(t * 1.9 + x * 0.02));
    ctx.save();
    ctx.translate(x, y + bob);
    ctx.rotate(-t * 0.45);
    ctx.strokeStyle = 'rgba(255,244,200,' + (tw * 0.55).toFixed(3) + ')';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(-24 * tw, 0); ctx.lineTo(24 * tw, 0);
    ctx.moveTo(0, -24 * tw); ctx.lineTo(0, 24 * tw);
    ctx.stroke();
    ctx.restore();

    // tiny orbiting glint (skipped on low quality)
    if (QUAL !== 0) {
      var oa = -t * 1.6 + x * 0.02;
      var ox = x + Math.cos(oa) * 19, oy = y + bob + Math.sin(oa) * 19 * 0.6;
      ctx.fillStyle = 'rgba(255,252,230,' + (0.5 + 0.4 * Math.sin(t * 6 + x)).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(ox, oy, 1.6, 0, TAU); ctx.fill();
    }
  };

  /* ------------------------------------------------------------------- bike
     b = {x,y,angle,speed,airborne,state,crashT,dist,flips,lean}
     b.x,b.y = physics centre (collision r 12). Ground contact 12px BELOW it.
     Wheel r 8, wheelbase 22 -> 38px long. AXLE_Y = 12 - 8 = 4. */

  var WHEEL_R = 8, AXLE_Y = 4;
  var PAL = {
    body: '#1e1740', dark: '#100c22', tank: '#2e2660', acc: '#6fe6ff',
    pipe: '#939bb5', rim: 'rgba(111,230,255,0.55)', spoke: '#9fabc8',
    suit: '#2a2450', suit2: '#3a3268', helm: '#ffcf5e', visor: '#0a1226',
    scarf: '#ff3d7e', light: '#ffe9b0', rimlt: 'rgba(255,255,255,0.5)'
  };
  var GPAL = {
    body: 'rgba(150,225,255,0.30)', dark: 'rgba(120,200,235,0.26)',
    tank: 'rgba(170,235,255,0.24)', acc: 'rgba(210,250,255,0.34)',
    pipe: 'rgba(180,225,245,0.26)', rim: 'rgba(190,240,255,0.28)',
    spoke: 'rgba(190,240,255,0.24)', suit: 'rgba(150,225,255,0.28)',
    suit2: 'rgba(160,230,255,0.24)', helm: 'rgba(215,250,255,0.34)',
    visor: 'rgba(60,120,150,0.3)', scarf: 'rgba(210,250,255,0.24)',
    light: 'rgba(230,255,255,0.3)', rimlt: 'rgba(220,250,255,0.2)'
  };

  function drawWheel(ctx, x, y, rot, P) {
    ctx.save();
    ctx.translate(x, y);
    ctx.strokeStyle = P.dark; ctx.lineWidth = 3.8;
    ctx.beginPath(); ctx.arc(0, 0, WHEEL_R - 1.4, 0, TAU); ctx.stroke();
    ctx.strokeStyle = P.rim; ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.arc(0, 0, WHEEL_R - 3, 0, TAU); ctx.stroke();
    // rim light: top-edge catch so the wheel reads round, not flat
    ctx.strokeStyle = P.rimlt; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(0, 0, WHEEL_R - 0.6, -2.6, -0.9); ctx.stroke();
    ctx.rotate(rot);
    ctx.strokeStyle = P.spoke; ctx.lineWidth = 1.1;
    ctx.beginPath();
    for (var i = 0; i < 4; i++) {
      var a = i * TAU / 4;
      ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(a) * (WHEEL_R - 3.2), Math.sin(a) * (WHEEL_R - 3.2));
    }
    ctx.stroke();
    ctx.fillStyle = P.spoke;
    ctx.beginPath(); ctx.arc(0, 0, 1.5, 0, TAU); ctx.fill();
    ctx.restore();
  }

  function drawBikeBody(ctx, wheelRot, forkUp, P, hot) {
    drawWheel(ctx, -11, AXLE_Y, wheelRot, P);
    drawWheel(ctx, 11, AXLE_Y - forkUp * 0.4, wheelRot, P);

    ctx.lineCap = 'round';
    // swingarm + fork — heavier members so the machine silhouettes
    ctx.strokeStyle = P.body; ctx.lineWidth = 3.3;
    ctx.beginPath(); ctx.moveTo(-11, AXLE_Y); ctx.lineTo(-3, 1); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(11, AXLE_Y - forkUp * 0.4); ctx.lineTo(7.5, -6 - forkUp); ctx.stroke();

    // fenders
    ctx.strokeStyle = P.dark; ctx.lineWidth = 2.3;
    ctx.beginPath(); ctx.arc(11, AXLE_Y - forkUp * 0.4, WHEEL_R + 2.2, -2.5, -1.0); ctx.stroke();
    ctx.beginPath(); ctx.arc(-11, AXLE_Y, WHEEL_R + 2.2, -2.2, -1.4); ctx.stroke();

    // exhaust + tip
    ctx.strokeStyle = P.pipe; ctx.lineWidth = 2.8;
    ctx.beginPath(); ctx.moveTo(-3, 2.6); ctx.lineTo(-16, 3.4); ctx.stroke();
    ctx.strokeStyle = P.rimlt; ctx.lineWidth = 0.9;
    ctx.beginPath(); ctx.moveTo(-4, 1.8); ctx.lineTo(-15, 2.6); ctx.stroke();
    ctx.fillStyle = P.dark;
    ctx.beginPath(); ctx.arc(-16.6, 3.4, 2.2, 0, TAU); ctx.fill();

    // frame + tank + tail
    ctx.fillStyle = P.body;
    ctx.beginPath();
    ctx.moveTo(-10, -2);
    ctx.lineTo(-3.5, -5.4);
    ctx.lineTo(3, -5.6);
    ctx.quadraticCurveTo(7.6, -5.2, 8.6, -1);
    ctx.lineTo(4, 2.2);
    ctx.lineTo(-4, 2.8);
    ctx.closePath();
    ctx.fill();
    // tail kick
    ctx.fillStyle = P.dark;
    ctx.beginPath();
    ctx.moveTo(-10, -2); ctx.lineTo(-15.5, -4.4); ctx.lineTo(-14.5, -1.2); ctx.lineTo(-9, 0);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = P.tank;
    ctx.beginPath();
    ctx.moveTo(-1, -5.3); ctx.lineTo(4.6, -5.4);
    ctx.quadraticCurveTo(7.2, -4.9, 7.4, -2.6);
    ctx.lineTo(0.5, -2.8);
    ctx.closePath();
    ctx.fill();
    // rim light riding the chassis + tank top edge
    ctx.strokeStyle = P.rimlt; ctx.lineWidth = 1.1;
    ctx.beginPath();
    ctx.moveTo(-10, -2.4); ctx.lineTo(-3.5, -5.8); ctx.lineTo(3, -6);
    ctx.quadraticCurveTo(6.6, -5.7, 7.6, -3.4);
    ctx.stroke();
    // ink racing stripe
    ctx.strokeStyle = P.acc; ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.moveTo(-9.5, -2.4); ctx.lineTo(6.8, -4); ctx.stroke();
    // number plate decal
    ctx.fillStyle = P.acc;
    ctx.globalAlpha *= 0.75;
    ctx.fillRect(-13.4, -3.6, 3.4, 2.2);
    ctx.globalAlpha /= 0.75;

    // bars + headlight
    ctx.strokeStyle = P.dark; ctx.lineWidth = 2.3;
    ctx.beginPath(); ctx.moveTo(7.5, -6 - forkUp); ctx.lineTo(4.8, -9.6 - forkUp); ctx.stroke();
    ctx.fillStyle = P.light;
    ctx.beginPath(); ctx.arc(9, -5 - forkUp, 2, 0, TAU); ctx.fill();
    if (hot > 0) {   // headlight throw at speed: long soft cone + hot inner beam
      ctx.fillStyle = 'rgba(255,235,170,' + (hot * 0.20).toFixed(3) + ')';
      ctx.beginPath();
      ctx.moveTo(9.6, -6.4 - forkUp); ctx.lineTo(44, -14 - forkUp);
      ctx.lineTo(44, 2 - forkUp); ctx.closePath();
      ctx.fill();
      ctx.fillStyle = 'rgba(255,248,214,' + (hot * 0.18).toFixed(3) + ')';
      ctx.beginPath();
      ctx.moveTo(9.6, -5.8 - forkUp); ctx.lineTo(30, -9 - forkUp);
      ctx.lineTo(30, -2.6 - forkUp); ctx.closePath();
      ctx.fill();
    }
  }

  function drawRider(ctx, lean, tuck, armPump, scarf, P) {
    ctx.save();
    ctx.translate(-2.5, -5.6);
    ctx.rotate(lean);
    if (tuck > 0) { ctx.translate(1.4 * tuck, 1.2 * tuck); ctx.scale(1 - 0.1 * tuck, 1 - 0.16 * tuck); }
    ctx.lineCap = 'round';

    // rear leg to peg (knee lifts when tucked)
    ctx.strokeStyle = P.suit; ctx.lineWidth = 3.3;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(3.4, 2.2 - 1.6 * tuck);
    ctx.lineTo(2.2 + 1.4 * tuck, 6 - 3.2 * tuck);
    ctx.stroke();

    // torso
    ctx.strokeStyle = P.suit2; ctx.lineWidth = 4.3;
    ctx.beginPath();
    ctx.moveTo(0, 0.6);
    ctx.quadraticCurveTo(1.6 + tuck, -4.4 + 1.4 * tuck, 5 - 0.8 * tuck, -7.6 + 2.6 * tuck);
    ctx.stroke();
    // spine rim light: one bright thread along the back
    ctx.strokeStyle = P.rimlt; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-0.6, 0.2);
    ctx.quadraticCurveTo(0.8 + tuck, -4.8 + 1.4 * tuck, 4.2 - 0.8 * tuck, -8.2 + 2.6 * tuck);
    ctx.stroke();

    // arm to grip, or fist up on a win
    var hx = 5 - 0.8 * tuck, hy = -7.2 + 2.6 * tuck;
    ctx.strokeStyle = P.suit; ctx.lineWidth = 2.8;
    ctx.beginPath();
    ctx.moveTo(hx - 0.5, hy);
    if (armPump > 0) {
      ctx.quadraticCurveTo(6.8, -9.4, 6 + Math.sin(armPump) * 1.4, -13);
    } else {
      ctx.quadraticCurveTo(7.6, -6.2 + tuck, 8.4, -3.8 + 1.2 * tuck);
    }
    ctx.stroke();
    if (armPump > 0) {
      ctx.fillStyle = P.helm;
      ctx.beginPath(); ctx.arc(6 + Math.sin(armPump) * 1.4, -13.4, 1.3, 0, TAU); ctx.fill();
    }

    // scarf trailing back
    if (scarf > 0.02) {
      ctx.strokeStyle = P.scarf;
      ctx.lineWidth = 1.6;
      ctx.globalAlpha *= 0.85;
      for (var s = 0; s < 2; s++) {
        var ph = nowS() * 9 + s * 1.9;
        ctx.beginPath();
        ctx.moveTo(hx - 1.4, hy - 2.6);
        ctx.quadraticCurveTo(hx - 6 - 5 * scarf, hy - 4 + Math.sin(ph) * 2.4,
          hx - 12 - 9 * scarf, hy - 2 + Math.sin(ph + 1.2) * 3.4);
        ctx.stroke();
      }
      ctx.globalAlpha /= 0.85;
    }

    // helmet + visor + rim-light shine
    var hdx = hx + 1, hdy = hy - 2.6;
    ctx.fillStyle = P.helm;
    ctx.beginPath(); ctx.arc(hdx, hdy, 3.9, 0, TAU); ctx.fill();
    ctx.fillStyle = P.visor;
    ctx.beginPath();
    ctx.arc(hdx, hdy, 3.9, -0.55, 0.78);
    ctx.quadraticCurveTo(hdx + 1.4, hdy + 0.4, hdx + 1, hdy - 1.9);
    ctx.closePath();
    ctx.fill();
    // visor glint
    ctx.strokeStyle = 'rgba(150,230,255,0.6)';
    ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.arc(hdx, hdy, 3.1, -0.3, 0.5); ctx.stroke();
    ctx.strokeStyle = P.rimlt;
    ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(hdx, hdy, 3.9, -2.7, -1.3); ctx.stroke();

    ctx.restore();
  }

  var lastPuffT = -9;

  ART3.drawBike = function (ctx, b, t) {
    if (!b) return;
    t = num(t, 0);
    var bx = num(b.x, 0), by = num(b.y, 0);
    var ang = num(b.angle, 0), spd = num(b.speed, 0);
    var wheelRot = num(b.dist, 0) / WHEEL_R;
    var flips = num(b.flips, 0);
    var lean = clamp(num(b.lean, 0), -1, 1);
    var state = b.state || 'ride';
    var hot = clamp(spd / 780, 0, 1);

    ctx.save();
    ctx.translate(bx, by);

    if (state === 'crash') {
      var ct = Math.max(0, num(b.crashT, 0));
      // V5.1: when the engine drives both bodies (b.crashMode present), the art adds NO motion of
      // its own — the previous look layered a local tumble on top of the engine's moving wreck and
      // the sum read as random. Bike drawn at its pose; rider at the engine's thrown position.
      if (b.crashMode === 'mounted' || b.crashMode === 'thrown') {
        var cvx2 = num(b.crashVX, 0), cvy2 = num(b.crashVY, 0);
        var cs2 = Math.sqrt(cvx2 * cvx2 + cvy2 * cvy2);
        var moving2 = cs2 > 70;
        ctx.save();
        ctx.rotate(ang);
        drawBikeBody(ctx, wheelRot + ct * 22, 0, PAL, 0);
        ctx.restore();
        var rdx = num(b.riderDX, 0), rdy = num(b.riderDY, 0);
        var rrot = num(b.riderRotAbs, 0);
        var settled2 = !!b.riderSettled;
        ctx.save();
        if (b.crashMode === 'mounted') {
          // still on the bike: seated pose, arms braced, everything moves as one
          ctx.rotate(ang);
          ctx.translate(0, -12);
          drawRider(ctx, moving2 ? Math.sin(ct * 9) * 0.18 : 0, 0.15, 0.5, 0, PAL);
        } else {
          ctx.translate(rdx, rdy);
          ctx.rotate(rrot);
          drawRider(ctx,
            settled2 ? 0 : Math.sin(ct * 12) * 0.4,           // body whip while airborne
            settled2 ? 0 : 0.5 + 0.4 * Math.sin(ct * 15),     // leg pump
            settled2 ? 0 : 1.1,                                // arms out
            0, PAL);
        }
        ctx.restore();
        ctx.restore();
        return;
      }
      var cvx = num(b.crashVX, NaN), cvy = num(b.crashVY, NaN);

      if (cvx !== cvx && cvy !== cvy) {
        // legacy path — byte-for-byte the V3 wreck
        ctx.save();
        var spin0 = ct * 11 * Math.exp(-1.1 * ct);
        var bdy0 = Math.min(-150 * ct + 300 * ct * ct, 8);
        ctx.translate(ct * 30, bdy0);
        ctx.rotate(ang + spin0);
        drawBikeBody(ctx, wheelRot + ct * 30, 0, PAL, 0);
        ctx.restore();

        var rx0 = -36 * ct - 10;
        var ry0 = Math.min(-180 * ct + 390 * ct * ct, 2);
        var settled0 = (ry0 >= 2 && ct > 0.42);
        ctx.save();
        ctx.translate(rx0, ry0 - 6);
        ctx.rotate(settled0 ? 1.72 : -ct * 9.5);
        drawRider(ctx, settled0 ? 0 : Math.sin(ct * 14) * 0.5, 0, 0, 0, PAL);
        ctx.restore();

        ctx.restore();
        return;
      }

      if (cvx !== cvx) cvx = 0;
      if (cvy !== cvy) cvy = 0;
      var cs = Math.sqrt(cvx * cvx + cvy * cvy);
      var sn = clamp(cs / 780, 0, 1);                        // throw energy 0..1
      var ux = cs > 1 ? cvx / cs : -1, uy = cs > 1 ? cvy / cs : 0;

      // bike cartwheels, drifting with the throw but staying near the impact
      ctx.save();
      var spin = ct * (9 + 5 * sn) * Math.exp(-1.1 * ct) * (ux >= 0 ? 1 : -1);
      var bdy = Math.min(-150 * ct + 300 * ct * ct, 8);
      ctx.translate(ct * (10 + 24 * ux), bdy);
      ctx.rotate(ang + spin);
      drawBikeBody(ctx, wheelRot + ct * 30, 0, PAL, 0);
      ctx.restore();

      // rider: decaying slide along the velocity, ballistic drop, then settle
      var lv = 26 + 120 * sn;                                // local throw speed
      var adv = (1 - Math.exp(-ct * 1.5)) / 1.5;             // slide that runs out
      var rx = ux * lv * adv + ux * 8 - 2;
      var ry = Math.min(uy * (80 + 180 * sn) * ct + 390 * ct * ct, 2);
      var settled = (ry >= 2 && ct > 0.42);
      var rrot = settled ? (ux >= 0 ? 1.72 : -1.72)
        : ct * (4.5 + 7 * sn) * (ux >= 0 ? -1 : 1);
      var flail = settled ? 0 : (0.25 + 0.55 * sn);
      ctx.save();
      ctx.translate(rx, ry - 6);
      ctx.rotate(rrot);
      drawRider(ctx,
        settled ? 0 : Math.sin(ct * (11 + 9 * sn)) * flail,          // body whip
        settled ? 0 : (0.5 + 0.5 * Math.sin(ct * 17)) * flail * 0.9, // leg pump
        settled ? 0 : (sn > 0.12 ? 1.2 + Math.sin(ct * 15) : 0),     // arm flail
        0, PAL);
      ctx.restore();

      ctx.restore();
      return;
    }

    if (state === 'win') {
      var we = 0.5 + 0.06 * Math.sin(t * 5);
      ctx.rotate(ang);
      ctx.translate(-11, AXLE_Y);
      ctx.rotate(-we);
      ctx.translate(11, -AXLE_Y);
      drawBikeBody(ctx, wheelRot + t * 4, 0, PAL, 0.4);
      drawRider(ctx, -0.16, 0, t * 8, 0.5, PAL);
      ctx.restore();
      return;
    }

    if (state === 'idle') {
      var bob = Math.sin(t * 2.6) * 1.3;
      // ink underglow while parked
      ctx.fillStyle = 'rgba(' + INK[0] + ',0.10)';
      ctx.beginPath();
      if (ctx.ellipse) ctx.ellipse(0, 12, 20, 4, 0, 0, TAU); else ctx.arc(0, 12, 6, 0, TAU);
      ctx.fill();
      ctx.translate(0, bob * 0.4);
      drawBikeBody(ctx, wheelRot, 0, PAL, 0);
      ctx.save();
      ctx.translate(0, bob * 0.5);
      drawRider(ctx, 0.04 * Math.sin(t * 2.6 + 1), 0, 0, 0, PAL);
      ctx.restore();
      if (t - lastPuffT > 0.7) {
        lastPuffT = t;
        spawnP(PT_PUFF, bx - 17, by + 3, -14 - Math.random() * 8, -10, 0.7, 2.2, '150,150,175', -18, 1.2, 0, 0);
      }
      ctx.restore();
      return;
    }

    // ---- ride ----
    var spinning = !!b.airborne && flips > 0;

    // spin trail: faint arc behind the bike so a flip reads as intentional
    if (spinning) {
      ctx.save();
      ctx.rotate(ang);
      ctx.strokeStyle = 'rgba(' + INK[0] + ',0.22)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 4, 21, 0.5, 4.4); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,0.14)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(0, 4, 25, 1.0, 3.9); ctx.stroke();
      ctx.restore();
    } else if (!b.airborne && hot > 0.25) {
      // contact glow smear under the wheels
      ctx.fillStyle = 'rgba(' + INK[0] + ',' + (0.05 + hot * 0.12).toFixed(3) + ')';
      ctx.beginPath();
      if (ctx.ellipse) ctx.ellipse(-2, 12, 22 + hot * 12, 4, 0, 0, TAU); else ctx.arc(-2, 12, 6, 0, TAU);
      ctx.fill();
    }

    ctx.rotate(ang);
    var tuck = spinning ? 1 : (b.airborne ? 0.45 : 0);
    var rlean = lean * 0.32 + clamp(ang * 0.22, -0.22, 0.22)
      + (b.airborne ? -0.2 : 0) + hot * 0.1;
    var forkUp = b.airborne ? 1.1 : 0;
    drawBikeBody(ctx, wheelRot, forkUp, PAL, hot);
    drawRider(ctx, rlean, tuck, 0, clamp(hot * 1.2 - 0.25, 0, 1), PAL);

    // exhaust: ember glow at speed, full boost flame trail when pinned
    if (hot > 0.3) {
      ctx.fillStyle = 'rgba(255,170,80,' + (hot * 0.5).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(-16.6, 3.4, 1.3, 0, TAU); ctx.fill();
    }
    if (hot > 0.72) {
      var fk = (hot - 0.72) / 0.28;
      var fl = 5 + Math.random() * 6 + fk * 6;
      // outer flame
      ctx.fillStyle = 'rgba(255,120,50,' + (0.22 + Math.random() * 0.25).toFixed(2) + ')';
      ctx.beginPath();
      ctx.moveTo(-17, 1.6); ctx.lineTo(-17 - fl * 1.5, 3.4); ctx.lineTo(-17, 5.2);
      ctx.closePath();
      ctx.fill();
      // hot core flame
      ctx.fillStyle = 'rgba(255,220,140,' + (0.35 + Math.random() * 0.3).toFixed(2) + ')';
      ctx.beginPath();
      ctx.moveTo(-17, 2.4); ctx.lineTo(-17 - fl * 0.8, 3.4); ctx.lineTo(-17, 4.4);
      ctx.closePath();
      ctx.fill();
      // afterglow streak trailing the pipe
      ctx.strokeStyle = 'rgba(255,180,90,' + (0.12 + fk * 0.14).toFixed(3) + ')';
      ctx.lineWidth = 3.6;
      ctx.beginPath(); ctx.moveTo(-19, 3.4); ctx.lineTo(-30 - fk * 12, 3.8); ctx.stroke();
    }
    ctx.restore();
  };

  /* ------------------------------------------------------------------ ghost */

  ART3.drawGhost = function (ctx, g, t) {
    if (!g) return;
    t = num(t, 0);
    ctx.save();
    ctx.globalAlpha = 0.32;
    ctx.translate(num(g.x, 0), num(g.y, 0));
    ctx.rotate(num(g.angle, 0));
    drawBikeBody(ctx, num(g.dist, t * 60) / WHEEL_R, 0, GPAL, 0);
    drawRider(ctx, -0.05, 0.2, 0, 0, GPAL);
    ctx.restore();
  };

  /* ---------------------------------------------------------------- speedfx */

  ART3.drawSpeedFx = function (ctx, cam, W, H, speedNorm) {
    W = num(W, 1600); H = num(H, 760);
    noteSurface(ctx);
    var s = clamp(num(speedNorm, 0), 0, 1);
    var v = visRect(cam, W, H);
    var tt = nowS();
    var thin = lite();                 // small surface or low quality

    // vignette: ONE cached unit-space radial gradient, scaled by transform
    var vg = vignette(ctx);
    if (vg) {
      ctx.save();
      ctx.translate((v.x0 + v.x1) / 2, (v.y0 + v.y1) / 2);
      ctx.scale(v.w / 2, v.h / 2);
      ctx.globalAlpha = 0.55 + 0.35 * s;
      ctx.fillStyle = vg;
      ctx.fillRect(-1, -1, 2, 2);
      ctx.restore();
    }
    if (s < 0.22) return;

    // directional streaks, deterministic, fixed count, zero allocation
    var k = (s - 0.22) / 0.78;
    var n = 10 + ((k * 16) | 0);
    if (thin) { n = (n * 0.5) | 0; if (n < 4) n = 4; }
    ctx.save();
    ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(226,250,255,' + (0.05 + 0.20 * k).toFixed(3) + ')';
    ctx.lineWidth = thin ? 1.8 : 1.4;
    ctx.beginPath();
    for (var i = 0; i < n; i++) {
      var lane = h1(i * 3.7);
      var yy = v.y0 + 8 + lane * (v.h - 16);
      var len = (26 + h1(i * 5.1) * 90) * (0.4 + k);
      var pos = ((tt * (620 + h1(i * 2.3) * 900) * (0.35 + k) + h1(i * 9.1) * 2400) % (v.w + 300));
      var xx = v.x1 + 150 - pos;
      if (xx < v.x0 - 160) continue;
      ctx.moveTo(xx, yy);
      ctx.lineTo(xx + len, yy);
    }
    ctx.stroke();
    // a couple of hot leading streaks
    ctx.strokeStyle = 'rgba(255,255,255,' + (0.06 + 0.16 * k).toFixed(3) + ')';
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    for (var j = 0; j < (thin ? 1 : 3); j++) {
      var yj = v.y0 + v.h * (0.3 + 0.2 * j) + Math.sin(tt * 3 + j) * 12;
      var pj = ((tt * 1500 + j * 800) % (v.w + 300));
      var xj = v.x1 + 150 - pj;
      ctx.moveTo(xj, yj);
      ctx.lineTo(xj + 120 * (0.4 + k), yj);
    }
    ctx.stroke();
    ctx.restore();
  };

  /* -------------------------------------------------------------- particles */

  var CAP = 320;
  var PT_PUFF = 0, PT_DEBRIS = 1, PT_CONF = 2, PT_SPARK = 3, PT_TWK = 4,
    PT_CHEV = 5, PT_RING = 6, PT_RIB = 7, PT_SPECK = 8, PT_GRING = 9;
  var pool = [];
  (function () {
    for (var i = 0; i < CAP; i++) {
      pool.push({ t: 0, x: 0, y: 0, vx: 0, vy: 0, life: 0, ttl: 1, sz: 2, rot: 0, vr: 0,
        col: '255,255,255', grav: 0, drag: 0 });
    }
  })();

  function spawnP(type, x, y, vx, vy, ttl, sz, col, grav, drag, rot, vr) {
    var p;
    if (pN < capNow) p = pool[pN++];
    else p = pool[(steal++) % capNow];   // pool full: recycle oldest slot
    p.t = type; p.x = x; p.y = y; p.vx = vx; p.vy = vy;
    p.life = ttl; p.ttl = ttl; p.sz = sz; p.col = col;
    p.grav = grav; p.drag = drag; p.rot = rot; p.vr = vr;
  }

  var CONF_COLS = ['92,233,255', '255,210,74', '255,61,126', '125,255,176', '255,255,255'];

    if (speed < 60) return;

    spawnP(PT_PUFF, x - 9, y + 2,
      -30 - Math.random() * 60 * k, -8 - Math.random() * 24,
      0.35 + Math.random() * 0.25, 2 + Math.random() * 2.8 * k,
      '142,162,202', -30, 2.5, 0, 0);
    if (k > 0.6 && !lite() && Math.random() < 0.4) {
      spawnP(PT_SPARK, x - 10, y + 8, -120 - Math.random() * 180, -20 - Math.random() * 40,

  ART3.fxCrash = function (x, y, vx, vy) {

    for (i = 0; i < pN; i++) {

      p.life -= dt;

        i--;

      p.vy += p.grav * dt;
      var dr = 1 - p.drag * dt;
      if (dr < 0) dr = 0;
      p.vx *= dr; p.vy *= dr;
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.rot += p.vr * dt;

        p.x += Math.sin(p.rot * 2) * 30 * dt;
        ctx.fillStyle = 'rgba(' + p.col + ',' + (k < 0.25 ? k * 4 : 1).toFixed(3) + ')';
        rectQuad(ctx, p.x, p.y, p.sz, p.rot);
      } else if (p.t === PT_SPECK) {
        ctx.fillStyle = 'rgba(' + p.col + ',' + (k * 0.8).toFixed(3) + ')';
        ctx.fillRect(p.x, p.y, p.sz, p.sz);

    }

    ctx.save();

    ctx.lineCap = 'round';

        ctx.moveTo(p.x, p.y);

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.sz * k + 0.6, 0, TAU);
        ctx.fill();
        ctx.strokeStyle = 'rgba(' + p.col + ',' + (a * 0.5).toFixed(3) + ')';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(p.x - p.sz * 2 * k, p.y); ctx.lineTo(p.x + p.sz * 2 * k, p.y);
        ctx.moveTo(p.x, p.y - p.sz * 2 * k); ctx.lineTo(p.x, p.y + p.sz * 2 * k);

      } else if (p.t === PT_CHEV) {
        // boost chevron flying along its travel angle
        a = k * 0.85;
        var cw2 = p.sz, ca2 = Math.cos(p.rot), sa2 = Math.sin(p.rot);
        ctx.strokeStyle = 'rgba(' + p.col + ',' + a.toFixed(3) + ')';
        ctx.lineWidth = 2.4;
        ctx.beginPath();
        ctx.moveTo(p.x - ca2 * cw2 + sa2 * cw2 * 0.7, p.y - sa2 * cw2 - ca2 * cw2 * 0.7);
        ctx.lineTo(p.x + ca2 * cw2 * 0.4, p.y + sa2 * cw2 * 0.4);
        ctx.lineTo(p.x - ca2 * cw2 - sa2 * cw2 * 0.7, p.y - sa2 * cw2 + ca2 * cw2 * 0.7);
        ctx.stroke();
      } else if (p.t === PT_RING) {
        var rr = p.sz + (1 - k) * p.sz * 5.4;
        ctx.strokeStyle = 'rgba(' + p.col + ',' + (k * 0.55).toFixed(3) + ')';
        ctx.lineWidth = 1.4 + k * 3.2;

  if (!s || !isTouch) return s;

}

// ---------------- persistence ----------------
// localStorage is attacker-writable (any script on the origin, or the player's own devtools).
// Everything read back out is coerced and clamped here so nothing downstream can be fed a
// hostile type — star counts drive string repeats, medals drive CSS class names.
function loadSave(){
  var out = { unlocked: 0, stars: {}, medals: {}, best: {}, score: {}, ghost: {}, mute: true,
              onboarded: 0, coached: 0, tipSeen: 0, flipped: false };
  var raw;
  try { raw = JSON.parse(localStorage.getItem('inkrider3')); } catch(e){ return out; }
  if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return out;
  var n = (window.LEVELS3 && window.LEVELS3.length) || 20;
  function num(v, lo, hi, dflt){ v = +v; return (typeof v === 'number' && isFinite(v)) ? clamp(v, lo, hi) : dflt; }
  function mapOf(src, lo, hi){
    var o = {};
    if (src && typeof src === 'object' && !Array.isArray(src)) {
      for (var k in src) {
        if (!Object.prototype.hasOwnProperty.call(src, k)) continue;
        var i = parseInt(k, 10);
        if (!(i >= 0 && i < n)) continue;
        var v = num(src[k], lo, hi, null);
        if (v !== null) o[i] = v;
      }
    }
    return o;
  }
  out.unlocked = num(raw.unlocked, 0, n - 1, 0) | 0;
  out.stars = mapOf(raw.stars, 0, 3);
  for (var k in out.stars) out.stars[k] = out.stars[k] | 0;
  out.best = mapOf(raw.best, 0, 3600);
  out.score = mapOf(raw.score, 0, 1e9);
  var MED = { gold: 1, silver: 1, bronze: 1 };
  if (raw.medals && typeof raw.medals === 'object') {
    for (k in raw.medals) {
      var mi = parseInt(k, 10);
      if (mi >= 0 && mi < n && MED[raw.medals[k]] === 1) out.medals[mi] = raw.medals[k];
    }
  }
  if (raw.ghost && typeof raw.ghost === 'object') {
    for (k in raw.ghost) {
      var gi = parseInt(k, 10), g = raw.ghost[k];
      if (!(gi >= 0 && gi < n) || !Array.isArray(g) || g.length > 6000) continue;
      var clean = [], ok = true;
      for (var j = 0; j < g.length; j++) { var v2 = +g[j]; if (!isFinite(v2)) { ok = false; break; } clean.push(v2); }
      if (ok && clean.length >= 3) out.ghost[gi] = clean;
    }
  }
  // sound is OFF until the player turns it on; only an explicit unmute is remembered
  out.mute = (raw.mute === false) ? false : true;
  out.flipped = !!raw.flipped;
  out.onboarded = raw.onboarded ? 1 : 0; out.coached = raw.coached ? 1 : 0; out.tipSeen = raw.tipSeen ? 1 : 0;
  return out;
}

// ---------------- sizing / camera ----------------
// The playfield is a fixed 1600x760 landscape world. On a portrait phone, fitting it to the
// screen width leaves a useless letterboxed strip (this is exactly what V2 shipped), so instead
// the whole scene is drawn rotated a quarter turn and the player simply holds the phone sideways.
// `essW/essH` are the "effective screen space" the rest of the code lays out in.
function resize(force){
  // Measure the canvas's own laid-out box, not visualViewport. On iOS visualViewport excludes
  // the Safari toolbars, so sizing to it drew a canvas smaller than the screen, pinned to the
  // top-left by inset:0 — the game looked shrunken and off-centre. The canvas is fixed at
  // inset:0, so its client box IS the screen, toolbars included.
  var de = document.documentElement;
  var w = Math.round(cv.clientWidth || window.innerWidth || de.clientWidth || 0);
  var h = Math.round(cv.clientHeight || window.innerHeight || de.clientHeight || 0);
  if (forceW && forceH) { w = forceW; h = forceH; }
  if (!w || !h) { w = 1280; h = 720; }
  var wantRot = (h > w * 1.02) && w < 700;   // phones only: a tablet in portrait is wide enough as-is
  // the visible band changes on its own when a toolbar slides in or out, with no change to the
  // canvas box, so it has to be part of the "did anything move?" test
  var vv0 = window.visualViewport;
  var sig = w + 'x' + h + ':' + wantRot + ':' +
    (forceW && forceH ? 'forced' : [Math.round((vv0 && vv0.width) || w), Math.round((vv0 && vv0.height) || h),
     Math.round((vv0 && vv0.offsetLeft) || 0), Math.round((vv0 && vv0.offsetTop) || 0)].join(','));
  if (!force && sig === lastSig) return;
  lastSig = sig;
  cssW = w; cssH = h; rot = wantRot;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(w * DPR); cv.height = Math.round(h * DPR);
  essW = rot ? h : w; essH = rot ? w : h;
  // The canvas covers the whole screen so the backdrop paints edge to edge, but the playfield is
  // centred inside the VISIBLE band — on iOS the browser toolbars overlay the layout viewport, and
  // centring against the full height pushes the game down behind them.
  var vv = window.visualViewport;
  var vx0 = (vv && vv.offsetLeft) || 0, vy0 = (vv && vv.offsetTop) || 0;
  var vw = Math.min((vv && vv.width) || w, w), vh = Math.min((vv && vv.height) || h, h);
  if (forceW && forceH) { vx0 = 0; vy0 = 0; vw = w; vh = h; }
  var visW, visH, visX, visY;
  if (rot) { visW = vh; visH = vw; visX = vy0; visY = cssW - vx0 - vw; }
  else { visW = vw; visH = vh; visX = vx0; visY = vy0; }
  // On phones the world is fitted with side margins so the start ledge never hides behind the
  // notch / Dynamic Island or the HUD columns — the bike must be visible the moment a level opens.
  var mx = (Math.min(w, h) < 500) ? 56 : 0;
  scale = Math.min((visW - mx * 2) / W, visH / H);
  offX = visX + (visW - W * scale) / 2;
  offY = visY + (visH - H * scale) / 2;
  // The whole level has to stay visible while drawing, which caps how large the world can be
  // rendered — so on a small screen the RIDER is drawn larger instead, targeting a readable
  // on-screen size without ballooning on a desktop monitor.
  // the whole-level view is the planning view, so the markers have to read at that scale
  bikeVis = clamp(0.75 / scale, 1, 1.6);
  propVis = clamp(0.75 / scale, 1, 1.8);    // flag and stars: goal markers, no collision fairness cost
  padVis = clamp(1.15 / scale, 1.5, 2.6);   // springs and boosts are INTERACTIONS — oversized on purpose
  ZOOM_MAX = clamp(1.6 / scale, 2, 4);      // ~3.5x on a phone, 2x on a desktop monitor
  clampUserCam();                                 // a resize can change what the camera may show
  document.body.classList.toggle('portrait', rot);
  document.body.classList.toggle('flip', rot && flipped);
  document.documentElement.style.setProperty('--appw', w + 'px');
  document.documentElement.style.setProperty('--apph', h + 'px');
  if (window.ART3 && ART3.setQuality) ART3.setQuality(Math.min(w, h) < 500 ? 0 : 1);
  skyGradTheme = -1;                                        // gradient is built in world units; rebuild
}
// canvas transform for the current orientation (applied once per frame)
function applyOrientation(){
  if (!rot) return;
  if (flipped) { ctx.translate(0, cssH); ctx.rotate(-Math.PI / 2); }
  else { ctx.translate(cssW, 0); ctx.rotate(Math.PI / 2); }
}
// screen (client) point -> effective screen space, undoing the same rotation
function toEss(clientX, clientY){
  if (!rot) return { x: clientX, y: clientY };
  if (flipped) return { x: cssH - clientY, y: clientX };
  return { x: clientY, y: cssW - clientX };
}

// world<->screen with camera: screen = (world - camTopLeft) * scale * zoom + off
function camView(){
  var vw = W / cam.zoom, vh = H / cam.zoom;
  var cx = clamp(cam.x, vw / 2, W - vw / 2);
  // A wreck falling into a void is followed past the floor of the level, so you watch it drop
  // away into the dark rather than vanish at the bottom edge.
  var falling = bike && bike.state === 'crash' && crashKind === 'fall';
  var cy = falling ? Math.max(cam.y, vh / 2) : clamp(cam.y, vh / 2, H - vh / 2);
  return { x0: cx - vw / 2, y0: cy - vh / 2, vw: vw, vh: vh };
}
function worldPt(e){
  var v = camView(), p = toEss(e.clientX, e.clientY);
  return { x: v.x0 + (p.x - offX) / (scale * cam.zoom), y: v.y0 + (p.y - offY) / (scale * cam.zoom) };
}
// keeps the player's camera inside the world at whatever zoom they've chosen
function clampUserCam(){
  userZoom = clamp(userZoom, 1, ZOOM_MAX);
  var vw = W / userZoom, vh = H / userZoom;
  userCamX = clamp(userCamX, vw / 2, W - vw / 2);
  userCamY = clamp(userCamY, vh / 2, H - vh / 2);
}
function setZoom(z, anchorWorld){
  var prev = userZoom;
  userZoom = clamp(z, 1, ZOOM_MAX);
  if (anchorWorld && prev > 0) {          // keep the pinch/tap point under the fingers
    var f = 1 - prev / userZoom;
    userCamX += (anchorWorld.x - userCamX) * f;
    userCamY += (anchorWorld.y - userCamY) * f;
  }
  clampUserCam();
}
function zoomFit(){ userZoom = 1; userCamX = W / 2; userCamY = contentCY; clampUserCam(); }

function updateCamera(dt){
  // Idle in the draw phase = whole level in view, for planning the route. The moment a finger is
  // down we zoom in and track it: at full-level fit on a phone the playfield only fills about a
  // third of the screen height, which is a lot of dead sky and a very small rider.
  // DRAW phase: the player owns the camera. It opens showing the whole level (you cannot plan a
  // route you cannot see) and only moves when they pinch, drag with two fingers, or use the zoom
  // buttons. Nothing auto-zooms under their hands. RIDE phase: the camera follows the bike.
  if (phase === 'ride' && bike) {
    var tz = camTargetZoom;      // fixed: riding at the player's 3.5x draw zoom is unwatchable
    // big air eases the camera back so you can see where you are going to land
    if (bike.state === 'ride' && bike.airborne) tz = clamp(camTargetZoom - airT * 0.55, 1.55, camTargetZoom);
    var tx = bike.x + clamp(bike.vx || 0, -260, 260) * 0.35;
    var ty = bike.y - 40;
    cam.zoom = lerp(cam.zoom, tz, Math.min(1, dt * 4.5));
    var k = Math.min(1, dt * 7);
    cam.x = lerp(cam.x, tx, k); cam.y = lerp(cam.y, ty, k);
  } else {
    cam.zoom = lerp(cam.zoom, userZoom, Math.min(1, dt * 9));
    cam.x = lerp(cam.x, userCamX, Math.min(1, dt * 9));
    cam.y = lerp(cam.y, userCamY, Math.min(1, dt * 9));
  }
  clampUserCam();
}

// ---------------- level lifecycle ----------------
function loadLevel(i){
  li = clamp(i, 0, window.LEVELS3.length - 1); L = window.LEVELS3[li];
  cols = (W / DX) + 1;
  ys = new Float32Array(cols); for (var k = 0; k < cols; k++) ys[k] = NaN;
  plats = [{ x0: 0, x1: PLAT0_X1, y: L.startY }, { x0: L.flagX - PLATF_PAD, x1: W, y: L.flagY }];
  flag = { x: L.flagX, y: L.flagY };
  zones = (L.zones || []).map(function(z){ return { x0: z.x0, x1: z.x1 }; });
  obs = (L.obstacles || []).map(function(o){
    var r = { type: o.type, osc: o.osc || null };
    if (o.type === 'saw'){ r.bx = o.x; r.by = o.y; r.r = o.r || 30; r.x = o.x; r.y = o.y; }
    else if (o.type === 'block'){ r.bx = o.x; r.by = o.y; r.x = o.x; r.y = o.y; r.w = o.w; r.h = o.h; }
    else if (o.type === 'lava'){ r.x0 = o.x0; r.x1 = o.x1; r.yTop = o.yTop; }
    else if (o.type === 'boost'){ r.bx = o.x; r.by = o.y; r.x = o.x; r.y = o.y; r.angle = o.angle || 0; r.power = o.power || 700; r.fired = 0; }
    else if (o.type === 'spring'){ r.bx = o.x; r.by = o.y; r.x = o.x; r.y = o.y; r.power = o.power || 900; r.fired = 0; }
    else if (o.type === 'wind'){ r.x0 = o.x0; r.x1 = o.x1; r.y0 = o.y0; r.y1 = o.y1; r.ax = o.ax || 0; }
    return r;
  });
  stars = (L.stars || []).map(function(s){ return { x: s.x, y: s.y, got: false }; });
  var dx = flag.x - PLAT0_X1, dy = flag.y - plats[0].y;
  inkMax = (L.ink || 1.8) * Math.sqrt(dx * dx + dy * dy);
  // Vertical band this level actually uses, so the camera frames the play area instead of the
  // empty sky above it. Includes an allowance for the road the player still has to draw.
  var lo = Math.min(L.startY, L.flagY), hi = Math.max(L.startY, L.flagY);
  (L.stars || []).forEach(function(s){ lo = Math.min(lo, s.y); hi = Math.max(hi, s.y); });
  (L.obstacles || []).forEach(function(o){
    var sw = o.osc ? o.osc.amp : 0;
    if (o.type === 'lava') { lo = Math.min(lo, o.yTop); hi = Math.max(hi, o.yTop); }
    else if (o.type === 'wind') { lo = Math.min(lo, o.y0); hi = Math.max(hi, o.y1); }
    else if (o.type === 'block') { lo = Math.min(lo, o.y - sw); hi = Math.max(hi, o.y + o.h + sw); }
    else if (o.y !== undefined) { lo = Math.min(lo, o.y - (o.r || 0) - sw); hi = Math.max(hi, o.y + (o.r || 0) + sw); }
  });
  lo -= 120; hi += 150;                       // headroom above, drawing room below
  contentCY = clamp((lo + hi) / 2, 200, H - 200);
  zoomFit();                                  // every level opens showing the whole route
  cam.zoom = userZoom; cam.x = userCamX; cam.y = userCamY;
  inkUsed = 0; strokes = []; curStroke = null; penBroken = true; stroking = false; strokeDirty = true; attempts = 0;
  lastPt = null;                       // also what the resting camera frames — must not carry over
  ghostPlay = save.ghost[li] || null;
  resetBike();
  cam.x = W / 2; cam.y = H / 2; cam.zoom = ZOOM_DRAW;
  phase = 'draw';
  el.lvlname.textContent = (li + 1) + ' · ' + L.name + (L.country ? ' · ' + L.country : '');
  el.hint.textContent = phraseFor(L.hint || '');
  el.hint.hidden = !L.hint;
  el.onboard.hidden = !(li === 0 && !save.onboarded);   // level-1 finger demo, once
  el.coach.classList.remove('show');
  seenAir = false;
  el.timer.textContent = '0.0s';
  if (!AUDIO3.muted) AUDIO3.musicStart(L.theme | 0);
  updateStarRow(); updateInkbar(); updateButtons(); showScreen(null);
}

function resetBike(){
  bike = { x: 40, y: plats[0].y, vx: 0, vy: 0, speed: 0, angle: 0, airborne: false, state: 'idle',
           crashT: 0, dist: 0, stallT: 0, lean: 0, flips: 0, hardLand: 0 };
  for (var i = 0; i < stars.length; i++) stars[i].got = false;
  for (i = 0; i < obs.length; i++) if (obs[i].fired !== undefined) obs[i].fired = 0;
  rideT = 0; lean = 0; leanInput = 0; spinAcc = 0; flips = 0; trickScore = 0;
  susp = 0; suspV = 0; squash = 0; airT = 0; airBest = 0;
  ghostRec = null; ghostT = 0; ghostAcc = 0;
  AUDIO3.wind(false);
  if (el.starrow) updateStarRow();   // stars were just un-collected: clear the pips too
}

function updateButtons(){
  var drawable = phase === 'draw' && !stroking;
  el.btnGo.hidden = !(drawable && inkUsed > 10);
  el.btnClear.hidden = !(drawable && inkUsed > 10);
  el.btnUndo.hidden = !(drawable && strokes.length > 0);
  el.btnRetry.hidden = !(phase === 'ride' && bike && bike.state === 'ride');
  el.hud.hidden = !(phase === 'draw' || phase === 'ride');
  el.zoombar.hidden = !(phase === 'draw');
  el.btnZoomIn.disabled = userZoom >= ZOOM_MAX - 0.01;
  el.btnZoomOut.disabled = userZoom <= 1.01;
  el.btnFit.disabled = userZoom <= 1.01;
  var riding = phase === 'ride' && bike && bike.state === 'ride';
  el.leanL.hidden = el.leanR.hidden = !(isTouch && riding);
  el.keys.hidden = isTouch || riding;                 // the hint strip sits where RETRY lands
  el.fsBtn.hidden = el.fsBtn.hidden || !(phase === 'draw' || phase === 'title');
  el.flipBtn.hidden = !(rot && (phase === 'draw' || phase === 'title'));
  document.body.classList.toggle('riding', !!riding);
}
function updateInkbar(){
  var f = clamp(1 - inkUsed / inkMax, 0, 1);
  el.inkfill.style.width = (f * 100).toFixed(1) + '%';
  el.inkfill.classList.toggle('low', f < 0.15);
}
function updateStarRow(){
  var sp = el.starrow.children;
  for (var i = 0; i < sp.length; i++) sp[i].classList.toggle('lit', !!(stars[i] && stars[i].got));
}

// ---------------- terrain ----------------
function inZone(x){ for (var i = 0; i < zones.length; i++) if (x >= zones[i].x0 && x <= zones[i].x1) return true; return false; }
function inPlat(x){ return x <= plats[0].x1 || x >= plats[1].x0; }
function groundY(x){
  if (x <= plats[0].x1) return plats[0].y;
  if (x >= plats[1].x0) return plats[1].y;
  var f = x / DX, i = f | 0;
  if (i < 0 || i >= cols - 1) return NaN;
  var a = ys[i], b = ys[i + 1];
  if (a !== a) return (b === b) ? b : NaN;   // seam at the platform lip: fall back to the neighbour
  if (b !== b) return a;
  return a + (b - a) * (f - i);
}
function groundSlope(x){
  var a = groundY(x - 7), b = groundY(x + 7), d = 14;
  if (a !== a || b !== b) { a = groundY(x - 2); b = groundY(x + 2); d = 4; }  // divide by the span actually sampled
  if (a !== a || b !== b) return 0;
  return (b - a) / d;
}
function setCell(i, y){
  if (i < 0 || i >= cols) return;
  if (curStroke) curStroke.cells.push(i, ys[i]);
  ys[i] = y;
}
function strokeTo(pt){
  var x = clamp(pt.x, 0, W - 1), y = clamp(pt.y, 12, H - 26);
  if (inPlat(x) || inZone(x)) { penBroken = true; return; }
  if (lastPt && !penBroken) {
    if (x <= lastPt.x + 0.5) return;                       // monotonic left→right
    var segLen = Math.sqrt((x - lastPt.x) * (x - lastPt.x) + (y - lastPt.y) * (y - lastPt.y));
    if (inkUsed + segLen > inkMax) { penBroken = true; el.inkfill.classList.add('low'); return; }
    inkUsed += segLen; if (curStroke) curStroke.ink += segLen;
    var i0 = Math.max(0, Math.ceil(lastPt.x / DX)), i1 = Math.min(cols - 1, Math.floor(x / DX));
    for (var i = i0; i <= i1; i++) {
      var cx = i * DX;
      if (inZone(cx) || inPlat(cx)) continue;
      var f = (cx - lastPt.x) / (x - lastPt.x);
      setCell(i, lastPt.y + (y - lastPt.y) * clamp(f, 0, 1));
    }
    if (Math.random() < 0.25) ART3.fxInk(x, y);
  } else {
    var ii = Math.round(x / DX);
    if (ii >= 0 && ii < cols && !inZone(ii * DX) && !inPlat(ii * DX) && inkUsed + DX <= inkMax) {
      setCell(ii, y); inkUsed += DX; if (curStroke) curStroke.ink += DX;
    }
    penBroken = false;
  }
  lastPt = { x: x, y: y }; strokeDirty = true;
  updateInkbar(); updateButtons();
}
function smoothStroke(){
  var out = new Float32Array(ys);
  for (var i = 0; i < cols; i++) {
    if (ys[i] !== ys[i]) continue;
    var sum = 0, n = 0;
    for (var k = -2; k <= 2; k++) { var j = i + k; if (j >= 0 && j < cols && ys[j] === ys[j]) { sum += ys[j]; n++; } }
    out[i] = sum / n;
  }
  ys = out; strokeDirty = true;
}
function undoStroke(){
  var s = strokes.pop();
  if (!s) return;
  for (var k = s.cells.length - 2; k >= 0; k -= 2) ys[s.cells[k]] = s.cells[k + 1];
  inkUsed = (s.restoreInk !== undefined) ? s.restoreInk : Math.max(0, inkUsed - s.ink);
  penBroken = true; lastPt = null; strokeDirty = true;
  updateInkbar(); updateButtons();
}
// CLEAR sits next to UNDO and wipes the whole road, so it is recorded as a single undoable
// step rather than guarded by a confirm: a mis-tap costs one more tap, not the level.
function clearStroke(){
  var cells = [], had = inkUsed;
  for (var k = 0; k < cols; k++) {
    if (ys[k] === ys[k]) { cells.push(k, ys[k]); ys[k] = NaN; }
  }
  strokes = cells.length ? [{ cells: cells, ink: had, restoreInk: had }] : [];
  inkUsed = 0; penBroken = true; lastPt = null; strokeDirty = true;
  if (cells.length) toast('cleared — ↶ to undo', 1400);
  updateInkbar(); updateButtons();
}

// ---------------- input ----------------
function bindInput(){
  // ---- two-finger pinch + pan (draw phase). One finger draws; a second finger takes over as a
  // camera gesture and cancels the stroke in progress so you never get a stray line from it.
  function ptrMid(){
    var xs = 0, ys2 = 0, n = 0, a = null, b = null;
    for (var k in ptrs) { var p = ptrs[k]; xs += p.x; ys2 += p.y; n++; if (!a) a = p; else if (!b) b = p; }
    if (!n) return null;
    var d = (a && b) ? Math.hypot(a.x - b.x, a.y - b.y) : 0;
    return { x: xs / n, y: ys2 / n, dist: d };
  }
  function screenToWorld(sx, sy){
    var v = camView(), p = toEss(sx, sy);
    return { x: v.x0 + (p.x - offX) / (scale * cam.zoom), y: v.y0 + (p.y - offY) / (scale * cam.zoom) };
  }
  function beginGesture(){
    if (stroking) {                       // undo the partial stroke the first finger started
      stroking = false; AUDIO3.scratch(false);
      if (curStroke && curStroke.cells.length) { strokes.push(curStroke); curStroke = null; undoStroke(); }
      curStroke = null; activePtr = null;
    }
    var m = ptrMid();
    // Anchor the world point under the fingers. Everything is solved against this anchor each
    // frame, so that point stays pinned under the midpoint instead of sliding away.
    gesture = m ? { dist: m.dist, zoom: userZoom, anchor: screenToWorld(m.x, m.y) } : null;
    updateButtons();
  }
  function moveGesture(){
    if (!gesture || !gesture.anchor) return;
    var m = ptrMid();
    if (!m) return;
    if (gesture.dist > 20 && m.dist > 20) userZoom = clamp(gesture.zoom * (m.dist / gesture.dist), 1, ZOOM_MAX);
    // place the camera so the anchor lands back under the current midpoint
    var p = toEss(m.x, m.y), z = scale * userZoom;
    userCamX = gesture.anchor.x - (p.x - offX) / z + (W / userZoom) / 2;
    userCamY = gesture.anchor.y - (p.y - offY) / z + (H / userZoom) / 2;
    clampUserCam();
    cam.zoom = userZoom; cam.x = userCamX; cam.y = userCamY;   // 1:1 with the fingers, no lag
  }

  cv.addEventListener('pointerdown', function(e){
    AUDIO3.unlock();
    ptrs[e.pointerId] = { x: e.clientX, y: e.clientY }; ptrCount++;
    if (ptrCount >= 2 && phase === 'draw') { beginGesture(); return; }
    if (paused) { paused = false; prevT = nowS(); toast('', 1); return; }
    // a tap during the crash replay cuts it short: crash -> drawing again is one tap, no waiting
    if (phase === 'ride' && bike && bike.state === 'crash') { crashTimer = 0; return; }
    if (phase === 'ride' && bike && bike.state === 'ride' && isTouch) {   // touch lean: screen halves
      leanInput = (toEss(e.clientX, e.clientY).x < essW / 2) ? -1 : 1;
      if (el.coach) el.coach.classList.remove('show');
      return;
    }
    if (phase !== 'draw' || activePtr !== null) return;
    tapStart = { x: e.clientX, y: e.clientY, t: nowS() };
    hideOnboarding();
    e.preventDefault(); activePtr = e.pointerId;
    try { cv.setPointerCapture(e.pointerId); } catch(err){}
    stroking = true; penBroken = true; lastPt = null;
    curStroke = { cells: [], ink: 0 };
    strokeTo(worldPt(e)); AUDIO3.scratch(true); updateButtons();
  });
  cv.addEventListener('pointermove', function(e){
    if (ptrs[e.pointerId]) { ptrs[e.pointerId].x = e.clientX; ptrs[e.pointerId].y = e.clientY; }
    if (gesture) { e.preventDefault(); moveGesture(); return; }
    if (phase !== 'draw' || !stroking || e.pointerId !== activePtr) return;
    e.preventDefault();
    var evs = e.getCoalescedEvents ? e.getCoalescedEvents() : null;
    if (!evs || !evs.length) evs = [e];
    for (var i = 0; i < evs.length; i++) strokeTo(worldPt(evs[i]));
  });
  function up(e){
    if (ptrs[e.pointerId]) { delete ptrs[e.pointerId]; ptrCount = Math.max(0, ptrCount - 1); }
    // lifting out of a pinch ends the camera gesture; a surviving finger does nothing until it
    // is lifted and pressed again, so you never accidentally draw out of a pinch
    if (gesture) { if (ptrCount < 2) { gesture = null; tapStart = null; } return; }
    if (phase === 'ride') { leanInput = 0; return; }
    if (e.pointerId !== activePtr) return;
    activePtr = null;
    if (stroking) {
      stroking = false; AUDIO3.scratch(false); smoothStroke();
      if (curStroke && curStroke.cells.length) strokes.push(curStroke);
      curStroke = null; updateButtons();
    }
    // Double-tap anywhere is a second way to launch, for players who never find the button.
    // It is only ever two genuine TAPS: a gesture that moved is a drawing stroke, and drawing a
    // second stroke quickly must never fire the bike. Suppressed just after a crash, where the
    // tapping is frustration rather than a command.
    if (!isTouch || !tapStart) return;
    var dt2 = nowS() - tapStart.t;
    var moved = Math.abs(e.clientX - tapStart.x) + Math.abs(e.clientY - tapStart.y);
    var isTap = moved < 10 && dt2 < 0.25;
    tapStart = null;
    if (!isTap) { lastTapT = 0; return; }
    var tnow = nowS();
    if (phase === 'draw' && inkUsed > 10 && tnow - lastTapT < 0.35 && tnow - lastCrashT > 0.5) {
      lastTapT = 0; startRide(); return;
    }
    lastTapT = tnow;
  }
  // A throw inside the gesture handlers used to leave the HUD stale — the road was drawn but GO
  // never appeared, which is unrecoverable for the player. Always resync the controls.
  function safeUp(e){
    try { up(e); } catch (err) { stroking = false; activePtr = null; curStroke = null; }
    updateButtons();
  }
  cv.addEventListener('pointerup', safeUp);
  cv.addEventListener('pointercancel', safeUp);
  cv.addEventListener('contextmenu', function(e){ e.preventDefault(); });

  bindTap(el.btnGo, startRide);
  bindTap(el.btnClear, clearStroke);
  bindTap(el.btnUndo, undoStroke);
  bindTap(el.btnRetry, abortRide);
  bindTap(el.btnMute, function(){ var m = AUDIO3.toggleMute(); save.mute = m; persist();
      el.btnMute.textContent = m ? '♪̸' : '♪'; el.btnMute.classList.toggle('off', m);
      if (!m && L) AUDIO3.musicStart(L.theme | 0); else AUDIO3.musicStop();
      toast(m ? 'sound off' : 'sound on', 900);});

function bindTap(node, fn){
  // Tap-vs-draw disambiguation. The start ledge sits near HUD buttons, and a stroke that begins
  // on one used to be swallowed — the single most confusing thing about starting a level. A
  // touch that MOVES is handed to the canvas as ink; only a touch that stays put is a press.
  var downAt = null;
  node.addEventListener('pointerdown', function(e){
    if (phase !== 'draw') { downAt = null; return; }
    downAt = { x: e.clientX, y: e.clientY, id: e.pointerId };
    e.stopPropagation();
  });
  node.addEventListener('pointermove', function(e){
    if (!downAt || e.pointerId !== downAt.id) return;
    if (Math.abs(e.clientX - downAt.x) + Math.abs(e.clientY - downAt.y) > 12) {
      // it's a stroke: hand the pointer to the canvas mid-gesture
      var sx = downAt.x, sy = downAt.y; downAt = null;
      try { node.releasePointerCapture(e.pointerId); } catch(err){}
      cv.dispatchEvent(new PointerEvent('pointerdown', { clientX: sx, clientY: sy, pointerId: e.pointerId, bubbles: true, cancelable: true, isPrimary: e.isPrimary }));
      cv.dispatchEvent(new PointerEvent('pointermove', { clientX: e.clientX, clientY: e.clientY, pointerId: e.pointerId, bubbles: true, cancelable: true, isPrimary: e.isPrimary }));
    }
  });
  node.addEventListener('pointerup', function(e){
    if (phase === 'draw' && downAt && e.pointerId === downAt.id) {
      var moved = Math.abs(e.clientX - downAt.x) + Math.abs(e.clientY - downAt.y) > 12;
      downAt = null;
      if (moved) return;
    } else if (phase === 'draw' && !downAt) {
      // the touch became a stroke and was handed to the canvas; not a press
      return;
    }
    e.preventDefault(); e.stopPropagation(); AUDIO3.unlock(); AUDIO3.click(); fn();
  });
  node.addEventListener('pointercancel', function(){ downAt = null; });
  node.addEventListener('pointerenter', function(){ AUDIO3.hover(); });
}

// ---------------- ride ----------------
// Closes the gaps a player cannot reasonably be expected to draw: the joint at the launch ledge,
// the joint at the flag ledge, and pen-jitter holes. Everything wider than that is a real gap the
// rider has to jump. Free — it costs no ink — and it stays visible after a crash.
function bridgeGaps(){
  function fill(i0, i1, y0, y1){
    for (var i = i0; i <= i1; i++) {
      if (i < 0 || i >= cols) continue;
      var cx = i * DX;
      if (inZone(cx) || inPlat(cx)) continue;
      var f = (i1 === i0) ? 0 : (i - i0) / (i1 - i0);
      ys[i] = y0 + (y1 - y0) * f;
    }
    strokeDirty = true;
  }
  var first = -1, last = -1, i;
  for (i = 0; i < cols; i++) if (ys[i] === ys[i]) { if (first < 0) first = i; last = i; }
  if (first < 0) return;

  var lipI = Math.ceil(plats[0].x1 / DX);
  if (first * DX - plats[0].x1 <= BRIDGE_GAP && Math.abs(ys[first] - plats[0].y) <= BRIDGE_DY) {
    fill(lipI, first - 1, plats[0].y, ys[first]);
  }
  var ledgeI = Math.floor(plats[1].x0 / DX);
  if (plats[1].x0 - last * DX <= BRIDGE_GAP && Math.abs(ys[last] - plats[1].y) <= BRIDGE_DY) {
    fill(last + 1, ledgeI, ys[last], plats[1].y);
  }
  // pen jitter: a hole only a few columns wide between two nearly level ends
  var runEnd = -1;
  for (i = 0; i < cols; i++) {
    if (ys[i] === ys[i]) {
      if (runEnd >= 0 && (i - runEnd) * DX <= MICRO_GAP && Math.abs(ys[i] - ys[runEnd]) <= 20) {
        fill(runEnd + 1, i - 1, ys[runEnd], ys[i]);
      }
      runEnd = i;
    }
  }
}

function startRide(){
  if (phase !== 'draw' || inkUsed <= 10) return;
  bridgeGaps();
  resetBike();
  bike.state = 'ride'; phase = 'ride'; rideT = 0; attempts++;
  camTargetZoom = ZOOM_RIDE;
  // audio starts off, so say so once — otherwise players assume the game is broken/silent
  if (AUDIO3.muted && !save.audioTip) {
    toast('sound is off — ♪ to turn it on', 1800);
    save.audioTip = 1; persist();
  }
  ghostRec = [];
  AUDIO3.go(); AUDIO3.engineStart();
  el.hint.hidden = true;
  updateButtons();
}
function abortRide(){
  AUDIO3.engineStop(); AUDIO3.wind(false);

function fail(kind, sub){
  if (!bike || bike.state !== 'ride') return;
  crashKind = sub || kind;
  lastFail = { kind: kind, sub: crashKind, x: Math.round(bike.x), y: Math.round(bike.y), speed: Math.round(bike.speed), air: bike.airborne, t: Math.round(rideT * 100) / 100 };
  bike.state = 'crash'; bike.crashT = 0; lastCrashT = nowS();
  AUDIO3.engineStop(); AUDIO3.wind(false);
  var sp = bike.speed || 0;
  var fwdVX = bike.airborne ? bike.vx : sp * Math.cos(bike.angle);
  // Two bodies from here: the BIKE and the RIDER, each with one clean, physical impulse chosen
  // by what was hit. No random components — the same crash always looks the same.
  rdX = bike.x; rdY = bike.y - 12; rdSettled = false; rdMounted = false;
  switch (crashKind) {
    case 'fall':
      // rider stays on the bike and the pair simply falls away off the screen — no theatrics
      rdMounted = true;
      crashTimer = 1.9; crashGround = false; crashSpin = 0.9;
      camTargetZoom = 1.35;
      ART3.shake(6); buzz(30); AUDIO3.fall();
      break;
    case 'lava':
      rdMounted = true;                        // both sink together
      bike.vx *= 0.15; bike.vy = 80; crashTimer = 1.5; crashGround = false; crashSpin = 0.6;
      camTargetZoom = 1.8;
      ART3.shake(12); buzz([0, 60, 40, 120]); AUDIO3.crash();
      ART3.fxCrash(bike.x, bike.y, 0, -140);
      break;
    case 'saw':
      // blade kicks the bike back and up, spinning; the rider is flicked higher and further back
      bike.vx = -sp * 0.25 - 70; bike.vy = -300; crashTimer = 1.4; crashGround = true; crashSpin = 8.5;
      rdVX = -sp * 0.35 - 110; rdVY = -430; rdRotV = -7;
      camTargetZoom = 1.95;
      ART3.shake(24); buzz([0, 50, 30, 80]); AUDIO3.crash();
      ART3.fxCrash(bike.x, bike.y, -sp * 0.5, -420);
      break;
    case 'block':
      // classic over-the-bars: the bike stops dead at the wall, the rider keeps going
      bike.vx = -40; bike.vy = -120; crashTimer = 1.5; crashGround = true; crashSpin = -2.6;
      rdVX = Math.max(fwdVX * 0.8, 160); rdVY = -240; rdRotV = 8;
      camTargetZoom = 1.9;
      ART3.shake(26); buzz([0, 70, 40, 90]); AUDIO3.crash();
      ART3.fxCrash(bike.x, bike.y, -sp * 0.4, -260);
      break;
    case 'steep':
      // ran out of hill: the pair just tips over backwards, almost gentle
      rdMounted = true;
      bike.vx = -60; bike.vy = -20; crashTimer = 1.4; crashGround = true; crashSpin = -1.4;
      camTargetZoom = 1.75;
      ART3.shake(7); buzz(25); AUDIO3.crash();
      break;
    default:
      // botched landing: forward cartwheel, rider launched a little ahead of the tumbling bike
      bike.vx = fwdVX * 0.45; bike.vy = -200; crashTimer = 1.4; crashGround = true; crashSpin = 7;
      rdVX = fwdVX * 0.7; rdVY = -300; rdRotV = 6.5;
      camTargetZoom = 1.9;
      ART3.shake(18); buzz([0, 45, 30, 60]); AUDIO3.crash();
      ART3.fxCrash(bike.x, bike.y, bike.vx, -300);
  }
  var q = (bike.x / flag.x > 0.85) ? pick(QUIPS3.close) : pick(QUIPS3[kind] || QUIPS3.crash);
  toast(q, 1150);
  updateButtons();
}

// obstacle animation + collision
function animObs(t){
  for (var i = 0; i < obs.length; i++) {
    var o = obs[i];
    if (o.fired > 0) o.fired = Math.max(0, o.fired - 0.05);
    if (!o.osc) continue;
    var d = Math.sin((t / o.osc.period) * 6.28318 + (o.osc.phase || 0)) * o.osc.amp;
    if (o.osc.axis === 'x') { o.x = o.bx + d; o.y = o.by; } else { o.x = o.bx; o.y = o.by + d; }
  }
}
function hitObstacle(x, y){
  for (var i = 0; i < obs.length; i++) {
    var o = obs[i];
    if (o.type === 'saw'){ var dx = x - o.x, dy = y - o.y; if (dx * dx + dy * dy < (o.r + BR) * (o.r + BR)) return o; }
    else if (o.type === 'block'){
      var cx = clamp(x, o.x, o.x + o.w), cy = clamp(y, o.y, o.y + o.h);
      var ax = x - cx, ay = y - cy; if (ax * ax + ay * ay < BR * BR) return o;
    }
    else if (o.type === 'lava'){ if (x > o.x0 - BR && x < o.x1 + BR && y > o.yTop - BR) return o; }
  }
  return null;
}
function windAt(x, y){
  var a = 0;
  for (var i = 0; i < obs.length; i++) { var o = obs[i];
    if (o.type === 'wind' && x > o.x0 && x < o.x1 && y > o.y0 && y < o.y1) a += o.ax; }
  return a;
}
function padsAt(x, y, grounded){
  for (var i = 0; i < obs.length; i++) {
    var o = obs[i];
    // triggers match the bigger V5 pad art — generous is friendly
    if (o.type === 'boost' && grounded && Math.abs(x - o.x) < 44 && Math.abs(y - o.y) < 38) return o;
    // The spring's whole pulsing column is live: cross anywhere within ~130px above the coil —
    // riding over it, cresting past it, even flying through it — and it throws you. Previously it
    // only fired grounded or falling, so a bump that lifted you just before the coil skipped it.
    if (o.type === 'spring' && Math.abs(x - o.x) < 42 && y > o.y - SPRING_ZONE && y < o.y + 30) return o;
  }
  return null;
}

// convert flips completed in the air into score — on a clean landing or on crossing the flag
function landFlips(){
  if (flips <= 0) return;
  var add = flips * 250;
  trickScore += add;
  trickPop(flips === 1 ? 'FLIP +250' : (flips + '× FLIP +' + add));
  toast(pick(QUIPS3.trick), 900);
  ART3.fxTrick(bike.x, bike.y);
  flips = 0; bike.flips = 0;
}

function physStep(dt){
  var b = bike;
  if (b.state !== 'ride') return;
  rideT += dt;
  // damped spring: the chassis rides above the contact point and settles after every hit
  suspV += (-susp * SUSP_K - suspV * SUSP_C) * dt;
  susp = clamp(susp + suspV * dt, -26, 26);
  squash = Math.max(0, squash - dt * 4.5);
  if (b.airborne) { airT += dt; susp *= Math.max(0, 1 - dt * 2.2); }

  if (!b.airborne) {
    var m = groundSlope(b.x), n = Math.sqrt(1 + m * m);
    var a = ENGINE + G * (m / n) - DRAG * b.speed;
    b.speed += a * dt;
    if (m < -0.18 && b.speed < 26) { b.stallT += dt; if (b.stallT > 0.28 || b.speed <= 0) { fail('steep'); return; } }
    else b.stallT = 0;
    if (b.speed < 0) b.speed = 0;
    var nx = Math.min(b.x + (b.speed / n) * dt, W - 2);
    var gy = groundY(nx);
    b.vx = b.speed / n; b.vy = b.speed * m / n;
    if (gy !== gy) b.airborne = true;
    else {
      var by = b.y + b.vy * dt + 0.5 * G * dt * dt;
      if (gy > by + 1.2) b.airborne = true;
      else if (gy < b.y - STEP_HOP) { fail('crash', 'block'); return; }   // rode into a wall of ink
      else {
        if (gy < b.y - 7) b.speed *= 0.93;
        var prevGy = b.y;
        b.x = nx; b.y = gy; b.dist += b.speed * dt;
        // Pitch across BOTH wheels rather than lying flat on the local slope — this is what
        // makes a bike read as a bike over bumps and crests instead of a sticker on the ground.
        var yR = groundY(b.x - WHEELBASE / 2), yF = groundY(b.x + WHEELBASE / 2);
        b.angle = (yR === yR && yF === yF) ? Math.atan2(yF - yR, WHEELBASE) : Math.atan2(m, 1);
        // suspension takes the hit of whatever the ground just did
        suspV += clamp((gy - prevGy) * 3.2, -260, 260);
        b.lean = lerp(b.lean, clamp(-m * 1.6, -1, 1), Math.min(1, dt * 8));
        if (b.speed > 260 && Math.random() < 0.4) ART3.fxDust(b.x - 15, b.y, b.speed);
      }
    }
    if (!b.airborne) {
      var pad = padsAt(b.x, b.y, true);
      if (pad) {
        if (pad.type === 'boost' && pad.fired <= 0) {
          b.speed = Math.max(b.speed, pad.power); pad.fired = 1;
          AUDIO3.boost(); ART3.fxBoost(pad.x, pad.y, pad.angle); ART3.shake(5);
        } else if (pad.type === 'spring' && pad.fired <= 0) {
          b.airborne = true; b.vx = b.speed; b.vy = -pad.power; pad.fired = 1;
          AUDIO3.spring(); ART3.fxSpring(pad.x, pad.y); ART3.shake(6);
        }
      }
    }
    if (b.airborne) { spinAcc = 0; }
  }

  if (b.airborne) {
    if (isTouch && !seenAir && !save.coached) {   // first time in the air: teach the lean zones
      seenAir = true; el.coach.classList.add('show');
      setTimeout(function(){ el.coach.classList.remove('show'); save.coached = 1; persist(); }, 2600);
    }
    var oldY = b.y, gOld = groundY(b.x);
    var wax = windAt(b.x, b.y);
    if (wax) { b.vx += wax * dt; AUDIO3.wind(true); } else AUDIO3.wind(false);
    b.vy += G * dt;

var baseDrawBike = window.ART3.drawBike;
function drawHead(ctx, r){
  if (!headReady) return;
  ctx.save();
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, 6.28318);
  ctx.clip();
  ctx.drawImage(head, -r, -r, r * 2, r * 2);
  ctx.restore();

  ctx.arc(0, 0, r, 0, 6.28318);
  ctx.lineWidth = 2.2;

window.ART3.drawBike = function(ctx, b, t){
  baseDrawBike.call(window.ART3, ctx, b, t);
  var R = 15;                                   // bobblehead: deliberately oversized
  ctx.save();
  if (b && b.state === 'crash' && b.crashMode === 'thrown') {
    // the thrown rider carries the head with them
    ctx.translate((b.x || 0) + (b.riderDX || 0), (b.y || 0) + (b.riderDY || 0));
    ctx.rotate(b.riderRotAbs || 0);
    ctx.translate(0, -10);
    drawHead(ctx, R);

    ctx.translate(b.x || 0, b.y || 0);
    ctx.rotate(b.angle || 0);

    ctx.rotate(-(b.angle || 0) * 0.35);         // head stays a bit more upright than the bike
    drawHead(ctx, R);
  }
  ctx.restore();
};

  ctx.beginPath(); ctx.ellipse(5, -13, 6, 3.4, -0.5, 0, 6.28318); ctx.fill();
  // grapes: staggered rows narrowing downward
  var rows = [[-6, -4, 3], [-9, 3, 4], [-6, 10, 3], [-3, 16, 2], [0, 21, 1]];
  ctx.fillStyle = '#8a4fd0';
  var hi = 'rgba(220,180,255,0.65)';
  for (var r = 0; r < rows.length; r++) {
    var n = rows[r][2], y0 = rows[r][1];
    for (var i = 0; i < n; i++) {
      var gx = rows[r][0] + i * 6.4;
      ctx.beginPath(); ctx.arc(gx, y0, 4.4, 0, 6.28318); ctx.fill();
    }
  }
  ctx.fillStyle = hi;
  ctx.beginPath(); ctx.arc(-5, -3, 1.4, 0, 6.28318); ctx.fill();
  ctx.beginPath(); ctx.arc(-1, 4, 1.4, 0, 6.28318); ctx.fill();
  ctx.restore();
};

/* ---- the question in the sky of every level ---- */
var baseBg = window.ART3.drawBackground;
window.ART3.drawBackground = function(ctx, cam, W, H, themeIdx, t){
  baseBg.call(window.ART3, ctx, cam, W, H, themeIdx, t);
  ctx.save();
  ctx.font = '900 52px -apple-system, system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(235,245,255,0.10)';
  ctx.fillText('HEY BEAU,', 800, 150);
  ctx.font = '900 64px -apple-system, system-ui, sans-serif';
  ctx.fillStyle = 'rgba(235,245,255,0.13)';
  ctx.fillText('GOT ANY GRAPES?', 800, 218);
  ctx.restore();
};

/* ---- HUD + title dressing ---- */
function dress(){
  var tag = document.getElementById('tag');
  if (tag) tag.textContent = 'got any grapes?';
  var v2 = document.getElementById('v2tag');
  if (v2) v2.textContent = 'BEAU';
  var st = document.createElement('style');
  st.textContent = '#starrow span::before{content:"🍇"!important}' +
                   '#winStars span{font-size:1em}' ;
  document.head.appendChild(st);
  // the win card builds its stars as ★ text — swap them to grapes whenever it changes
  var win = document.getElementById('winStars');
  if (win && window.MutationObserver) {
    new MutationObserver(function(){
      Array.prototype.forEach.call(win.querySelectorAll('span'), function(sp){
        if (sp.textContent !== '🍇') sp.textContent = '🍇';
      });
    }).observe(win, { childList: true, subtree: true });
  }
  document.title = 'INK RIDER · BEAU EDITION';
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', dress);
else dress();
})();

</script>
