<script>

/* ==== art3.js ==== */
/* ============================================================================
   INK RIDER V3 — art3.js — visual layer only. window.ART3
   Direction (locked): "wet neon ink on a dusk sky". The drawn line is the hero:
   white-hot core + electric cyan glow, faked with layered strokes — never
   per-segment shadowBlur. Danger reads hot coral/magenta. UI = chunky dark
   glass, heavy italic display type, mono for anything numeric.
   World is FIXED 1600x760. The game has already applied its camera transform;
   `cam` here is used ONLY for parallax offsets, viewport culling and vignette.
   Plain ES2019, IIFE, zero external assets. See ART API in SPEC3.md.
   ========================================================================== */
(function () {
  'use strict';

  var ART3 = {};
  var TAU = Math.PI * 2;

  /* ------------------------------------------------------------------ utils */

  function hexRgb(h) {                       // '#aabbcc' -> 'r,g,b'
    var n = parseInt(h.slice(1), 16);
    return ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255);
  }
  function h1(n) {                           // deterministic 0..1 hash
    var s = Math.sin(n * 127.1 + 311.7) * 43758.5453;
    return s - Math.floor(s);
  }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function num(v, d) { return (typeof v === 'number' && v === v && v !== Infinity && v !== -Infinity) ? v : d; }
  function nowS() {
    return (typeof performance !== 'undefined' && performance.now ? performance.now() : Date.now()) / 1000;
  }

  /* ---------------------------------------------------------------- QUALITY

     Two knobs, both additive — no existing signature changes.

     1. ART3.setQuality(level)  0 = low, 1 = high (default). The engine calls
        this once it knows the device: low halves the particle cap, thins the
        speed streaks and skips the grain + weather overlays entirely.
     2. Surface size. Every per-frame entry point that receives a ctx records
        the canvas' CSS-pixel area; below ~480k CSS px (any phone, portrait or
        landscape) particle counts, speed streaks and the road's hanging-deck
        detail all step down so the plate does not turn to mush when the
        1600x760 world is squeezed into a 375-wide screen.
  */
  var QUAL = 1;                               // 1 = high (default), 0 = low
  var CAP_HI = 320, CAP_LO = 140;
  var capNow = CAP_HI;
  var surfPx = -1, surfSmall = false;

  function noteSurface(ctx) {                 // cheap: only reacts to a resize
    var c = ctx && ctx.canvas;
    if (!c) return;
    var w = num(c.clientWidth, 0) || num(c.width, 0);
    var h = num(c.clientHeight, 0) || num(c.height, 0);
    var px = w * h;
    if (px === surfPx) return;
    surfPx = px;
    surfSmall = px > 0 && px < 480000;        // ~ anything under 800x600 CSS px
  }
  function lite() { return QUAL === 0 || surfSmall; }
  function pCount(n) {                        // particle count scaler
    var m = QUAL === 0 ? 0.45 : (surfSmall ? 0.68 : 1);
    var v = Math.round(n * m);
    return v < 1 ? 1 : v;
  }
  function deckScale() { return lite() ? 0.6 : 1; }

  ART3.setQuality = function (level) {
    QUAL = num(level, 1) <= 0 ? 0 : 1;
    capNow = QUAL ? CAP_HI : CAP_LO;
    if (pN > capNow) pN = capNow;             // drop the overflow immediately
    return QUAL;
  };

  /* ----------------------------------------------------------------- THEMES

     THEMES[i] shape (also documented in NOTES-art3.md):
     { name,                  display name, used in NOTES / debug only
       sky:[c0,c1,c2,c3],     vertical gradient stops, top -> bottom
       band,                  horizon band wash (extra warmth/chill at the seam)
       sun, sunX, sunY, sunR, celestial body colour, position (fractions), radius (fraction of W)
       starN,                 star count baked into the sky layer
       aurora,                bool: bake soft aurora ribbons into the sky
       ridge,                 'roll' | 'peak' | 'city' | 'dune' | 'cone' | 'ice'
       hillFar,hillMid,hillNear,  the three parallax silhouette fills
       glowFar,               rim-light colour painted on ridge crests
       weather,               'mote' | 'rain' | 'snow' | 'ember'  (cheap live overlay)
       ink, inkCore, inkDeep, drawn-line glow / white-hot core / under-body tint
       accent, danger,        stars+medals / saws, crushers, lava, warnings
       plat, platEdge,        platform slab fill + edge light
       fog }                  grounding haze + vignette tint
  */
  var THEMES = [
    { name: 'Dusk',
      sky: ['#170e38', '#4b2560', '#e0824f', '#2a1636'], band: '#ff9d63',
      sun: '#ffb37a', sunX: 0.72, sunY: 0.58, sunR: 0.034, starN: 24, aurora: false,
      ridge: 'roll', hillFar: '#3a1c63', hillMid: '#241145', hillNear: '#150b2b',
      glowFar: '#ff9f78', weather: 'mote',
      ink: '#40e9ff', inkCore: '#f2feff', inkDeep: '#0d7c9c',
      accent: '#ffd24a', danger: '#ff3d7e',
      plat: '#181134', platEdge: '#7ae6ff', fog: '#170a2c' },

    { name: 'Midnight',
      sky: ['#03061a', '#0a1433', '#243a70', '#050815'], band: '#5f7fd0',
      sun: '#b9d4ff', sunX: 0.22, sunY: 0.26, sunR: 0.028, starN: 120, aurora: true,
      ridge: 'city', hillFar: '#152649', hillMid: '#0d1a35', hillNear: '#060c1f',
      glowFar: '#8fb6ff', weather: 'mote',
      ink: '#54f0ff', inkCore: '#ffffff', inkDeep: '#0b6e97',
      accent: '#ffd24a', danger: '#ff4d6d',
      plat: '#0c1229', platEdge: '#7df2ff', fog: '#050a1c' },

    { name: 'Storm',
      sky: ['#07171c', '#123840', '#3a7580', '#06131a'], band: '#9fe6e0',
      sun: '#c9f6ff', sunX: 0.80, sunY: 0.30, sunR: 0.024, starN: 6, aurora: false,
      ridge: 'peak', hillFar: '#0f333a', hillMid: '#0a232a', hillNear: '#05141a',
      glowFar: '#7fe8dd', weather: 'rain',
      ink: '#46f2d5', inkCore: '#f4fffb', inkDeep: '#0a6e63',
      accent: '#ffe066', danger: '#ff5d8f',
      plat: '#0b2024', platEdge: '#6cf5d8', fog: '#04121a' },

    { name: 'Dawn',
      sky: ['#2b1738', '#8a3a58', '#f7b06a', '#3a1c30'], band: '#ffd9a0',
      sun: '#ffe6bd', sunX: 0.28, sunY: 0.60, sunR: 0.040, starN: 6, aurora: false,
      ridge: 'dune', hillFar: '#6b3059', hillMid: '#421f3f', hillNear: '#22102a',
      glowFar: '#ffcf9a', weather: 'mote',
      ink: '#3fd9ff', inkCore: '#f6feff', inkDeep: '#0e6f92',
      accent: '#ffdf6e', danger: '#ff3d7e',
      plat: '#241332', platEdge: '#79e0ff', fog: '#28122c' },

    { name: 'Ember',
      sky: ['#180611', '#4d1210', '#ab3418', '#1d0407'], band: '#ff8c3a',
      sun: '#ff9a45', sunX: 0.62, sunY: 0.52, sunR: 0.030, starN: 10, aurora: false,
      ridge: 'cone', hillFar: '#4a1414', hillMid: '#30090d', hillNear: '#180305',
      glowFar: '#ff7a33', weather: 'ember',
      ink: '#5ce0ff', inkCore: '#ffffff', inkDeep: '#0a6d92',
      accent: '#ffd24a', danger: '#ff2f6a',
      plat: '#210a10', platEdge: '#7fe4ff', fog: '#1a0407' },

    { name: 'Arctic',
      sky: ['#061729', '#12405f', '#79c2d6', '#04101c'], band: '#d8f6ff',
      sun: '#f0fdff', sunX: 0.38, sunY: 0.22, sunR: 0.026, starN: 34, aurora: true,
      ridge: 'ice', hillFar: '#1d5570', hillMid: '#123c53', hillNear: '#092132',
      glowFar: '#c8f4ff', weather: 'snow',
      ink: '#66e6ff', inkCore: '#ffffff', inkDeep: '#0d6d95',
      accent: '#ffe27a', danger: '#ff4f86',
      plat: '#0b2434', platEdge: '#9df0ff', fog: '#05121f' }
  ];
  ART3.THEMES = THEMES;
  var NT = THEMES.length;

  // precomputed 'r,g,b' strings, one per theme
  var INK = [], ACC = [], DAN = [], SUN = [], FOG = [], DEEP = [], GLOW = [];
  (function () {
    for (var i = 0; i < NT; i++) {
      INK.push(hexRgb(THEMES[i].ink));
      ACC.push(hexRgb(THEMES[i].accent));
      DAN.push(hexRgb(THEMES[i].danger));
      SUN.push(hexRgb(THEMES[i].sun));
      FOG.push(hexRgb(THEMES[i].fog));
      DEEP.push(hexRgb(THEMES[i].inkDeep));
      GLOW.push(hexRgb(THEMES[i].glowFar));
    }
  })();
  function ti(i) { i = num(i, 0) | 0; i = ((i % NT) + NT) % NT; return i; }
  function T(i) { return THEMES[ti(i)]; }

  /* -------------------------------------------------------------------- CSS
     MOBILE-FIRST. The base rules target a 375x667 phone; every media query
     below only ever ADDS back (min-width / min-height), except one short-
     landscape tightening pass. All interactive controls live inside the
     env(safe-area-inset-*) box. Bottom-right is the right thumb: GO / RETRY
     live there and nothing informational is placed under it. The top bar is
     one strip that never wraps — it sheds the ink label, the level name and
     the star pips as the screen narrows.
     Display type: system-ui 900 italic. Data type: system mono, tabular.
     NOTE: no math function (min/clamp) is ever put inside the `font:`
     shorthand — the `/line-height` slash is ambiguous there in some parsers.
  */
  var DISP = '-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif';
  var MONO = 'ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace';

  ART3.CSS = [
    ':root{',
    ' --ink:#5ce9ff;--ink-2:#27c8ef;--core:#eafdff;--gold:#ffd24a;--hot:#ff3d7e;',
    ' --txt:#eef9ff;--dim:rgba(206,231,249,.66);--faint:rgba(206,231,249,.40);',
    ' --glass:rgba(11,15,34,.78);--glass2:rgba(6,8,22,.9);--edge:rgba(122,230,255,.24);',
    ' --disp:' + DISP + ';--mono:' + MONO + ';',
    ' --sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);',
    ' --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);',
    ' --pad:10px;--gut:12px;',
    ' --bar:54px;',          /* top-bar content height (>= --tap + 6) */
    ' --tap:48px;',          /* top-bar icon buttons */
    ' --sm:64px;',           /* undo / clear / win-card actions */
    ' --go:78px;',           /* GO + RETRY */
    ' --ctl:78px;',          /* height of the bottom control row */
    ' --cgap:8px;',
    ' --vh:100vh;}',
    /* smallest stable viewport unit available -> "fits with no scrolling" */
    '@supports (height:100dvh){:root{--vh:100dvh;}}',
    '@supports (height:100svh){:root{--vh:100svh;}}',

    'html,body{margin:0;padding:0;height:100%;width:100%;overflow:hidden;',
    ' background:#0a0618;overscroll-behavior:none;}',
    '#app{position:fixed;inset:0;overflow:hidden;background:#0a0618;font-family:var(--disp);',
    ' color:var(--txt);-webkit-user-select:none;user-select:none;',
    ' -webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;touch-action:none;}',
    '#app,#app *{box-sizing:border-box;}',
    '#cv{position:absolute;inset:0;width:100%;height:100%;display:block;',
    ' touch-action:none;cursor:crosshair;}',
    '[hidden]{display:none!important;}',

    /* ---- HUD shell: transparent to pointers, its controls are not ---- */
    '#hud{position:absolute;inset:0;pointer-events:none;z-index:5;}',
    '#hud button{pointer-events:auto;}',

    /* ---- base control: chunky dark glass. Deliberately NO backdrop-filter on
           buttons — a dozen blurred layers is the most expensive thing on an
           older iPhone. Screens, toast and tips still get real blur. ---- */
    '#app button{appearance:none;-webkit-appearance:none;border:1px solid var(--edge);',
    ' background:var(--glass);color:var(--txt);',
    ' font:800 16px/1 var(--disp);letter-spacing:.02em;',
    ' min-width:48px;min-height:48px;padding:0 18px;border-radius:999px;',
    ' box-shadow:0 8px 22px rgba(3,2,14,.5),inset 0 1px 0 rgba(255,255,255,.10);',
    ' cursor:pointer;touch-action:manipulation;',
    ' transition:transform .12s ease,filter .12s ease;}',
    '#app button:hover{filter:brightness(1.12);}',
    '#app button:active{transform:scale(.93);filter:brightness(1.28);}',
    '#app button:focus-visible{outline:2px solid var(--ink);outline-offset:3px;}',
    '#app button:disabled{cursor:default;filter:grayscale(.65) brightness(.62);}',

    /* ---- top bar: ONE strip, never two lines, never taller than --bar ---- */
    '#topbar{position:absolute;left:0;right:0;top:0;',
    ' height:calc(var(--bar) + var(--st));',
    ' display:flex;flex-wrap:nowrap;align-items:center;gap:8px;',
    /* the right end reserves two slots: the engine parks #fsBtn and #flipBtn
       outside the bar, and without the reserve they land on #btnMute. */
    ' padding:var(--st) calc(var(--sr) + var(--pad) + 2 * var(--tap) + 14px)',
    '  0 calc(var(--sl) + var(--pad));',
    ' background:linear-gradient(180deg,rgba(5,4,18,.78),rgba(5,4,18,0));}',
    '#topbar:after{content:"";position:absolute;left:calc(var(--sl) + var(--pad));',
    ' right:calc(var(--sr) + var(--pad));bottom:0;height:1px;',
    ' background:linear-gradient(90deg,rgba(92,233,255,0),rgba(92,233,255,.38),rgba(92,233,255,0));}',
    '#btnMenu,#btnMute,#fsBtn,#flipBtn{width:var(--tap);min-width:var(--tap);',
    ' height:var(--tap);min-height:var(--tap);padding:0;font-size:19px;',
    ' flex:0 0 auto;border-radius:14px;}',
    '#btnMute.off{color:var(--faint);border-color:rgba(255,255,255,.10);}',
    /* #fsBtn / #flipBtn work either way: as flex children of #topbar they are
       simply the right-most items; parked outside the bar (which is what the
       engine does) they are pinned into the reserved top-right slots. */
    '#hud>#fsBtn,#app>#fsBtn,#hud>#flipBtn,#app>#flipBtn{position:absolute;',
    ' z-index:16;top:calc(var(--st) + 3px);}',
    '#hud>#flipBtn,#app>#flipBtn{right:calc(var(--sr) + var(--pad));}',
    '#hud>#fsBtn,#app>#fsBtn{right:calc(var(--sr) + var(--pad) + var(--tap) + 6px);}',

    /* level name, star pips and ink label are the first things to go */
    '#lvlname{display:none;flex:0 1 auto;min-width:0;font-weight:900;font-style:italic;',
    ' font-size:clamp(13px,3.2vw,17px);line-height:1;letter-spacing:-.01em;',
    ' text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;',
    ' text-shadow:0 2px 10px rgba(3,2,14,.9);}',
    '#inkwrap{flex:1 1 80px;min-width:52px;display:flex;align-items:center;gap:8px;}',
    '#inklabel{display:none;font-family:var(--mono);font-weight:700;font-size:9px;',
    ' line-height:1;letter-spacing:.22em;color:var(--faint);flex:0 0 auto;}',
    '#inkbar{flex:1 1 auto;height:10px;border-radius:6px;background:rgba(6,9,24,.72);',
    ' border:1px solid rgba(122,230,255,.20);overflow:hidden;min-width:44px;}',
    '#inkfill{height:100%;width:100%;border-radius:6px;',
    ' background:linear-gradient(90deg,var(--ink-2),var(--ink) 62%,var(--core));',
    ' box-shadow:0 0 10px rgba(92,233,255,.6);transition:width .08s linear;}',
    '#inkfill.low{background:linear-gradient(90deg,#c41c4e,var(--hot) 60%,#ffa8c4);',
    ' box-shadow:0 0 10px rgba(255,61,126,.65);',
    ' animation:inklow .48s ease-in-out infinite alternate;}',
    '@keyframes inklow{from{opacity:.55}to{opacity:1}}',
    '#timer{flex:0 0 auto;font-family:var(--mono);font-weight:800;line-height:1;',
    ' font-size:clamp(12px,3.2vw,15px);font-variant-numeric:tabular-nums;',
    ' letter-spacing:.02em;color:var(--core);padding:5px 8px;border-radius:9px;',
    ' background:rgba(6,9,24,.66);border:1px solid rgba(122,230,255,.16);}',
    '#timer.warn{color:#ffd7e4;border-color:rgba(255,61,126,.42);}',
    '#starrow{display:none;flex:0 0 auto;gap:5px;align-items:center;}',
    '#starrow span{width:13px;height:13px;background:rgba(255,255,255,.16);',
    ' clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);}',
    '#starrow span.lit{background:linear-gradient(160deg,#fff3c4,var(--gold) 55%,#e0a020);',
    ' filter:drop-shadow(0 0 6px rgba(255,210,74,.7));}',

    /* ---- bottom controls: left = undo/clear, right thumb = GO / RETRY ---- */
    '#btnUndo,#btnClear{position:absolute;bottom:calc(var(--sb) + var(--gut));',
    ' width:var(--sm);min-width:var(--sm);height:var(--sm);min-height:var(--sm);',
    ' padding:0;font-size:26px;border-radius:20px;}',
    '#btnUndo{left:calc(var(--sl) + var(--gut));}',
    '#btnClear{left:calc(var(--sl) + var(--gut) + var(--sm) + 10px);',
    ' border-color:rgba(255,61,126,.30);}',
    '#btnGo,#btnRetry{position:absolute;right:calc(var(--sr) + var(--gut));',
    ' bottom:calc(var(--sb) + var(--gut));height:var(--go);min-height:var(--go);',
    ' min-width:var(--go);border-radius:999px;font-family:var(--disp);',
    ' font-weight:900;font-style:italic;line-height:1;}',
    '#btnGo{padding:0 clamp(22px,7vw,44px);font-size:clamp(25px,7vw,32px);',
    ' letter-spacing:.04em;color:#04222c;border-color:rgba(255,255,255,.6);',
    ' background:linear-gradient(180deg,#a6f7ff,var(--ink) 46%,#12a4cf);',
    ' text-shadow:0 1px 0 rgba(255,255,255,.4);',
    ' animation:goPulse 1.6s ease-in-out infinite;}',
    '#btnGo:disabled{animation:none;}',
    '@keyframes goPulse{0%,100%{box-shadow:0 0 0 0 rgba(92,233,255,.5),0 10px 26px rgba(3,6,22,.55);}',
    ' 50%{box-shadow:0 0 0 15px rgba(92,233,255,0),0 10px 26px rgba(3,6,22,.55);}}',
    '#btnRetry{padding:0 clamp(18px,5.4vw,34px);font-size:clamp(17px,4.6vw,23px);',
    ' letter-spacing:.06em;border-color:rgba(255,61,126,.5);color:#ffd7e6;',
    ' background:linear-gradient(180deg,rgba(92,17,50,.92),rgba(44,7,26,.88));}',

    /* ---- hint: ABOVE the control row, full width, never under a thumb ---- */
    '#hint{position:absolute;left:calc(var(--sl) + var(--gut));',
    ' right:calc(var(--sr) + var(--gut));',
    ' bottom:calc(var(--sb) + var(--ctl) + var(--gut) + 10px);',
    ' text-align:center;font-family:var(--mono);font-weight:800;line-height:1.35;',
    ' font-size:clamp(10px,2.7vw,12px);letter-spacing:.14em;text-transform:uppercase;',
    ' color:var(--dim);text-shadow:0 2px 10px rgba(3,2,14,.95);pointer-events:none;}',
    'body.riding #hint{opacity:.45;}',

    /* ---- keyboard strip: desktop only, and only when the centre is free ---- */
    '#keys{display:none;position:absolute;transform:translateX(-50%);',
    ' left:calc(var(--sl) + (100% - var(--sl) - var(--sr)) / 2);',
    ' bottom:calc(var(--sb) + 22px);padding:7px 16px;border-radius:999px;',
    ' background:rgba(6,8,22,.55);border:1px solid rgba(122,230,255,.14);',
    ' font:700 11px/1 var(--mono);letter-spacing:.10em;color:var(--faint);',
    ' white-space:nowrap;pointer-events:none;}',
    'body.kbd.riding #keys{opacity:.5;}',

    /* ---- toast / trick popup ---- */
    '#toast{position:absolute;top:calc(var(--st) + var(--bar) + 16px);',
    ' left:calc(var(--sl) + (100% - var(--sl) - var(--sr)) / 2);',
    ' transform:translate(-50%,0);max-width:calc(100% - var(--sl) - var(--sr) - 28px);',
    ' padding:10px 18px;border-radius:999px;background:var(--glass2);',
    ' -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);',
    ' border:1px solid rgba(122,230,255,.26);font-family:var(--disp);',
    ' font-weight:900;font-style:italic;line-height:1.15;',
    ' font-size:clamp(15px,4vw,20px);letter-spacing:.01em;text-align:center;',
    ' opacity:0;pointer-events:none;z-index:12;box-shadow:0 12px 32px rgba(3,2,14,.62);}',
    '#toast.show{animation:toastGo 1.5s cubic-bezier(.2,1.4,.4,1) both;}',
    '@keyframes toastGo{0%{opacity:0;transform:translate(-50%,12px) scale(.7);}',
    ' 14%{opacity:1;transform:translate(-50%,0) scale(1.07);}',
    ' 22%{transform:translate(-50%,0) scale(1);}78%{opacity:1;}',
    ' 100%{opacity:0;transform:translate(-50%,-18px) scale(.96);}}',

    /* ---- motion-safe fallbacks ---- */
    '@media (prefers-reduced-motion:reduce){',
    ' #btnGo,#btnPlay,#inkfill.low,#rotate,#coach>*,#onboard .hand:after{',

    ' #rotate{opacity:.8;transform:translateX(-50%);}',
    ' #coach>*{opacity:1;transform:none;}',
    ' #toast.show,#trickpop.show{animation:fadeHold 1.3s linear both;}',
    ' @keyframes fadeHold{0%{opacity:0;}8%{opacity:1;}82%{opacity:1;}100%{opacity:0;}}',
    ' #installTip.show{animation:none;}',
    ' #winCard.show #winStars span,#winCard.show #winMedal{',

    ' #app button:active{transform:none;}}'
  ].join('\n');

  /* ------------------------------------------------- viewport + parallax bg */

  var PAD = 190, PADY = 120;
  var VR = { x0: 0, y0: 0, x1: 0, y1: 0, w: 0, h: 0 };

  function visRect(cam, W, H) {
    var z = num(cam && cam.zoom, 1);
    if (!(z > 0.05)) z = 1;
    var cx = num(cam && cam.x, W / 2), cy = num(cam && cam.y, H / 2);
    var vw = W / z, vh = H / z;
    VR.x0 = cx - vw / 2; VR.x1 = cx + vw / 2;
    VR.y0 = cy - vh / 2; VR.y1 = cy + vh / 2;
    VR.w = vw; VR.h = vh;
    return VR;
  }

  // ridge generators -------------------------------------------------------
  function ridgeY(kind, x, base, amp, seed) {
    var y;
    if (kind === 'peak' || kind === 'ice') {
      // jagged: triangle wave stack
      var tw = Math.abs(((x * 0.0075 + seed) % 2) - 1);
      var tw2 = Math.abs(((x * 0.021 + seed * 1.7) % 2) - 1);
      y = base - amp * (0.35 + tw * 0.9) - amp * 0.3 * tw2;
      if (kind === 'ice') y += Math.sin(x * 0.05 + seed) * amp * 0.06;
      return y;
    }
    if (kind === 'cone') {
      var c = Math.abs(((x * 0.0042 + seed) % 2) - 1);
      y = base - amp * (0.15 + Math.pow(c, 1.7) * 1.5);
      return y + Math.sin(x * 0.03 + seed) * amp * 0.05;
    }
    if (kind === 'dune') {
      return base
        + Math.sin(x * 0.0042 + seed) * amp * 1.1
        + Math.sin(x * 0.0113 + seed * 2.3) * amp * 0.28;
    }
    // 'roll' default
    return base
      + Math.sin(x * 0.0056 + seed) * amp
      + Math.sin(x * 0.0163 + seed * 2.7) * amp * 0.34
      + Math.sin(x * 0.0405 + seed * 5.1) * amp * 0.11;
  }

  function paintRidge(g, cw, ch, kind, base, amp, seed, fill, glowRgb, glowA) {
    var x, y;
    g.beginPath();
    g.moveTo(0, ch);
    if (kind === 'city') {
      // skyline: blocky towers marching along
      var bx = 0, i = 0;
      g.lineTo(0, base);
      while (bx < cw) {
        var bw = 22 + h1(i * 3.3 + seed) * 46;
        var bh = amp * (0.25 + h1(i * 7.7 + seed * 2) * 1.5);
        g.lineTo(bx, base - bh);
        g.lineTo(bx + bw, base - bh);
        bx += bw; i++;
      }
      g.lineTo(cw, base);
    } else {
      for (x = 0; x <= cw; x += 12) {
        y = ridgeY(kind, x, base, amp, seed);
        if (x === 0) g.lineTo(0, y); else g.lineTo(x, y);
      }
    }
    g.lineTo(cw, ch);
    g.closePath();
    g.fillStyle = fill;
    g.fill();

    // crest rim light: thin stroke riding the silhouette top
    if (glowA > 0) {
      g.beginPath();
      if (kind === 'city') {
        var bx2 = 0, j = 0;
        while (bx2 < cw) {
          var bw2 = 22 + h1(j * 3.3 + seed) * 46;
          var bh2 = amp * (0.25 + h1(j * 7.7 + seed * 2) * 1.5);
          g.moveTo(bx2, base - bh2);
          g.lineTo(bx2 + bw2, base - bh2);
          bx2 += bw2; j++;
        }
      } else {
        for (x = 0; x <= cw; x += 12) {
          y = ridgeY(kind, x, base, amp, seed);
          if (x === 0) g.moveTo(0, y); else g.lineTo(x, y);
        }
      }
      g.strokeStyle = 'rgba(' + glowRgb + ',' + glowA + ')';
      g.lineWidth = 1.6;
      g.stroke();
    }

    // city windows / ember cone glow: one-time detail baked in
    if (kind === 'city') {
      g.fillStyle = 'rgba(255,214,140,0.16)';
      for (var wI = 0; wI < 220; wI++) {
        var wx = h1(wI * 1.31 + seed) * cw;
        var wy = base - h1(wI * 2.77 + seed * 3) * amp * 1.2;
        if (wy > base - 6) continue;
        g.fillRect(wx, wy, 2, 3);
      }
    }
    if (kind === 'cone') {
      g.strokeStyle = 'rgba(255,140,60,0.30)';
      g.lineWidth = 2;
      for (var lI = 0; lI < 7; lI++) {
        var lx = h1(lI * 5.1 + seed) * cw;
        var ly = ridgeY(kind, lx, base, amp, seed);
        g.beginPath();
        g.moveTo(lx, ly + 2);
        g.lineTo(lx + (h1(lI) - 0.5) * 26, ly + 40 + h1(lI * 2) * 50);
        g.stroke();
      }
    }
    if (kind === 'ice') {
      g.strokeStyle = 'rgba(210,246,255,0.16)';
      g.lineWidth = 1;
      for (var fI = 0; fI < 40; fI++) {
        var fx = h1(fI * 4.4 + seed) * cw;
        var fy = ridgeY(kind, fx, base, amp, seed);
        g.beginPath();
        g.moveTo(fx, fy + 3);
        g.lineTo(fx + 9, fy + 30 + h1(fI) * 24);
        g.stroke();
      }
    }
  }

  function paintProps(g, cw, ch, kind, base, amp, seed, fill) {
    // near-layer props: pylons / masts / pines, silhouetted
    var n = 7;
    g.fillStyle = fill;
    g.strokeStyle = fill;
    for (var i = 0; i < n; i++) {
      var px = 40 + h1(i * 9.7 + seed) * (cw - 80);
      var py = ridgeY(kind === 'city' ? 'roll' : kind, px, base, amp, seed) + 4;
      var hh = 26 + h1(i * 3.1 + seed * 2) * 44;
      if (kind === 'ice' || kind === 'peak') {          // masts
        g.lineWidth = 2;
        g.beginPath(); g.moveTo(px, py); g.lineTo(px, py - hh); g.stroke();
        g.lineWidth = 1.4;
        g.beginPath(); g.moveTo(px - 7, py - hh * 0.7); g.lineTo(px + 7, py - hh * 0.7); g.stroke();
      } else if (kind === 'city' || kind === 'cone') {  // pylons
        g.lineWidth = 2;
        g.beginPath(); g.moveTo(px, py); g.lineTo(px, py - hh); g.stroke();
        g.beginPath();
        g.moveTo(px - 9, py - hh * 0.62); g.lineTo(px + 9, py - hh * 0.62);
        g.moveTo(px - 6, py - hh * 0.85); g.lineTo(px + 6, py - hh * 0.85);
        g.stroke();
      } else {                                          // pines
        g.beginPath();
        g.moveTo(px, py - hh);
        g.lineTo(px + hh * 0.26, py);
        g.lineTo(px - hh * 0.26, py);
        g.closePath();
        g.fill();
      }
    }
  }

  function mkCanvas(w, h) {
    var c;
    if (typeof document !== 'undefined' && document.createElement) {
      c = document.createElement('canvas');
    } else {
      c = { width: 0, height: 0, getContext: function () { return null; } };
    }
    c.width = Math.max(1, Math.round(w));
    c.height = Math.max(1, Math.round(h));
    return c;
  }

  function buildSky(W, H, idx) {
    var th = T(idx), cw = W + PAD * 2, ch = H + PADY * 2;
    var c = mkCanvas(cw, ch);
    var g = c.getContext && c.getContext('2d');
    if (!g) return { c: c, wx: -PAD, wy: -PADY, p: 0.90 };

    var sky = g.createLinearGradient(0, 0, 0, ch);
    sky.addColorStop(0, th.sky[0]);
    sky.addColorStop(0.44, th.sky[1]);
    sky.addColorStop(0.71, th.sky[2]);
    sky.addColorStop(1, th.sky[3]);
    g.fillStyle = sky;
    g.fillRect(0, 0, cw, ch);

    // stars, upper half only, two sizes
    for (var i = 0; i < th.starN; i++) {
      var sx = h1(i * 13.7 + idx * 4.1) * cw;
      var sy = h1(i * 7.3 + idx * 9.3) * ch * 0.52;
      var sa = 0.22 + h1(i * 3.1) * 0.66;
      var ss = h1(i * 5.9) < 0.86 ? 1 : 2;
      g.fillStyle = 'rgba(255,244,226,' + sa.toFixed(2) + ')';
      g.fillRect(sx, sy, ss, ss);
    }

    // aurora ribbons (baked, cheap at runtime)
    if (th.aurora) {
      g.save();
      g.globalCompositeOperation = 'lighter';
      for (var a = 0; a < 3; a++) {
        var seed = idx * 3.7 + a * 5.3;
        var amp = 26 + h1(seed) * 40;
        var yb = ch * (0.16 + a * 0.09);
        var gr = g.createLinearGradient(0, yb - amp * 2, 0, yb + amp * 2.6);
        gr.addColorStop(0, 'rgba(' + GLOW[idx] + ',0)');
        gr.addColorStop(0.45, 'rgba(' + GLOW[idx] + ',0.13)');
        gr.addColorStop(1, 'rgba(' + INK[idx] + ',0)');
        g.fillStyle = gr;
        g.beginPath();
        for (var x = 0; x <= cw; x += 20) {
          g.lineTo(x, yb + Math.sin(x * 0.004 + seed) * amp + Math.sin(x * 0.011 + seed * 2) * amp * 0.4);
        }
        for (var x2 = cw; x2 >= 0; x2 -= 20) {
          g.lineTo(x2, yb + 74 + Math.sin(x2 * 0.0035 + seed * 1.3) * amp * 0.8);
        }
        g.closePath();
        g.fill();
      }
      g.restore();
    }

    // celestial body + halo
    var bx = th.sunX * cw, by = th.sunY * ch, br = W * th.sunR, hr = W * 0.30;
    var halo = g.createRadialGradient(bx, by, 0, bx, by, hr);
    halo.addColorStop(0, 'rgba(' + SUN[idx] + ',0.5)');
    halo.addColorStop(0.34, 'rgba(' + SUN[idx] + ',0.16)');
    halo.addColorStop(1, 'rgba(' + SUN[idx] + ',0)');
    g.fillStyle = halo;
    g.fillRect(bx - hr, by - hr, hr * 2, hr * 2);
    g.fillStyle = 'rgba(' + SUN[idx] + ',0.94)';
    g.beginPath(); g.arc(bx, by, br, 0, TAU); g.fill();
    // horizon band wash sitting on the seam
    var bandY = ch * 0.62;
    var bg2 = g.createLinearGradient(0, bandY - 40, 0, bandY + 90);
    bg2.addColorStop(0, 'rgba(' + hexRgb(th.band) + ',0)');
    bg2.addColorStop(0.5, 'rgba(' + hexRgb(th.band) + ',0.16)');
    bg2.addColorStop(1, 'rgba(' + hexRgb(th.band) + ',0)');
    g.fillStyle = bg2;
    g.fillRect(0, bandY - 40, cw, 130);

    // cloud slabs, flat and graphic
    var nc = th.weather === 'rain' ? 9 : 5;
    for (var ci = 0; ci < nc; ci++) {
      var cx2 = h1(ci * 11.3 + idx) * cw;
      var cy2 = ch * (0.10 + h1(ci * 2.9 + idx * 3) * 0.42);
      var cwid = 90 + h1(ci * 5.1) * 260;
      var chei = 8 + h1(ci * 7.9) * 16;
      g.fillStyle = 'rgba(' + FOG[idx] + ',' + (0.16 + h1(ci) * 0.2).toFixed(2) + ')';
      g.beginPath();
      if (g.ellipse) g.ellipse(cx2, cy2, cwid / 2, chei / 2, 0, 0, TAU);
      else g.arc(cx2, cy2, chei / 2, 0, TAU);
      g.fill();
    }
    return { c: c, wx: -PAD, wy: -PADY, p: 0.90 };
  }

  function buildRidge(W, H, idx, tier) {
    var th = T(idx), cw = W + PAD * 2;
    var topFy = tier === 0 ? 0.36 : (tier === 1 ? 0.48 : 0.60);
    var wy = H * topFy;
    var ch = H - wy + PADY * 2;
    var c = mkCanvas(cw, ch);
    var g = c.getContext && c.getContext('2d');
    var p = tier === 0 ? 0.70 : (tier === 1 ? 0.46 : 0.22);
    if (!g) return { c: c, wx: -PAD, wy: wy - PADY, p: p };

    var base = ch * (tier === 0 ? 0.46 : (tier === 1 ? 0.44 : 0.40));
    var amp = H * (tier === 0 ? 0.075 : (tier === 1 ? 0.062 : 0.05));
    var fill = tier === 0 ? th.hillFar : (tier === 1 ? th.hillMid : th.hillNear);
    var seed = idx * 3.1 + tier * 6.7 + 1.3;

    paintRidge(g, cw, ch, th.ridge, base, amp, seed, fill,
      GLOW[idx], tier === 0 ? 0.22 : (tier === 1 ? 0.13 : 0.07));
    if (tier === 2) paintProps(g, cw, ch, th.ridge, base, amp, seed + 2.2, fill);

    // depth haze washing over the layer bottom
    var hz = g.createLinearGradient(0, base - amp, 0, ch);
    hz.addColorStop(0, 'rgba(' + FOG[idx] + ',0)');
    hz.addColorStop(1, 'rgba(' + FOG[idx] + ',' + (tier === 0 ? 0.55 : (tier === 1 ? 0.4 : 0.25)) + ')');
    g.fillStyle = hz;
    g.fillRect(0, base - amp, cw, ch - (base - amp));

    return { c: c, wx: -PAD, wy: wy - PADY, p: p };
  }

  var LAY = null, layKey = '';
  function layers(W, H, idx) {
    var key = (W | 0) + 'x' + (H | 0) + ':' + idx;
    if (LAY && key === layKey) return LAY;
    LAY = [buildSky(W, H, idx), buildRidge(W, H, idx, 0), buildRidge(W, H, idx, 1), buildRidge(W, H, idx, 2)];
    layKey = key;
    return LAY;
  }

  // grain tile + vignette, cached once (unit-space gradient re-used under any transform)
  var grainPat = null, grainTried = false, vigGrad = null, vigTried = false;
  function grain(ctx) {
    if (grainTried) return grainPat;
    grainTried = true;
    try {
      var c = mkCanvas(64, 64), g = c.getContext('2d');
      if (!g) return null;
      for (var i = 0; i < 900; i++) {
        var a = h1(i * 1.7) * 0.06;
        g.fillStyle = 'rgba(255,255,255,' + a.toFixed(3) + ')';
        g.fillRect(h1(i * 3.3) * 64, h1(i * 7.1) * 64, 1, 1);
      }
      grainPat = ctx.createPattern(c, 'repeat');
    } catch (e) { grainPat = null; }
    return grainPat;
  }
  function vignette(ctx) {
    if (vigTried) return vigGrad;
    vigTried = true;
    try {
      var g = ctx.createRadialGradient(0, 0, 0.30, 0, 0, 1.02);
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(0.62, 'rgba(0,0,0,0.10)');
      g.addColorStop(1, 'rgba(0,0,0,0.52)');
      vigGrad = g;
    } catch (e) { vigGrad = null; }
    return vigGrad;
  }

  function blit(ctx, L, dx, dy, v) {
    var c = L.c;
    if (!c || !c.width || !c.height) return;
    var ox = L.wx + dx, oy = L.wy + dy;
    var sx = v.x0 - ox, sy = v.y0 - oy;
    var sw = v.w, sh = v.h;
    if (sx < 0) { sw += sx; sx = 0; }
    if (sy < 0) { sh += sy; sy = 0; }
    if (sx + sw > c.width) sw = c.width - sx;
    if (sy + sh > c.height) sh = c.height - sy;
    if (!(sw > 0.5) || !(sh > 0.5)) return;
    ctx.drawImage(c, sx, sy, sw, sh, ox + sx, oy + sy, sw, sh);
  }

  ART3.drawBackground = function (ctx, cam, W, H, themeIdx, t) {
    var idx = ti(themeIdx);
    noteSurface(ctx);
    W = num(W, 1600); H = num(H, 760); t = num(t, 0);
    var v = visRect(cam, W, H);
    var L = layers(W, H, idx);
    var dxc = num(cam && cam.x, W / 2) - W / 2;
    var dyc = num(cam && cam.y, H / 2) - H / 2;

    // 4 culled 1:1 blits: sky, far, mid, near — parallax from cam.x, lift from cam.y
    for (var i = 0; i < L.length; i++) {
      blit(ctx, L[i], L[i].p * dxc, L[i].p * 0.38 * dyc, v);
    }

    // low quality stops here: the plate is already 4 blits, the overlays are
    // the only per-pixel work left in the background pass.
    if (QUAL === 0) return;

    // live weather over the plate, deterministic, zero allocation
    var th = THEMES[idx], wx = v.x0, wy = v.y0, ww = v.w, wh = v.h;
    var i2, px, py, a;
    if (th.weather === 'rain') {
      ctx.strokeStyle = 'rgba(190,240,255,0.16)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (i2 = 0; i2 < 46; i2++) {
        px = wx + ((h1(i2 * 2.3) * 1600 + t * 240 + i2 * 37) % 1600) * (ww / 1600);
        py = wy + ((h1(i2 * 5.7) * 760 + t * 900) % 760) * (wh / 760);
        ctx.moveTo(px, py); ctx.lineTo(px - 5, py + 22);
      }
      ctx.stroke();
    } else if (th.weather === 'snow') {
      for (i2 = 0; i2 < 34; i2++) {
        px = wx + ((h1(i2 * 3.1) * 1600 + t * (14 + h1(i2) * 26) + Math.sin(t * 0.7 + i2) * 22) % 1600) * (ww / 1600);
        py = wy + ((h1(i2 * 6.7) * 760 + t * (34 + h1(i2 * 2) * 46)) % 760) * (wh / 760);
        ctx.fillStyle = 'rgba(240,252,255,' + (0.2 + h1(i2 * 9) * 0.4).toFixed(2) + ')';
        ctx.fillRect(px, py, 2, 2);
      }
    } else if (th.weather === 'ember') {
      for (i2 = 0; i2 < 26; i2++) {
        px = wx + ((h1(i2 * 4.3) * 1600 + Math.sin(t * 0.6 + i2 * 1.7) * 40) % 1600) * (ww / 1600);
        py = wy + wh - ((t * (30 + h1(i2) * 70) + h1(i2 * 8.1) * 760) % 760) * (wh / 760);
        a = 0.16 + 0.34 * (0.5 + 0.5 * Math.sin(t * 3 + i2));
        ctx.fillStyle = 'rgba(255,' + (140 + ((h1(i2 * 2) * 70) | 0)) + ',70,' + a.toFixed(2) + ')';
        ctx.fillRect(px, py, 2, 2);
      }
    } else {
      for (i2 = 0; i2 < 16; i2++) {
        px = wx + ((h1(i2 * 1.7) * 1600 + t * (6 + h1(i2 + 9.1) * 15)) % 1600) * (ww / 1600);
        py = wy + (h1(i2 * 2.3 + 5) * 0.84) * wh;
        a = 0.05 + 0.09 * (0.5 + 0.5 * Math.sin(t * (0.8 + h1(i2) * 1.4) + i2 * 2.1));
        ctx.fillStyle = 'rgba(' + INK[idx] + ',' + a.toFixed(3) + ')';
        ctx.fillRect(px, py, 2, 2);
      }
    }

    // paper grain: one pattern fill, keeps the plate from reading as flat vector
    var gp = grain(ctx);
    if (gp) {
      ctx.save();
      ctx.globalAlpha = 0.05;
      ctx.fillStyle = gp;
      ctx.fillRect(v.x0, v.y0, v.w, v.h);
      ctx.restore();
    }
  };

  /* ------------------------------------------------------------- void zones */

  ART3.drawZones = function (ctx, zones, H, t) {
    if (!zones || !zones.length) return;
    H = num(H, 760); t = num(t, 0);
    for (var zi = 0; zi < zones.length; zi++) {
      var z = zones[zi];
      if (!z) continue;
      var x0 = num(z.x0, 0), x1 = num(z.x1, 0), w = x1 - x0;

      ctx.fillRect(x0, 0, w, H * 0.30);
      ctx.fillStyle = 'rgba(7,2,20,0.52)';
      ctx.fillRect(x0, H * 0.30, w, H * 0.34);
      ctx.fillStyle = 'rgba(3,0,12,0.86)';

        ctx.fillStyle = 'rgba(124,72,204,0.05)';

      // drifting motes
      var n = clamp(Math.round(w / 26), 4, 12);
      for (var i = 0; i < n; i++) {
        var px = x0 + h1(zi * 31.7 + i * 3.3) * w;
        var spd = 26 + h1(i * 7.7 + zi) * 55;
        var py = (h1(i * 13.1) * H + t * spd) % H;
        var a = 0.3 * Math.sin(Math.PI * py / H);
        if (a <= 0.01) continue;
        ctx.fillStyle = 'rgba(170,124,255,' + a.toFixed(3) + ')';
        ctx.fillRect(px, py, 1.6, 5);

      // hazard edges: layered strokes + descending chevron ladder
      var pulse = 0.55 + 0.45 * Math.sin(t * 2.4 + zi * 1.7);
      for (var e = 0; e < 2; e++) {
        var ex = e === 0 ? x0 : x1, dir = e === 0 ? -1 : 1;
        ctx.strokeStyle = 'rgba(255,61,126,' + (0.05 + 0.05 * pulse).toFixed(3) + ')';
        ctx.lineWidth = 9;
        ctx.beginPath(); ctx.moveTo(ex, 0); ctx.lineTo(ex, H); ctx.stroke();
        ctx.strokeStyle = 'rgba(255,61,126,' + (0.16 + 0.12 * pulse).toFixed(3) + ')';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(ex, 0); ctx.lineTo(ex, H); ctx.stroke();
        ctx.strokeStyle = 'rgba(255,158,196,' + (0.3 + 0.25 * pulse).toFixed(3) + ')';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(ex, 0); ctx.lineTo(ex, H); ctx.stroke();

        ctx.strokeStyle = 'rgba(255,61,126,' + (0.14 + 0.14 * pulse).toFixed(3) + ')';
        ctx.lineWidth = 2;
        ctx.beginPath();

  /* -------------------------------------------------- terrain: the ink line
     Cached Path2D set. Rebuilt ONLY when dirty===true, the cache is empty, or
     the key (theme / column count / dx) changed. Everything else is a stroke
     of an already-built path — the whole point of the perf budget. */

  var terr = null, terrKey = '';

  // ds = deck scale (1 full, 0.6 phone-size). The hanging deck under the ink
  // is the first thing to turn to mush once the world is squeezed onto a
  // 375-wide screen, so its depth AND its rib spacing scale with the surface.
  function buildTerrain(ys, dx, ds) {
    var n = ys.length, i = 0;
    ds = num(ds, 1);
    var d1 = 14 * ds, d2 = 40 * ds, rbY = 3 * ds, rbD = 22 * ds, rbX = 3 * ds;
    var rbStep = ds < 0.99 ? 11 : 7;
    var c = { dots: [], lines: [], strips: [], strips2: [], ribs: [], len: [] };
    if (!HAS_P2D) return c;
    while (i < n) {
      while (i < n && !(ys[i] === ys[i])) i++;        // skip NaN gaps
      if (i >= n) break;
      var s = i;
      while (i < n && ys[i] === ys[i]) i++;           // run [s, e)
      var e = i, k;

      if (e - s === 1) { c.dots.push(s * dx, ys[s]); continue; }

      var line = new Path2D();
      line.moveTo(s * dx, ys[s]);
      for (k = s + 1; k < e; k++) line.lineTo(k * dx, ys[k]);

      var strip = new Path2D();
      strip.moveTo(s * dx, ys[s] + 1);
      for (k = s + 1; k < e; k++) strip.lineTo(k * dx, ys[k] + 1);
      for (k = e - 1; k >= s; k--) strip.lineTo(k * dx, ys[k] + d1);
      strip.closePath();

      var strip2 = new Path2D();
      strip2.moveTo(s * dx, ys[s] + d1);
      for (k = s + 1; k < e; k++) strip2.lineTo(k * dx, ys[k] + d1);
      for (k = e - 1; k >= s; k--) strip2.lineTo(k * dx, ys[k] + d2);
      strip2.closePath();

      // hanging ribs: deck structure under the ink. Spacing widens and depth
      // shortens at phone size so they stay separate marks instead of a smear.
      var ribs = new Path2D();
      for (k = s + 3; k < e - 1; k += rbStep) {
        ribs.moveTo(k * dx, ys[k] + rbY);
        ribs.lineTo(k * dx + rbX, ys[k] + rbD);
      }

      // rough arc length, for the travelling specular dash
      var L = 0;
      for (k = s + 1; k < e; k++) {
        var ddx = dx, ddy = ys[k] - ys[k - 1];
        L += Math.sqrt(ddx * ddx + ddy * ddy);
      }

      c.lines.push(line); c.strips.push(strip); c.strips2.push(strip2);
      c.ribs.push(ribs); c.len.push(L);
    }
    return c;
  }

  ART3.drawTerrain = function (ctx, ys, dx, W, H, themeIdx, dirty) {
    if (!ys || !ys.length) return;
    var idx = ti(themeIdx);
    dx = num(dx, 4);
    var ink = INK[idx], deep = DEEP[idx], th = THEMES[idx];
    // deck scale is part of the cache key: it only ever changes on a resize,
    // so the "zero Path2D allocation while dirty===false" guarantee holds.
    var ds = deckScale();
    var key = idx + ':' + ys.length + ':' + dx + ':' + ds;
    if (dirty === true || !terr || key !== terrKey) {

    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';

    ctx.fillStyle = 'rgba(' + deep + ',0.10)';
    for (j = 0; j < c.strips2.length; j++) ctx.fill(c.strips2[j]);

    // deck ribs — a touch more opaque when scaled down, so they survive
    ctx.strokeStyle = 'rgba(' + ink + ',' + (ds < 0.99 ? '0.20' : '0.16') + ')';
    ctx.lineWidth = ds < 0.99 ? 1.2 : 1.4;
    for (j = 0; j < c.ribs.length; j++) ctx.stroke(c.ribs[j]);

    // wet neon: wide halo -> mid glow -> wet edge -> white-hot core.
    // The two inner passes carry the contrast: on a bright phone screen the
    // soft outer halo is what washes out, so the core is the one that has to
    // stay hard. Core is wider and the wet edge hotter than V2.
    ctx.strokeStyle = 'rgba(' + ink + ',0.13)';
    ctx.lineWidth = 13;
    for (j = 0; j < nL; j++) ctx.stroke(c.lines[j]);
    ctx.strokeStyle = 'rgba(' + ink + ',0.30)';
    ctx.lineWidth = 7;
    for (j = 0; j < nL; j++) ctx.stroke(c.lines[j]);
    ctx.strokeStyle = 'rgba(' + ink + ',0.84)';
    ctx.lineWidth = 3.8;
    for (j = 0; j < nL; j++) ctx.stroke(c.lines[j]);
    ctx.strokeStyle = th.inkCore;
    ctx.lineWidth = 2.2;
    for (j = 0; j < nL; j++) ctx.stroke(c.lines[j]);

      ctx.fillStyle = 'rgba(' + ink + ',0.40)';
      ctx.beginPath(); ctx.arc(lx, ly, 4.5, 0, TAU); ctx.fill();
      ctx.fillStyle = th.inkCore;
      ctx.beginPath(); ctx.arc(lx, ly, 2.1, 0, TAU); ctx.fill();
    }
    ctx.restore();
  };

  /* -------------------------------------------------------------- platforms */

  ART3.drawPlatforms = function (ctx, plats, themeIdx, t) {
    if (!plats || !plats.length) return;
    var idx = ti(themeIdx), th = THEMES[idx], ink = INK[idx];
    t = num(t, 0);
    for (var i = 0; i < plats.length; i++) {
      var p = plats[i];

      ctx.fillStyle = 'rgba(5,3,16,0.5)';
      ctx.fillRect(x0, y + 20, w, 12);

      ctx.fillStyle = 'rgba(122,230,255,0.06)';
      for (var hx = x0 + 8; hx < x1 - 4; hx += 22) ctx.fillRect(hx, y + 5, 2, 13);
      ctx.strokeStyle = 'rgba(' + ink + ',0.10)';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      for (var sx = x0 + 12; sx < x1 - 6; sx += 34) {

      ctx.stroke();

      ctx.lineCap = 'round';
      ctx.strokeStyle = 'rgba(' + ink + ',0.15)';
      ctx.lineWidth = 12;
      ctx.beginPath(); ctx.moveTo(x0 + 1, y); ctx.lineTo(x1 - 1, y); ctx.stroke();
      ctx.strokeStyle = 'rgba(' + ink + ',0.42)';
      ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(x0 + 1, y); ctx.lineTo(x1 - 1, y); ctx.stroke();
      ctx.strokeStyle = th.inkCore;
      ctx.lineWidth = 1.8;
      ctx.beginPath(); ctx.moveTo(x0 + 1, y); ctx.lineTo(x1 - 1, y); ctx.stroke();
    }
  };

  /* ------------------------------------------------------------------- flag */

  ART3.drawFlag = function (ctx, x, y, t, reached) {
    x = num(x, 0); y = num(y, 0); t = num(t, 0);
    var poleH = 60, topY = y - poleH;
    var wSpd = reached ? 11 : 6.5, amp = reached ? 6 : 3.2;
    var w1 = Math.sin(t * wSpd) * amp, w2 = Math.sin(t * wSpd + 1.5) * amp * 1.35;

    ctx.fillStyle = 'rgba(6,4,18,0.6)';
    ctx.beginPath();

    ctx.fill();

    ctx.lineCap = 'round';
    ctx.strokeStyle = '#0c0a20'; ctx.lineWidth = 4.5;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, topY); ctx.stroke();
    ctx.strokeStyle = '#c3d1e4'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, topY); ctx.stroke();

    var cw = 30, ch = 19;
    ctx.beginPath();
    ctx.moveTo(x, topY);

    ctx.lineTo(x + cw, topY + 3 + ch + w2 * 0.7);
    ctx.quadraticCurveTo(x + cw * 0.5, topY + ch + w1 * 0.7, x, topY + ch);
    ctx.closePath();

    if (reached) {
      var pu = 0.5 + 0.5 * Math.sin(t * 9);
      ctx.fillStyle = 'rgba(255,210,74,' + (0.14 + 0.14 * pu).toFixed(3) + ')';
      ctx.save();
      ctx.beginPath(); ctx.arc(x + 9, topY + 9, 30 + pu * 8, 0, TAU); ctx.fill();
      ctx.restore();
      ctx.beginPath();
      ctx.moveTo(x, topY);
      ctx.quadraticCurveTo(x + cw * 0.5, topY + w1, x + cw, topY + 3 + w2);
      ctx.lineTo(x + cw, topY + 3 + ch + w2 * 0.7);
      ctx.quadraticCurveTo(x + cw * 0.5, topY + ch + w1 * 0.7, x, topY + ch);
      ctx.closePath();

      ctx.fillStyle = 'rgba(40,186,220,0.88)'; ctx.fill();
      ctx.strokeStyle = 'rgba(190,248,255,0.9)'; ctx.lineWidth = 1.4; ctx.stroke();
      // chequer notch, two squares, reads as a finish flag at a glance
      ctx.fillStyle = 'rgba(240,255,255,0.55)';
      ctx.fillRect(x + 3, topY + 4, 7, 6);
      ctx.fillRect(x + 15, topY + 11, 7, 6);
    }

    ctx.fillStyle = reached ? '#fff6cf' : '#e3eef8';
    ctx.beginPath(); ctx.arc(x, topY - 2, 3.2, 0, TAU); ctx.fill();
  };

  /* -------------------------------------------------------------------- saw */

  ART3.drawSaw = function (ctx, x, y, r, t) {
    x = num(x, 0); y = num(y, 0); r = num(r, 30); t = num(t, 0);
    var rot = t * 7.4 + x * 0.7, teeth = 12;

    ctx.save();
    ctx.translate(x, y);

    ctx.strokeStyle = 'rgba(255,61,126,0.09)';
    ctx.lineWidth = 10;
    ctx.beginPath(); ctx.arc(0, 0, r + 5, 0, TAU); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,61,126,0.28)';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 0, r + 1.5, 0, TAU); ctx.stroke();

    ctx.rotate(rot);

    ctx.fillStyle = '#ccd6e6';
    ctx.beginPath();
    for (var i = 0; i < teeth; i++) {

      ctx.lineTo(Math.cos(a1) * r * 1.19, Math.sin(a1) * r * 1.19);
      ctx.lineTo(Math.cos(a2) * r * 0.86, Math.sin(a2) * r * 0.86);
    }

    ctx.fillStyle = '#93a0bb';
    ctx.beginPath(); ctx.arc(0, 0, r * 0.88, 0, TAU); ctx.fill();
    ctx.fillStyle = '#5c6786';
    ctx.beginPath(); ctx.arc(0, 0, r * 0.62, 0, TAU); ctx.fill();

    ctx.strokeStyle = 'rgba(255,255,255,0.16)';
    ctx.lineWidth = r * 0.14;
    ctx.beginPath(); ctx.arc(0, 0, r * 0.74, -2.4, -0.8); ctx.stroke();

    ctx.fillStyle = '#2c3149';
    for (var hI = 0; hI < 3; hI++) {
      var ha = hI * TAU / 3;
      ctx.beginPath();
      ctx.arc(Math.cos(ha) * r * 0.42, Math.sin(ha) * r * 0.42, r * 0.115, 0, TAU);
      ctx.fill();
    }

    ctx.fillStyle = '#ff3d7e';
    ctx.beginPath(); ctx.arc(0, 0, r * 0.17, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffd3e2';
    ctx.beginPath(); ctx.arc(-r * 0.05, -r * 0.05, r * 0.06, 0, TAU); ctx.fill();

    ctx.restore();
  };

  /* ---------------------------------------------------------- block/crusher */

  ART3.drawBlock = function (ctx, x, y, w, h, themeIdx, t, isCrusher) {
    x = num(x, 0); y = num(y, 0); w = num(w, 40); h = num(h, 40);
    if (!(w > 0) || !(h > 0)) return;
    var idx = ti(themeIdx), dan = DAN[idx];
    t = num(t, 0);
    var pulse = 0.5 + 0.5 * Math.sin(t * (isCrusher ? 5.2 : 2.2) + x * 0.03);

    ctx.fillStyle = '#120c28';
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = 'rgba(255,255,255,0.055)';
    ctx.fillRect(x, y, w, 3);
    ctx.fillStyle = 'rgba(0,0,0,0.32)';
    ctx.fillRect(x + w - 3, y, 3, h);

    ctx.save();
    ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
    ctx.strokeStyle = 'rgba(' + dan + ',' + (0.18 + 0.12 * pulse).toFixed(3) + ')';
    ctx.lineWidth = 5;
    var span = w + h;
    ctx.beginPath();
    for (var s = -h; s < span; s += 18) {
      ctx.moveTo(x + s, y + h + 4);
      ctx.lineTo(x + s + h + 8, y - 4);
    }
    ctx.stroke();

    if (isCrusher) {
      // industrial teeth along the crushing face + rivets up the sides
      ctx.fillStyle = 'rgba(210,220,236,0.85)';
      ctx.beginPath();
      var tw = 12;
      for (var tx = x + 2; tx < x + w - 2; tx += tw) {
        ctx.moveTo(tx, y + h);
        ctx.lineTo(tx + tw * 0.5, y + h - 9);
        ctx.lineTo(tx + tw, y + h);
      }
      ctx.fill();
      ctx.fillStyle = 'rgba(170,182,204,0.5)';
      for (var ry = y + 10; ry < y + h - 8; ry += 24) {
        ctx.beginPath(); ctx.arc(x + 6, ry, 1.8, 0, TAU); ctx.fill();
        ctx.beginPath(); ctx.arc(x + w - 6, ry, 1.8, 0, TAU); ctx.fill();
      }
      // strobing warning bar across the face
      ctx.fillStyle = 'rgba(' + dan + ',' + (0.14 + 0.3 * pulse).toFixed(3) + ')';
      ctx.fillRect(x + 3, y + h * 0.5 - 4, w - 6, 8);
    }
    ctx.restore();

    ctx.strokeStyle = 'rgba(' + dan + ',' + (0.32 + 0.28 * pulse).toFixed(3) + ')';
    ctx.lineWidth = 2;
    ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);

    if (isCrusher) {
      // danger shadow it will slam into
      ctx.fillStyle = 'rgba(' + dan + ',' + (0.05 + 0.06 * pulse).toFixed(3) + ')';
      ctx.fillRect(x + 2, y + h, w - 4, 26);
    }
  };

  /* ------------------------------------------------------------------- lava */

  function lavaSurfY(x, yTop, t) {
    return yTop + Math.sin(x * 0.05 + t * 2.2) * 2.6 + Math.sin(x * 0.021 - t * 1.1) * 1.9;
  }

  ART3.drawLava = function (ctx, x0, x1, yTop, H, t) {
    x0 = num(x0, 0); x1 = num(x1, 0); yTop = num(yTop, 0); H = num(H, 760); t = num(t, 0);
    var w = x1 - x0;
    if (!(w > 0) || !(H > yTop)) return;

    // flat molten bands, no gradient allocation
    ctx.fillStyle = '#e0341f';
    ctx.fillRect(x0, yTop, w, Math.min(26, H - yTop));
    if (H - yTop > 26) {
      ctx.fillStyle = '#8c1116';
      ctx.fillRect(x0, yTop + 26, w, Math.min(60, H - yTop - 26));
    }
    if (H - yTop > 86) {
      ctx.fillStyle = '#2c030b';
      ctx.fillRect(x0, yTop + 86, w, H - yTop - 86);
    }
    // heat haze above the pool
    ctx.fillStyle = 'rgba(255,120,40,0.07)';
    ctx.fillRect(x0, yTop - 22, w, 22);

    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(x0, lavaSurfY(x0, yTop, t));
    for (var sx = x0 + 8; sx <= x1; sx += 8) ctx.lineTo(sx, lavaSurfY(sx, yTop, t));

    ctx.strokeStyle = 'rgba(255,184,96,0.72)'; ctx.lineWidth = 4; ctx.stroke();
    ctx.strokeStyle = '#fff3c0'; ctx.lineWidth = 1.7; ctx.stroke();
    ctx.restore();

    var nb = clamp(Math.round(w / 60), 2, 8), i;
    for (i = 0; i < nb; i++) {
      var bx = x0 + 8 + h1(i * 17.3 + x0) * (w - 16);
      var per = 1.6 + h1(i * 3.7) * 1.6;
      var cyc = (t / per + h1(i * 7.1)) % 1;
      var br = cyc * 6;
      var by = lavaSurfY(bx, yTop, t) + 3 - cyc * 5;
      ctx.strokeStyle = 'rgba(255,204,112,' + (0.85 * (1 - cyc)).toFixed(3) + ')';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(bx, by, br, 0, TAU); ctx.stroke();
    }
    for (i = 0; i < 6; i++) {
      var ex = x0 + h1(i * 9.9 + x1) * w;
      var eh = 16 + h1(i * 4.4) * 34;
      var ey = yTop - ((t * (16 + h1(i) * 22) + h1(i * 2.2) * eh) % eh);
      ctx.fillStyle = 'rgba(255,172,84,' + (0.5 * (1 - (yTop - ey) / eh)).toFixed(3) + ')';
      ctx.fillRect(ex, ey, 2, 2);
    }
  };

  /* -------------------------------------------------------------- boost pad */

  ART3.drawBoost = function (ctx, x, y, angle, t) {
    x = num(x, 0); y = num(y, 0); angle = num(angle, 0); t = num(t, 0);
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);

    // pad plate sitting on the ink, slight lift
    ctx.fillStyle = 'rgba(6,20,26,0.8)';
    ctx.beginPath();
    ctx.moveTo(-26, 0); ctx.lineTo(26, 0); ctx.lineTo(22, -11); ctx.lineTo(-22, -11);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(120,255,230,0.5)';
    ctx.lineWidth = 1.4;
    ctx.stroke();

    // three chevrons marching in travel direction
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (var i = 0; i < 3; i++) {
      var ph = (t * 2.2 + i * 0.34) % 1;
      var cx = -18 + ph * 40;
      var a = Math.sin(Math.PI * ph);
      ctx.strokeStyle = 'rgba(150,255,220,' + (a * 0.85).toFixed(3) + ')';
      ctx.lineWidth = 3.4;
      ctx.beginPath();
      ctx.moveTo(cx - 6, -2.5); ctx.lineTo(cx + 1, -6.5); ctx.lineTo(cx - 6, -10.5);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,' + (a * 0.6).toFixed(3) + ')';
      ctx.lineWidth = 1.2;
      ctx.stroke();
    }

    // launch glow smear ahead of the pad
    var pu = 0.5 + 0.5 * Math.sin(t * 6);
    ctx.strokeStyle = 'rgba(120,255,225,' + (0.12 + 0.16 * pu).toFixed(3) + ')';
    ctx.lineWidth = 7;
    ctx.beginPath(); ctx.moveTo(26, -6); ctx.lineTo(44 + pu * 8, -6); ctx.stroke();
    ctx.strokeStyle = 'rgba(120,255,225,0.4)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-26, -0.5); ctx.lineTo(26, -0.5); ctx.stroke();
    ctx.restore();
  };

  /* ------------------------------------------------------------- spring pad */

  ART3.drawSpring = function (ctx, x, y, t, compress) {
    x = num(x, 0); y = num(y, 0); t = num(t, 0);
    var c = clamp(num(compress, 0), 0, 1);
    var restH = 20, hh = restH * (1 - 0.72 * c);
    ctx.save();
    ctx.translate(x, y);

    // base plate
    ctx.fillStyle = 'rgba(8,14,32,0.9)';
    ctx.fillRect(-20, -4, 40, 5);
    ctx.strokeStyle = 'rgba(255,210,74,0.45)';
    ctx.lineWidth = 1.2;
    ctx.strokeRect(-20, -4, 40, 5);

    // coil: zigzag between plate and top pad
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    var turns = 4, py = -4;
    ctx.moveTo(-11, py);
    for (var i = 0; i < turns; i++) {
      var y1 = -4 - (hh / turns) * (i + 0.5);
      var y2 = -4 - (hh / turns) * (i + 1);
      ctx.lineTo(11, y1);
      ctx.lineTo(-11, y2);
    }
    ctx.strokeStyle = 'rgba(255,210,74,0.22)'; ctx.lineWidth = 7; ctx.stroke();
    ctx.strokeStyle = '#ffd24a'; ctx.lineWidth = 2.6; ctx.stroke();
    ctx.strokeStyle = 'rgba(255,250,220,0.85)'; ctx.lineWidth = 1; ctx.stroke();

    // top pad, bounces with the coil
    var topY = -4 - hh;
    ctx.fillStyle = '#1a1330';
    ctx.fillRect(-17, topY - 6, 34, 7);
    ctx.fillStyle = 'rgba(255,210,74,' + (0.5 + 0.4 * c).toFixed(2) + ')';
    ctx.fillRect(-17, topY - 6, 34, 2.4);
    ctx.strokeStyle = 'rgba(255,240,180,0.7)';
    ctx.lineWidth = 1;
    ctx.strokeRect(-17, topY - 6, 34, 7);

    // up-arrows breathing above the pad
    var idle = 0.5 + 0.5 * Math.sin(t * 3.4);
    for (var k = 0; k < 2; k++) {
      var ay = topY - 12 - k * 11 - idle * 3;
      var aa = (0.34 - k * 0.13) * (0.55 + 0.45 * idle) + c * 0.4;
      ctx.strokeStyle = 'rgba(255,225,140,' + clamp(aa, 0, 1).toFixed(3) + ')';
      ctx.lineWidth = 2.6;
      ctx.beginPath();
      ctx.moveTo(-8, ay); ctx.lineTo(0, ay - 7); ctx.lineTo(8, ay);
      ctx.stroke();
    }
    if (c > 0.35) {   // just fired: shock ring
      var rr = (1 - c) * 46 + 8;
      ctx.strokeStyle = 'rgba(255,240,190,' + (c * 0.5).toFixed(3) + ')';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, topY - 4, rr, 0, TAU); ctx.stroke();
    }
    ctx.restore();
  };

  /* -------------------------------------------------------------- wind zone */

  ART3.drawWind = function (ctx, x0, y0, x1, y1, ax, t) {
    x0 = num(x0, 0); y0 = num(y0, 0); x1 = num(x1, 0); y1 = num(y1, 0);
    ax = num(ax, 0); t = num(t, 0);
    var w = x1 - x0, h = y1 - y0;
    if (!(w > 0) || !(h > 0)) return;
    var dir = ax < 0 ? -1 : 1;
    var spd = clamp(Math.abs(ax) / 260, 0.4, 2.4);

    ctx.save();
    ctx.beginPath(); ctx.rect(x0, y0, w, h); ctx.clip();

    // faint field wash + boundary tick marks
    ctx.fillStyle = 'rgba(150,220,255,0.045)';
    ctx.fillRect(x0, y0, w, h);
    ctx.strokeStyle = 'rgba(180,235,255,0.16)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x0 + 0.5, y0); ctx.lineTo(x0 + 0.5, y1);
    ctx.moveTo(x1 - 0.5, y0); ctx.lineTo(x1 - 0.5, y1);
    ctx.stroke();

    // drifting streaks, each with a little arrow head
    ctx.lineCap = 'round';
    var n = clamp(Math.round(w * h / 5200), 8, 26);
    for (var i = 0; i < n; i++) {
      var lane = h1(i * 3.7 + x0 * 0.01);
      var sy = y0 + 6 + lane * (h - 12);
      var len = 22 + h1(i * 5.3) * 44;
      var travel = (t * (70 + h1(i * 2.1) * 130) * spd + h1(i * 9.7) * (w + 200)) % (w + 200);
      var sx = dir > 0 ? (x0 - 120 + travel) : (x1 + 120 - travel);
      var wob = Math.sin(t * 2.2 + i * 1.7) * 4;
      var a = 0.10 + 0.24 * Math.sin(Math.PI * clamp((sx - x0) / w, 0, 1));
      ctx.strokeStyle = 'rgba(196,240,255,' + a.toFixed(3) + ')';
      ctx.lineWidth = 1 + h1(i * 7.1) * 1.6;
      ctx.beginPath();
      ctx.moveTo(sx, sy + wob);
      ctx.lineTo(sx + dir * len, sy + wob * 0.6);
      ctx.stroke();
      if (h1(i * 13.3) > 0.55) {
        ctx.beginPath();
        ctx.moveTo(sx + dir * len, sy + wob * 0.6);
        ctx.lineTo(sx + dir * (len - 6), sy + wob * 0.6 - 3.5);
        ctx.moveTo(sx + dir * len, sy + wob * 0.6);
        ctx.lineTo(sx + dir * (len - 6), sy + wob * 0.6 + 3.5);
        ctx.stroke();
      }
    }
    ctx.restore();
  };

  /* ------------------------------------------------------------------- star */

  var starP = null;
  function starPath() {
    if (starP || !HAS_P2D) return starP;
    starP = new Path2D();
    for (var i = 0; i < 10; i++) {
      var rr = (i % 2 === 0) ? 1 : 0.44;
      var a = -Math.PI / 2 + i * Math.PI / 5;
      var px = Math.cos(a) * rr, py = Math.sin(a) * rr;
      if (i === 0) starP.moveTo(px, py); else starP.lineTo(px, py);
    }
    starP.closePath();
    return starP;
  }
  function fillStar(ctx, s, col) {
    var p = starPath();
    ctx.save();
    ctx.scale(s, s);
    ctx.fillStyle = col;
    if (p) {
      ctx.fill(p);
    } else {
      ctx.beginPath();
      for (var i = 0; i < 10; i++) {
        var rr = (i % 2 === 0) ? 1 : 0.44;
        var a = -Math.PI / 2 + i * Math.PI / 5;
        var px = Math.cos(a) * rr, py = Math.sin(a) * rr;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  ART3.drawStar = function (ctx, x, y, t, collected) {
    x = num(x, 0); y = num(y, 0); t = num(t, 0);
    ctx.save();
    ctx.translate(x, y);

    if (collected) {
      ctx.rotate(h1(x * 0.37) * TAU);
      ctx.globalAlpha = 0.15;
      fillStar(ctx, 9, '#cbbb8d');
      ctx.restore();
      return;
    }

    var bob = Math.sin(t * 2.2 + x * 0.03) * 3;
    ctx.translate(0, bob);
    var s = 10 * (1 + 0.08 * Math.sin(t * 2.8 + x * 0.05));
    ctx.rotate(t * 0.7 + x * 0.01);
    fillStar(ctx, s * 2.2, 'rgba(255,210,74,0.09)');
    fillStar(ctx, s * 1.38, 'rgba(255,210,74,0.24)');
    fillStar(ctx, s, '#ffd24a');
    fillStar(ctx, s * 0.5, 'rgba(255,255,255,0.92)');
    ctx.restore();

    // sparkle cross, counter-rotating so the pickup twinkles
    var tw = 0.35 + 0.65 * Math.abs(Math.sin(t * 1.9 + x * 0.02));
    ctx.save();
    ctx.translate(x, y + bob);
    ctx.rotate(-t * 0.45);
    ctx.strokeStyle = 'rgba(255,244,200,' + (tw * 0.5).toFixed(3) + ')';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(-20 * tw, 0); ctx.lineTo(20 * tw, 0);
    ctx.moveTo(0, -20 * tw); ctx.lineTo(0, 20 * tw);
    ctx.stroke();
    ctx.restore();
  };

  /* ------------------------------------------------------------------- bike
     b = {x,y,angle,speed,airborne,state,crashT,dist,flips,lean}
     b.x,b.y = physics centre (collision r 12). Ground contact 12px BELOW it.
     Wheel r 8, wheelbase 22 -> 38px long. AXLE_Y = 12 - 8 = 4. */

  var WHEEL_R = 8, AXLE_Y = 4;
  var PAL = {
    body: '#1e1740', dark: '#100c22', tank: '#2e2660', acc: '#6fe6ff',
    pipe: '#939bb5', rim: 'rgba(111,230,255,0.55)', spoke: '#9fabc8',
    suit: '#2a2450', suit2: '#3a3268', helm: '#ffcf5e', visor: '#0a1226',
    scarf: '#ff3d7e', light: '#ffe9b0'
  };
  var GPAL = {
    body: 'rgba(150,225,255,0.30)', dark: 'rgba(120,200,235,0.26)',
    tank: 'rgba(170,235,255,0.24)', acc: 'rgba(210,250,255,0.34)',
    pipe: 'rgba(180,225,245,0.26)', rim: 'rgba(190,240,255,0.28)',
    spoke: 'rgba(190,240,255,0.24)', suit: 'rgba(150,225,255,0.28)',
    suit2: 'rgba(160,230,255,0.24)', helm: 'rgba(215,250,255,0.34)',
    visor: 'rgba(60,120,150,0.3)', scarf: 'rgba(210,250,255,0.24)',
    light: 'rgba(230,255,255,0.3)'
  };

  function drawWheel(ctx, x, y, rot, P) {
    ctx.save();
    ctx.translate(x, y);
    ctx.strokeStyle = P.dark; ctx.lineWidth = 3.2;
    ctx.beginPath(); ctx.arc(0, 0, WHEEL_R - 1.4, 0, TAU); ctx.stroke();
    ctx.strokeStyle = P.rim; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(0, 0, WHEEL_R - 3, 0, TAU); ctx.stroke();
    ctx.rotate(rot);
    ctx.strokeStyle = P.spoke; ctx.lineWidth = 1.1;
    ctx.beginPath();
    for (var i = 0; i < 4; i++) {
      var a = i * TAU / 4;
      ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(a) * (WHEEL_R - 3.2), Math.sin(a) * (WHEEL_R - 3.2));
    }
    ctx.stroke();
    ctx.fillStyle = P.spoke;
    ctx.beginPath(); ctx.arc(0, 0, 1.5, 0, TAU); ctx.fill();
    ctx.restore();
  }

  function drawBikeBody(ctx, wheelRot, forkUp, P, hot) {
    drawWheel(ctx, -11, AXLE_Y, wheelRot, P);
    drawWheel(ctx, 11, AXLE_Y - forkUp * 0.4, wheelRot, P);

    ctx.lineCap = 'round';
    // swingarm + fork
    ctx.strokeStyle = P.body; ctx.lineWidth = 2.6;
    ctx.beginPath(); ctx.moveTo(-11, AXLE_Y); ctx.lineTo(-3, 1); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(11, AXLE_Y - forkUp * 0.4); ctx.lineTo(7.5, -6 - forkUp); ctx.stroke();

    // fenders
    ctx.strokeStyle = P.dark; ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.arc(11, AXLE_Y - forkUp * 0.4, WHEEL_R + 2.2, -2.5, -1.0); ctx.stroke();
    ctx.beginPath(); ctx.arc(-11, AXLE_Y, WHEEL_R + 2.2, -2.2, -1.4); ctx.stroke();

    // exhaust + tip
    ctx.strokeStyle = P.pipe; ctx.lineWidth = 2.3;
    ctx.beginPath(); ctx.moveTo(-3, 2.6); ctx.lineTo(-16, 3.4); ctx.stroke();
    ctx.fillStyle = P.dark;
    ctx.beginPath(); ctx.arc(-16.6, 3.4, 1.9, 0, TAU); ctx.fill();

    // frame + tank + tail
    ctx.fillStyle = P.body;
    ctx.beginPath();
    ctx.moveTo(-10, -2);
    ctx.lineTo(-3.5, -5.4);
    ctx.lineTo(3, -5.6);
    ctx.quadraticCurveTo(7.6, -5.2, 8.6, -1);
    ctx.lineTo(4, 2.2);
    ctx.lineTo(-4, 2.8);
    ctx.closePath();
    ctx.fill();
    // tail kick
    ctx.fillStyle = P.dark;
    ctx.beginPath();
    ctx.moveTo(-10, -2); ctx.lineTo(-15.5, -4.4); ctx.lineTo(-14.5, -1.2); ctx.lineTo(-9, 0);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = P.tank;
    ctx.beginPath();
    ctx.moveTo(-1, -5.3); ctx.lineTo(4.6, -5.4);
    ctx.quadraticCurveTo(7.2, -4.9, 7.4, -2.6);
    ctx.lineTo(0.5, -2.8);
    ctx.closePath();
    ctx.fill();
    // ink racing stripe
    ctx.strokeStyle = P.acc; ctx.lineWidth = 1.1;
    ctx.beginPath(); ctx.moveTo(-9.5, -2.4); ctx.lineTo(6.8, -4); ctx.stroke();
    // number plate decal
    ctx.fillStyle = P.acc;
    ctx.globalAlpha *= 0.75;
    ctx.fillRect(-13.4, -3.6, 3.4, 2.2);
    ctx.globalAlpha /= 0.75;

    // bars + headlight
    ctx.strokeStyle = P.dark; ctx.lineWidth = 1.9;
    ctx.beginPath(); ctx.moveTo(7.5, -6 - forkUp); ctx.lineTo(4.8, -9.6 - forkUp); ctx.stroke();
    ctx.fillStyle = P.light;
    ctx.beginPath(); ctx.arc(9, -5 - forkUp, 1.7, 0, TAU); ctx.fill();
    if (hot > 0) {   // headlight throw at speed
      ctx.fillStyle = 'rgba(255,235,170,' + (hot * 0.16).toFixed(3) + ')';
      ctx.beginPath();
      ctx.moveTo(9.6, -6.4 - forkUp); ctx.lineTo(34, -12 - forkUp);
      ctx.lineTo(34, 1 - forkUp); ctx.closePath();
      ctx.fill();
    }
  }

  function drawRider(ctx, lean, tuck, armPump, scarf, P) {
    ctx.save();
    ctx.translate(-2.5, -5.6);
    ctx.rotate(lean);
    if (tuck > 0) { ctx.translate(1.4 * tuck, 1.2 * tuck); ctx.scale(1 - 0.1 * tuck, 1 - 0.16 * tuck); }
    ctx.lineCap = 'round';

    // rear leg to peg (knee lifts when tucked)
    ctx.strokeStyle = P.suit; ctx.lineWidth = 2.8;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(3.4, 2.2 - 1.6 * tuck);
    ctx.lineTo(2.2 + 1.4 * tuck, 6 - 3.2 * tuck);
    ctx.stroke();

    // torso
    ctx.strokeStyle = P.suit2; ctx.lineWidth = 3.6;
    ctx.beginPath();
    ctx.moveTo(0, 0.6);
    ctx.quadraticCurveTo(1.6 + tuck, -4.4 + 1.4 * tuck, 5 - 0.8 * tuck, -7.6 + 2.6 * tuck);
    ctx.stroke();

    // arm to grip, or fist up on a win
    var hx = 5 - 0.8 * tuck, hy = -7.2 + 2.6 * tuck;
    ctx.strokeStyle = P.suit; ctx.lineWidth = 2.3;
    ctx.beginPath();
    ctx.moveTo(hx - 0.5, hy);
    if (armPump > 0) {
      ctx.quadraticCurveTo(6.8, -9.4, 6 + Math.sin(armPump) * 1.4, -13);
    } else {
      ctx.quadraticCurveTo(7.6, -6.2 + tuck, 8.4, -3.8 + 1.2 * tuck);
    }
    ctx.stroke();
    if (armPump > 0) {
      ctx.fillStyle = P.helm;
      ctx.beginPath(); ctx.arc(6 + Math.sin(armPump) * 1.4, -13.4, 1.3, 0, TAU); ctx.fill();
    }

    // scarf trailing back
    if (scarf > 0.02) {
      ctx.strokeStyle = P.scarf;
      ctx.lineWidth = 1.6;
      ctx.globalAlpha *= 0.85;
      for (var s = 0; s < 2; s++) {
        var ph = nowS() * 9 + s * 1.9;
        ctx.beginPath();
        ctx.moveTo(hx - 1.4, hy - 2.6);
        ctx.quadraticCurveTo(hx - 6 - 5 * scarf, hy - 4 + Math.sin(ph) * 2.4,
          hx - 12 - 9 * scarf, hy - 2 + Math.sin(ph + 1.2) * 3.4);
        ctx.stroke();
      }
      ctx.globalAlpha /= 0.85;
    }

    // helmet + visor + shine
    var hdx = hx + 1, hdy = hy - 2.6;
    ctx.fillStyle = P.helm;
    ctx.beginPath(); ctx.arc(hdx, hdy, 3.5, 0, TAU); ctx.fill();
    ctx.fillStyle = P.visor;
    ctx.beginPath();
    ctx.arc(hdx, hdy, 3.5, -0.55, 0.78);
    ctx.quadraticCurveTo(hdx + 1.3, hdy + 0.4, hdx + 0.9, hdy - 1.7);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.lineWidth = 0.85;
    ctx.beginPath(); ctx.arc(hdx, hdy, 3.5, -2.6, -1.4); ctx.stroke();

    ctx.restore();
  }

  var lastPuffT = -9;

  ART3.drawBike = function (ctx, b, t) {
    if (!b) return;
    t = num(t, 0);
    var bx = num(b.x, 0), by = num(b.y, 0);
    var ang = num(b.angle, 0), spd = num(b.speed, 0);
    var wheelRot = num(b.dist, 0) / WHEEL_R;
    var flips = num(b.flips, 0);
    var lean = clamp(num(b.lean, 0), -1, 1);
    var state = b.state || 'ride';
    var hot = clamp(spd / 780, 0, 1);

    ctx.save();
    ctx.translate(bx, by);

    if (state === 'crash') {
      var ct = Math.max(0, num(b.crashT, 0));
      // bike cartwheels away, rider separates and tumbles
      ctx.save();
      var spin = ct * 11 * Math.exp(-1.1 * ct);
      var bdy = Math.min(-150 * ct + 300 * ct * ct, 8);
      ctx.translate(ct * 30, bdy);
      ctx.rotate(ang + spin);
      drawBikeBody(ctx, wheelRot + ct * 30, 0, PAL, 0);
      ctx.restore();

      var rx = -36 * ct - 10;
      var ry = Math.min(-180 * ct + 390 * ct * ct, 2);
      var settled = (ry >= 2 && ct > 0.42);
      var rrot = settled ? 1.72 : -ct * 9.5;
      ctx.save();
      ctx.translate(rx, ry - 6);
      ctx.rotate(rrot);
      drawRider(ctx, settled ? 0 : Math.sin(ct * 14) * 0.5, 0, 0, 0, PAL);
      ctx.restore();

      ctx.restore();
      return;
    }

    if (state === 'win') {
      var we = 0.5 + 0.06 * Math.sin(t * 5);
      ctx.rotate(ang);
      ctx.translate(-11, AXLE_Y);
      ctx.rotate(-we);
      ctx.translate(11, -AXLE_Y);
      drawBikeBody(ctx, wheelRot + t * 4, 0, PAL, 0.4);
      drawRider(ctx, -0.16, 0, t * 8, 0.5, PAL);
      ctx.restore();
      return;
    }

    if (state === 'idle') {
      var bob = Math.sin(t * 2.6) * 1.3;
      // ink underglow while parked
      ctx.fillStyle = 'rgba(' + INK[0] + ',0.10)';
      ctx.beginPath();
      if (ctx.ellipse) ctx.ellipse(0, 12, 20, 4, 0, 0, TAU); else ctx.arc(0, 12, 6, 0, TAU);
      ctx.fill();
      ctx.translate(0, bob * 0.4);
      drawBikeBody(ctx, wheelRot, 0, PAL, 0);
      ctx.save();
      ctx.translate(0, bob * 0.5);
      drawRider(ctx, 0.04 * Math.sin(t * 2.6 + 1), 0, 0, 0, PAL);
      ctx.restore();
      if (t - lastPuffT > 0.7) {
        lastPuffT = t;
        spawnP(PT_PUFF, bx - 17, by + 3, -14 - Math.random() * 8, -10, 0.7, 2.2, '150,150,175', -18, 1.2, 0, 0);
      }
      ctx.restore();
      return;
    }

    // ---- ride ----
    var spinning = !!b.airborne && flips > 0;

    // spin trail: faint arc behind the bike so a flip reads as intentional
    if (spinning) {
      ctx.save();
      ctx.rotate(ang);
      ctx.strokeStyle = 'rgba(' + INK[0] + ',0.22)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 4, 21, 0.5, 4.4); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,0.14)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(0, 4, 25, 1.0, 3.9); ctx.stroke();
      ctx.restore();
    } else if (!b.airborne && hot > 0.25) {
      // contact glow smear under the wheels
      ctx.fillStyle = 'rgba(' + INK[0] + ',' + (0.05 + hot * 0.12).toFixed(3) + ')';
      ctx.beginPath();
      if (ctx.ellipse) ctx.ellipse(-2, 12, 22 + hot * 12, 4, 0, 0, TAU); else ctx.arc(-2, 12, 6, 0, TAU);
      ctx.fill();
    }

    ctx.rotate(ang);
    var tuck = spinning ? 1 : (b.airborne ? 0.45 : 0);
    var rlean = lean * 0.32 + clamp(ang * 0.22, -0.22, 0.22)
      + (b.airborne ? -0.2 : 0) + hot * 0.1;
    var forkUp = b.airborne ? 1.1 : 0;
    drawBikeBody(ctx, wheelRot, forkUp, PAL, hot);
    drawRider(ctx, rlean, tuck, 0, clamp(hot * 1.2 - 0.25, 0, 1), PAL);

    // exhaust flame flicker when pinned
    if (hot > 0.72 && !b.airborne) {
      var fl = 3 + Math.random() * 4;
      ctx.fillStyle = 'rgba(255,150,70,' + (0.25 + Math.random() * 0.3).toFixed(2) + ')';
      ctx.beginPath();
      ctx.moveTo(-17, 2.2); ctx.lineTo(-17 - fl, 3.4); ctx.lineTo(-17, 4.6);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  };

  /* ------------------------------------------------------------------ ghost */

  ART3.drawGhost = function (ctx, g, t) {
    if (!g) return;
    t = num(t, 0);
    ctx.save();
    ctx.globalAlpha = 0.32;
    ctx.translate(num(g.x, 0), num(g.y, 0));
    ctx.rotate(num(g.angle, 0));
    drawBikeBody(ctx, num(g.dist, t * 60) / WHEEL_R, 0, GPAL, 0);
    drawRider(ctx, -0.05, 0.2, 0, 0, GPAL);
    ctx.restore();
  };

  /* ---------------------------------------------------------------- speedfx */

  ART3.drawSpeedFx = function (ctx, cam, W, H, speedNorm) {
    W = num(W, 1600); H = num(H, 760);
    noteSurface(ctx);
    var s = clamp(num(speedNorm, 0), 0, 1);
    var v = visRect(cam, W, H);
    var tt = nowS();
    var thin = lite();                 // small surface or low quality
