<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>INK RIDER</title>
<style>
  html,body{margin:0;height:100%;background:#0d0f14;color:#e8e4dc;
    font:16px/1.5 ui-monospace,Menlo,Consolas,monospace;
    -webkit-text-size-adjust:100%;overscroll-behavior:none}
  main{min-height:100%;display:flex;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;box-sizing:border-box;
    padding:calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom))}
  h1{margin:0 0 4px;font-size:clamp(28px,9vw,56px);letter-spacing:.14em}
  p{margin:6px 0;max-width:34em;opacity:.72;font-size:14px}
  .rule{width:64px;height:3px;background:#e8e4dc;margin:18px 0;border-radius:2px}
  .ok{color:#7fd08a}.bad{color:#e0645a}
  code{opacity:.6;font-size:12px}
</style>
</head>
<body>
<main>
  <h1>INK RIDER</h1>
  <div class="rule"></div>
  <p>Deployment placeholder. The game build lands here.</p>
  <p id="checks"><code>running checks&hellip;</code></p>
</main>
<script>
(function () {
  "use strict";
  // Defence in depth: frame-ancestors in a <meta> CSP is ignored by browsers
  // (it is header-only), so refuse to render inside someone else's frame.
  if (window.top !== window.self) {
    document.body.textContent = "INK RIDER does not run in a frame.";
    return;
  }
  var out = [];
  var csp = document.querySelector('meta[http-equiv="Content-Security-Policy"]');
  out.push(csp ? '<span class="ok">CSP active</span>' : '<span class="bad">CSP MISSING</span>');
  var store = "unavailable";
  try {
    window.localStorage.setItem("inkrider.probe", "1");
    window.localStorage.removeItem("inkrider.probe");
    store = "local storage ok";
  } catch (e) { store = "local storage blocked"; }
  out.push('<span class="ok">' + store + '</span>');
  out.push('<span class="ok">no network calls</span>');
  document.getElementById("checks").innerHTML =
    '<code>' + out.join(' &middot; ') + '</code>';
}());
</script>
</body>
</html>
