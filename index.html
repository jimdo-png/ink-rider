  isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints || 0) > 0;
  document.body.classList.add(isTouch ? 'touch' : 'kbd');
  el.keys.textContent = isTouch ? '' : 'SPACE go · Z undo · C clear · R retry · ←→ lean';
  // fullscreen is unsupported on iPhone Safari; offer the home-screen install tip there instead
  var canFS = !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
  el.fsBtn.hidden = !canFS;
  var standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  if (isTouch && !canFS && !standalone && !save.tipSeen) el.installTip.classList.add('show');
}

function showScreen(name){
  ['title','select','winCard'].forEach(function(s){ el[s].classList.toggle('show', s === name); });
}
function toast(msg, ms){
  el.toast.textContent = msg; el.toast.classList.add('show');
  if (toastTO) clearTimeout(toastTO);
  toastTO = setTimeout(function(){ el.toast.classList.remove('show'); }, ms || 1250);
}
function trickPop(msg){
  el.trickpop.textContent = msg; el.trickpop.classList.remove('show');
  void el.trickpop.offsetWidth; el.trickpop.classList.add('show');
  if (trickTO) clearTimeout(trickTO);
  trickTO = setTimeout(function(){ el.trickpop.classList.remove('show'); }, 900);
}

// ---------------- sizing / camera ----------------
// The playfield is a fixed 1600x760 landscape world. On a portrait phone, fitting it to the
// screen width leaves a useless letterboxed strip (this is exactly what V2 shipped), so instead
// the whole scene is drawn rotated a quarter turn and the player simply holds the phone sideways.
// `essW/essH` are the "effective screen space" the rest of the code lays out in.
function resize(force){
  // Measure the canvas's own laid-out box, not visualViewport. On iOS visualViewport excludes
  // the Safari toolbars, so sizing to it drew a canvas smaller than the screen, pinned to the
  // top-left by inset:0 — the game looked shrunken and off-centre. The canvas is fixed at
  // inset:0, so its client box IS the screen, toolbars included.
  var de = document.documentElement;
  var w = Math.round(cv.clientWidth || window.innerWidth || de.clientWidth || 0);
  var h = Math.round(cv.clientHeight || window.innerHeight || de.clientHeight || 0);
  if (forceW && forceH) { w = forceW; h = forceH; }
  if (!w || !h) { w = 1280; h = 720; }
  var wantRot = (h > w * 1.02) && w < 700;   // phones only: a tablet in portrait is wide enough as-is
  // the visible band changes on its own when a toolbar slides in or out, with no change to the
  // canvas box, so it has to be part of the "did anything move?" test
  var vv0 = window.visualViewport;
  var sig = w + 'x' + h + ':' + wantRot + ':' +
    (forceW && forceH ? 'forced' : [Math.round((vv0 && vv0.width) || w), Math.round((vv0 && vv0.height) || h),
     Math.round((vv0 && vv0.offsetLeft) || 0), Math.round((vv0 && vv0.offsetTop) || 0)].join(','));
  if (!force && sig === lastSig) return;
  lastSig = sig;
  cssW = w; cssH = h; rot = wantRot;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(w * DPR); cv.height = Math.round(h * DPR);
  essW = rot ? h : w; essH = rot ? w : h;
  // The canvas covers the whole screen so the backdrop paints edge to edge, but the playfield is
  // centred inside the VISIBLE band — on iOS the browser toolbars overlay the layout viewport, and
  // centring against the full height pushes the game down behind them.
  var vv = window.visualViewport;
  var vx0 = (vv && vv.offsetLeft) || 0, vy0 = (vv && vv.offsetTop) || 0;
  var vw = Math.min((vv && vv.width) || w, w), vh = Math.min((vv && vv.height) || h, h);
  if (forceW && forceH) { vx0 = 0; vy0 = 0; vw = w; vh = h; }
  var visW, visH, visX, visY;
  if (rot) { visW = vh; visH = vw; visX = vy0; visY = cssW - vx0 - vw; }
  else { visW = vw; visH = vh; visX = vx0; visY = vy0; }
  scale = Math.min(visW / W, visH / H);
  offX = visX + (visW - W * scale) / 2;
  offY = visY + (visH - H * scale) / 2;
  // The whole level has to stay visible while drawing, which caps how large the world can be
  // rendered — so on a small screen the RIDER is drawn larger instead, targeting a readable
  // on-screen size without ballooning on a desktop monitor.
  bikeVis = clamp(0.82 / scale, 1, 1.7);
  document.body.classList.toggle('portrait', rot);
  document.body.classList.toggle('flip', rot && flipped);
  document.documentElement.style.setProperty('--appw', w + 'px');
  document.documentElement.style.setProperty('--apph', h + 'px');
  if (window.ART3 && ART3.setQuality) ART3.setQuality(Math.min(w, h) < 500 ? 0 : 1);
  skyGradTheme = -1;                                        // gradient is built in world units; rebuild
}
// canvas transform for the current orientation (applied once per frame)
function applyOrientation(){
  if (!rot) return;
  if (flipped) { ctx.translate(0, cssH); ctx.rotate(-Math.PI / 2); }
  else { ctx.translate(cssW, 0); ctx.rotate(Math.PI / 2); }
}
// screen (client) point -> effective screen space, undoing the same rotation
function toEss(clientX, clientY){
  if (!rot) return { x: clientX, y: clientY };
  if (flipped) return { x: cssH - clientY, y: clientX };
  return { x: clientY, y: cssW - clientX };
}

// world<->screen with camera: screen = (world - camTopLeft) * scale * zoom + off
function camView(){
  var vw = W / cam.zoom, vh = H / cam.zoom;
  var cx = clamp(cam.x, vw / 2, W - vw / 2), cy = clamp(cam.y, vh / 2, H - vh / 2);
  return { x0: cx - vw / 2, y0: cy - vh / 2, vw: vw, vh: vh };
}
function worldPt(e){
  var v = camView(), p = toEss(e.clientX, e.clientY);
  return { x: v.x0 + (p.x - offX) / (scale * cam.zoom), y: v.y0 + (p.y - offY) / (scale * cam.zoom) };
}
function updateCamera(dt){
  var tz = (phase === 'ride' && bike) ? camTargetZoom : ZOOM_DRAW;
  cam.zoom = lerp(cam.zoom, tz, Math.min(1, dt * 4.5));
  var tx = W / 2, ty = H / 2;
  if (phase === 'ride' && bike) {
    tx = bike.x + clamp(bike.vx || 0, -260, 260) * 0.35;
    ty = bike.y - 40;
  }
  var k = Math.min(1, dt * (phase === 'ride' ? 7 : 4));
  cam.x = lerp(cam.x, tx, k); cam.y = lerp(cam.y, ty, k);
}

// ---------------- level lifecycle ----------------
function loadLevel(i){
  li = clamp(i, 0, window.LEVELS3.length - 1); L = window.LEVELS3[li];
  cols = (W / DX) + 1;
  ys = new Float32Array(cols); for (var k = 0; k < cols; k++) ys[k] = NaN;
  plats = [{ x0: 0, x1: PLAT0_X1, y: L.startY }, { x0: L.flagX - PLATF_PAD, x1: W, y: L.flagY }];
  flag = { x: L.flagX, y: L.flagY };
  zones = (L.zones || []).map(function(z){ return { x0: z.x0, x1: z.x1 }; });
  obs = (L.obstacles || []).map(function(o){
    var r = { type: o.type, osc: o.osc || null };
    if (o.type === 'saw'){ r.bx = o.x; r.by = o.y; r.r = o.r || 30; r.x = o.x; r.y = o.y; }
    else if (o.type === 'block'){ r.bx = o.x; r.by = o.y; r.x = o.x; r.y = o.y; r.w = o.w; r.h = o.h; }
    else if (o.type === 'lava'){ r.x0 = o.x0; r.x1 = o.x1; r.yTop = o.yTop; }
    else if (o.type === 'boost'){ r.bx = o.x; r.by = o.y; r.x = o.x; r.y = o.y; r.angle = o.angle || 0; r.power = o.power || 700; r.fired = 0; }
    else if (o.type === 'spring'){ r.bx = o.x; r.by = o.y; r.x = o.x; r.y = o.y; r.power = o.power || 900; r.fired = 0; }
    else if (o.type === 'wind'){ r.x0 = o.x0; r.x1 = o.x1; r.y0 = o.y0; r.y1 = o.y1; r.ax = o.ax || 0; }
    return r;
  });
  stars = (L.stars || []).map(function(s){ return { x: s.x, y: s.y, got: false }; });
  var dx = flag.x - PLAT0_X1, dy = flag.y - plats[0].y;
  inkMax = (L.ink || 1.8) * Math.sqrt(dx * dx + dy * dy);
  inkUsed = 0; strokes = []; curStroke = null; penBroken = true; stroking = false; strokeDirty = true; attempts = 0;
  ghostPlay = save.ghost[li] || null;
  resetBike();
  cam.x = W / 2; cam.y = H / 2; cam.zoom = ZOOM_DRAW;
  phase = 'draw';
  el.lvlname.textContent = (li + 1) + ' · ' + L.name;
  el.hint.textContent = phraseFor(L.hint || '');
  el.hint.hidden = !L.hint;
  el.onboard.hidden = !(li === 0 && !save.onboarded);   // level-1 finger demo, once
  el.coach.classList.remove('show');
  seenAir = false;
  el.timer.textContent = '0.0s';
  AUDIO3.musicStart(L.theme | 0);
  updateStarRow(); updateInkbar(); updateButtons(); showScreen(null);
}

function resetBike(){
  bike = { x: 40, y: plats[0].y, vx: 0, vy: 0, speed: 0, angle: 0, airborne: false, state: 'idle',
           crashT: 0, dist: 0, stallT: 0, lean: 0, flips: 0, hardLand: 0 };
  for (var i = 0; i < stars.length; i++) stars[i].got = false;
  for (i = 0; i < obs.length; i++) if (obs[i].fired !== undefined) obs[i].fired = 0;
  rideT = 0; lean = 0; leanInput = 0; spinAcc = 0; flips = 0; trickScore = 0;
  ghostRec = null; ghostT = 0; ghostAcc = 0;
  AUDIO3.wind(false);
  if (el.starrow) updateStarRow();   // stars were just un-collected: clear the pips too
}

function updateButtons(){
  var drawable = phase === 'draw' && !stroking;
  el.btnGo.hidden = !(drawable && inkUsed > 10);
  el.btnClear.hidden = !(drawable && inkUsed > 10);
  el.btnUndo.hidden = !(drawable && strokes.length > 0);
  el.btnRetry.hidden = !(phase === 'ride' && bike && bike.state === 'ride');
  el.hud.hidden = !(phase === 'draw' || phase === 'ride');
  var riding = phase === 'ride' && bike && bike.state === 'ride';
  el.leanL.hidden = el.leanR.hidden = !(isTouch && riding);
  el.keys.hidden = isTouch || riding;                 // the hint strip sits where RETRY lands
  el.fsBtn.hidden = el.fsBtn.hidden || !(phase === 'draw' || phase === 'title');
  el.flipBtn.hidden = !(rot && (phase === 'draw' || phase === 'title'));
  document.body.classList.toggle('riding', !!riding);
}
function updateInkbar(){
  var f = clamp(1 - inkUsed / inkMax, 0, 1);
  el.inkfill.style.width = (f * 100).toFixed(1) + '%';
  el.inkfill.classList.toggle('low', f < 0.15);
}
function updateStarRow(){
  var sp = el.starrow.children;
  for (var i = 0; i < sp.length; i++) sp[i].classList.toggle('lit', !!(stars[i] && stars[i].got));
}

// ---------------- terrain ----------------
function inZone(x){ for (var i = 0; i < zones.length; i++) if (x >= zones[i].x0 && x <= zones[i].x1) return true; return false; }
function inPlat(x){ return x <= plats[0].x1 || x >= plats[1].x0; }
function groundY(x){
  if (x <= plats[0].x1) return plats[0].y;
  if (x >= plats[1].x0) return plats[1].y;
  var f = x / DX, i = f | 0;
  if (i < 0 || i >= cols - 1) return NaN;
  var a = ys[i], b = ys[i + 1];
  if (a !== a) return (b === b) ? b : NaN;   // seam at the platform lip: fall back to the neighbour
  if (b !== b) return a;
  return a + (b - a) * (f - i);
}
function groundSlope(x){
  var a = groundY(x - 7), b = groundY(x + 7), d = 14;
  if (a !== a || b !== b) { a = groundY(x - 2); b = groundY(x + 2); d = 4; }  // divide by the span actually sampled
  if (a !== a || b !== b) return 0;
  return (b - a) / d;
}
function setCell(i, y){
  if (i < 0 || i >= cols) return;
  if (curStroke) curStroke.cells.push(i, ys[i]);
  ys[i] = y;
}
function strokeTo(pt){
  var x = clamp(pt.x, 0, W - 1), y = clamp(pt.y, 12, H - 26);
  if (inPlat(x) || inZone(x)) { penBroken = true; return; }
  if (lastPt && !penBroken) {
    if (x <= lastPt.x + 0.5) return;                       // monotonic left→right
    var segLen = Math.sqrt((x - lastPt.x) * (x - lastPt.x) + (y - lastPt.y) * (y - lastPt.y));
    if (inkUsed + segLen > inkMax) { penBroken = true; el.inkfill.classList.add('low'); return; }
    inkUsed += segLen; if (curStroke) curStroke.ink += segLen;
    var i0 = Math.max(0, Math.ceil(lastPt.x / DX)), i1 = Math.min(cols - 1, Math.floor(x / DX));
    for (var i = i0; i <= i1; i++) {
      var cx = i * DX;
      if (inZone(cx) || inPlat(cx)) continue;
      var f = (cx - lastPt.x) / (x - lastPt.x);
      setCell(i, lastPt.y + (y - lastPt.y) * clamp(f, 0, 1));
    }
    if (Math.random() < 0.25) ART3.fxInk(x, y);
  } else {
    var ii = Math.round(x / DX);
    if (ii >= 0 && ii < cols && !inZone(ii * DX) && !inPlat(ii * DX) && inkUsed + DX <= inkMax) {
      setCell(ii, y); inkUsed += DX; if (curStroke) curStroke.ink += DX;
    }
    penBroken = false;
  }
  lastPt = { x: x, y: y }; strokeDirty = true;
  updateInkbar(); updateButtons();
}
function smoothStroke(){
  var out = new Float32Array(ys);
  for (var i = 0; i < cols; i++) {
    if (ys[i] !== ys[i]) continue;
    var sum = 0, n = 0;
    for (var k = -2; k <= 2; k++) { var j = i + k; if (j >= 0 && j < cols && ys[j] === ys[j]) { sum += ys[j]; n++; } }
    out[i] = sum / n;
  }
  ys = out; strokeDirty = true;
}
function undoStroke(){
  var s = strokes.pop();
  if (!s) return;
  for (var k = s.cells.length - 2; k >= 0; k -= 2) ys[s.cells[k]] = s.cells[k + 1];
  inkUsed = (s.restoreInk !== undefined) ? s.restoreInk : Math.max(0, inkUsed - s.ink);
  penBroken = true; lastPt = null; strokeDirty = true;
  updateInkbar(); updateButtons();
}
// CLEAR sits next to UNDO and wipes the whole road, so it is recorded as a single undoable
// step rather than guarded by a confirm: a mis-tap costs one more tap, not the level.
function clearStroke(){
  var cells = [], had = inkUsed;
  for (var k = 0; k < cols; k++) {
    if (ys[k] === ys[k]) { cells.push(k, ys[k]); ys[k] = NaN; }
  }
  strokes = cells.length ? [{ cells: cells, ink: had, restoreInk: had }] : [];
  inkUsed = 0; penBroken = true; lastPt = null; strokeDirty = true;
  if (cells.length) toast('cleared — ↶ to undo', 1400);
  updateInkbar(); updateButtons();
}

// ---------------- input ----------------
function bindInput(){
  cv.addEventListener('pointerdown', function(e){
    AUDIO3.unlock();
    if (paused) { paused = false; prevT = nowS(); toast('', 1); return; }
    // a tap during the crash replay cuts it short: crash -> drawing again is one tap, no waiting
    if (phase === 'ride' && bike && bike.state === 'crash') { crashTimer = 0; return; }
    if (phase === 'ride' && bike && bike.state === 'ride' && isTouch) {   // touch lean: screen halves
      leanInput = (toEss(e.clientX, e.clientY).x < essW / 2) ? -1 : 1;
      if (el.coach) el.coach.classList.remove('show');
      return;
    }
    if (phase !== 'draw' || activePtr !== null) return;
    tapStart = { x: e.clientX, y: e.clientY, t: nowS() };
    hideOnboarding();
    e.preventDefault(); activePtr = e.pointerId;
    try { cv.setPointerCapture(e.pointerId); } catch(err){}
    stroking = true; penBroken = true; lastPt = null;
    curStroke = { cells: [], ink: 0 };
    strokeTo(worldPt(e)); AUDIO3.scratch(true); updateButtons();
  });
  cv.addEventListener('pointermove', function(e){
    if (phase !== 'draw' || !stroking || e.pointerId !== activePtr) return;
    e.preventDefault();
    var evs = e.getCoalescedEvents ? e.getCoalescedEvents() : null;
    if (!evs || !evs.length) evs = [e];
    for (var i = 0; i < evs.length; i++) strokeTo(worldPt(evs[i]));
  });
  function up(e){
    if (phase === 'ride') { leanInput = 0; return; }
    if (e.pointerId !== activePtr) return;
    activePtr = null;
    if (stroking) {
      stroking = false; AUDIO3.scratch(false); smoothStroke();
      if (curStroke && curStroke.cells.length) strokes.push(curStroke);
      curStroke = null; updateButtons();
    }
    // Double-tap anywhere is a second way to launch, for players who never find the button.
    // It is only ever two genuine TAPS: a gesture that moved is a drawing stroke, and drawing a
    // second stroke quickly must never fire the bike. Suppressed just after a crash, where the
    // tapping is frustration rather than a command.
    if (!isTouch || !tapStart) return;
    var dt2 = nowS() - tapStart.t;
    var moved = Math.abs(e.clientX - tapStart.x) + Math.abs(e.clientY - tapStart.y);
    var isTap = moved < 10 && dt2 < 0.25;
    tapStart = null;
    if (!isTap) { lastTapT = 0; return; }
    var tnow = nowS();
    if (phase === 'draw' && inkUsed > 10 && tnow - lastTapT < 0.35 && tnow - lastCrashT > 0.5) {
      lastTapT = 0; startRide(); return;
    }
    lastTapT = tnow;
  }
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', up);
  cv.addEventListener('contextmenu', function(e){ e.preventDefault(); });

  bindTap(el.btnGo, startRide);
  bindTap(el.btnClear, clearStroke);
  bindTap(el.btnUndo, undoStroke);
  bindTap(el.btnRetry, abortRide);
  bindTap(el.btnMute, function(){ var m = AUDIO3.toggleMute(); save.mute = m; persist(); el.btnMute.textContent = m ? '✕' : '♪'; });
  bindTap(el.btnMenu, openSelect);
  bindTap(el.btnPlay, openSelect);
  bindTap(el.btnBack, showTitle);
  bindTap(el.btnNext, function(){ loadLevel(li + 1); });
  bindTap(el.btnReplay, function(){ loadLevel(li); });
  bindTap(el.btnLevels, openSelect);

  function leanBind(node, dir){
    node.addEventListener('pointerdown', function(e){ e.preventDefault(); leanInput = dir; if (el.coach) el.coach.classList.remove('show'); });
    node.addEventListener('pointerup', function(){ leanInput = 0; });
    node.addEventListener('pointercancel', function(){ leanInput = 0; });
    node.addEventListener('pointerleave', function(){ leanInput = 0; });
  }
  leanBind(el.leanL, -1); leanBind(el.leanR, 1);
  bindTap(el.fsBtn, toggleFullscreen);
  bindTap(el.flipBtn, function(){ flipped = !flipped; save.flipped = flipped; persist(); resize(true); });
  bindTap(el.installTip, function(){ el.installTip.classList.remove('show'); save.tipSeen = 1; persist(); });

  window.addEventListener('keydown', function(e){
    AUDIO3.unlock();
    var k = e.key;
    if (k === ' ' || k === 'Spacebar') { e.preventDefault();
      if (phase === 'draw') startRide();
      else if (phase === 'win') { AUDIO3.click(); if (li + 1 < window.LEVELS3.length) loadLevel(li + 1); else openSelect(); }
      else if (phase === 'title') openSelect();
      return; }
    if (k === 'ArrowLeft' || k === 'a') { leanInput = -1; return; }
    if (k === 'ArrowRight' || k === 'd') { leanInput = 1; return; }
    if (k === 'z' || k === 'Z') { if (phase === 'draw' && !stroking) { AUDIO3.click(); undoStroke(); } return; }
    if (k === 'c' || k === 'C') { if (phase === 'draw' && !stroking) { AUDIO3.click(); clearStroke(); } return; }
    if (k === 'r' || k === 'R') { AUDIO3.click(); if (phase === 'ride') abortRide(); else if (phase === 'win') loadLevel(li); return; }
    if (k === 'm' || k === 'M') { var m = AUDIO3.toggleMute(); save.mute = m; persist(); el.btnMute.textContent = m ? '✕' : '♪'; return; }
    if (k === 'Escape') { openSelect(); return; }
  });
  window.addEventListener('keyup', function(e){
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'ArrowRight' || e.key === 'd') leanInput = 0;
  });
  // iOS reports stale dimensions for a frame or two after a rotation, and the URL bar collapsing
  // fires scroll rather than resize — so listen broadly and re-measure across two frames.
  function remeasure(){ requestAnimationFrame(function(){ requestAnimationFrame(function(){ resize(true); }); }); }
  window.addEventListener('resize', function(){ resize(); });
  window.addEventListener('orientationchange', function(){ remeasure(); setTimeout(remeasure, 250); });
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', function(){ resize(); });
    window.visualViewport.addEventListener('scroll', function(){ resize(); });
  }
  if (window.ResizeObserver) { try { new ResizeObserver(function(){ resize(); }).observe(document.documentElement); } catch(e){} }
  window.addEventListener('blur', function(){ leanInput = 0; });
  // a call, a lock screen or an app switch must not ride the bike into a saw
  document.addEventListener('visibilitychange', function(){
    if (document.hidden) {
      AUDIO3.engineStop(); AUDIO3.wind(false); AUDIO3.musicStop(); leanInput = 0;
      if (phase === 'ride' && bike && bike.state === 'ride') { paused = true; toast('paused — tap to resume', 6000); }
    } else {
      prevT = nowS();
      AUDIO3.unlock();                       // iOS suspends the context on the way out; resume it
      if (L && !AUDIO3.muted) AUDIO3.musicStart(L.theme | 0);
      resize(true);                          // toolbars may have changed height while we were away
    }
  });
}
function bindTap(node, fn){
  node.addEventListener('pointerup', function(e){ e.preventDefault(); e.stopPropagation(); AUDIO3.unlock(); AUDIO3.click(); fn(); });
  node.addEventListener('pointerenter', function(){ AUDIO3.hover(); });
}

// ---------------- screens ----------------
function showTitle(){
  phase = 'title'; showScreen('title'); updateButtons();
  var tot = 0, med = 0;
  for (var k in save.stars) tot += save.stars[k];
  for (k in save.medals) if (save.medals[k]) med++;
  el.totstars.textContent = tot ? ('★ ' + tot + '/' + window.LEVELS3.length * 3 + '   ▲ ' + med + ' medals') : '';
}
function openSelect(){
  // never swallow a finished run: a win already banked its medal, so show the card instead
  if (phase === 'ride' && bike && bike.state === 'win') { showWin(); return; }
  if (phase === 'ride' && bike && bike.state === 'crash') { resetBike(); phase = 'draw'; }
  AUDIO3.engineStop(); AUDIO3.wind(false);
  var g = el.grid; g.innerHTML = '';
  window.LEVELS3.forEach(function(lv, i){
    var locked = i > save.unlocked;
    var c = document.createElement('button');
    var med = save.medals[i] || '';
    c.className = 'cell' + (locked ? ' locked' : '') + (save.stars[i] ? ' done' : '') + (med ? ' ' + med : '');
    var n = document.createElement('div'); n.className = 'n'; n.textContent = String(i + 1);
    var sm = document.createElement('small');
    var st = save.stars[i] || 0;
    sm.textContent = locked ? '✕' : (st ? '★'.repeat(st) + '☆'.repeat(3 - st) : '···');
    c.appendChild(n); c.appendChild(sm);
    if (!locked) c.addEventListener('pointerup', function(e){ e.preventDefault(); AUDIO3.click(); loadLevel(i); });
    g.appendChild(c);
  });
  var totScore = 0; for (var k in save.score) totScore += save.score[k];
  el.selfoot.textContent = totScore ? ('total score ' + totScore.toLocaleString()) : 'clear levels to unlock more';
  phase = 'select'; showScreen('select'); updateButtons();
}

// ---------------- ride ----------------
function startRide(){
  if (phase !== 'draw' || inkUsed <= 10) return;
  resetBike();
  bike.state = 'ride'; phase = 'ride'; rideT = 0; attempts++;
  camTargetZoom = ZOOM_RIDE;
  ghostRec = [];
  AUDIO3.go(); AUDIO3.engineStart();
  el.hint.hidden = true;
  updateButtons();
}
function abortRide(){
  AUDIO3.engineStop(); AUDIO3.wind(false);
  resetBike(); phase = 'draw'; updateButtons();
}
function fail(kind){
  if (!bike || bike.state !== 'ride') return;
  lastFail = { kind: kind, x: Math.round(bike.x), y: Math.round(bike.y), speed: Math.round(bike.speed), air: bike.airborne, t: Math.round(rideT * 100) / 100 };
  bike.state = 'crash'; bike.crashT = 0; crashTimer = 0.9; lastCrashT = nowS();
  camTargetZoom = 1.85;                       // punch in on the wreck
  AUDIO3.engineStop(); AUDIO3.wind(false);
  if (kind === 'fall') AUDIO3.fall(); else AUDIO3.crash();
  ART3.fxCrash(bike.x, bike.y, bike.vx, bike.vy);
  ART3.shake(kind === 'fall' ? 9 : 20);
  buzz(kind === 'fall' ? 30 : [0, 45, 30, 60]);
  var q = (bike.x / flag.x > 0.85) ? pick(QUIPS3.close) : pick(QUIPS3[kind] || QUIPS3.crash);
  toast(q, 1150);
  updateButtons();
}
function medalFor(time){
  var par = L.par || 12;
  if (time <= par) return 'gold';
  if (time <= par * 1.35) return 'silver';
  if (time <= par * 1.8) return 'bronze';
  return '';
}
function winLevel(){
  if (!bike || bike.state !== 'ride') return;
  bike.state = 'win'; winTimer = 1.0;
  AUDIO3.engineStop(); AUDIO3.wind(false);
  var got = 0; for (var i = 0; i < stars.length; i++) if (stars[i].got) got++;
  lastMedal = medalFor(rideT);
  AUDIO3.win(lastMedal || 'bronze');
  ART3.fxConfetti(flag.x, flag.y - 70); ART3.shake(7);
  buzz([0, 40, 50, 40, 50, 90]);

  var inkLeft = clamp(1 - inkUsed / inkMax, 0, 1);
  var timeBonus = Math.max(0, Math.round((L.par * 1.8 - rideT) * 60));
  var score = 1000 + got * 500 + trickScore + timeBonus + Math.round(inkLeft * 400);
  var rank = { gold: 3, silver: 2, bronze: 1, '': 0 };
  if (got > (save.stars[li] || 0)) save.stars[li] = got;
  if (rank[lastMedal] > rank[save.medals[li] || '']) save.medals[li] = lastMedal;
  if (!save.best[li] || rideT < save.best[li]) { save.best[li] = Math.round(rideT * 100) / 100; if (ghostRec && ghostRec.length) save.ghost[li] = ghostRec; }
  if (score > (save.score[li] || 0)) save.score[li] = score;
  if (li + 1 > save.unlocked) save.unlocked = Math.min(li + 1, window.LEVELS3.length - 1);
  persist();
  el._pending = { got: got, score: score, time: rideT, medal: lastMedal, timeBonus: timeBonus, inkLeft: inkLeft };
  updateButtons();
}
function showWin(){
  phase = 'win';
  var p = el._pending || { got: 0, score: 0, time: 0, medal: '', timeBonus: 0, inkLeft: 0 };
  el.winMedal.className = p.medal || '';
  el.winMedal.textContent = p.medal ? p.medal.toUpperCase() : 'CLEARED';
  el.winStars.innerHTML = '<span class="' + (p.got > 0 ? '' : 'dim') + '">★</span>' +
                          '<span class="' + (p.got > 1 ? '' : 'dim') + '">★</span>' +
                          '<span class="' + (p.got > 2 ? '' : 'dim') + '">★</span>';
  el.winName.textContent = pick(QUIPS3.win) || 'Nice line.';
  el.winRows.innerHTML = '';
  function row(k, v, big){
    var d = document.createElement('div'); d.className = big ? 'wrow big' : 'wrow';
    var a = document.createElement('span'); a.textContent = k;
    var b = document.createElement('b'); b.textContent = v;
    d.appendChild(a); d.appendChild(b); el.winRows.appendChild(d);
  }
  row('TIME', p.time.toFixed(2) + 's');
  row('PAR', L.par + 's');
  row('BEST', (save.best[li] || p.time).toFixed(2) + 's');
  row('INK LEFT', Math.round(p.inkLeft * 100) + '%');
  if (trickScore) row('TRICKS', '+' + trickScore);
  row('SCORE', p.score.toLocaleString(), true);
  el.btnNext.hidden = li >= window.LEVELS3.length - 1;
  showScreen('winCard'); updateButtons();
}

// obstacle animation + collision
function animObs(t){
  for (var i = 0; i < obs.length; i++) {
    var o = obs[i];
    if (o.fired > 0) o.fired = Math.max(0, o.fired - 0.05);
    if (!o.osc) continue;
    var d = Math.sin((t / o.osc.period) * 6.28318 + (o.osc.phase || 0)) * o.osc.amp;
    if (o.osc.axis === 'x') { o.x = o.bx + d; o.y = o.by; } else { o.x = o.bx; o.y = o.by + d; }
  }
}
function hitObstacle(x, y){
  for (var i = 0; i < obs.length; i++) {
    var o = obs[i];
    if (o.type === 'saw'){ var dx = x - o.x, dy = y - o.y; if (dx * dx + dy * dy < (o.r + BR) * (o.r + BR)) return o; }
    else if (o.type === 'block'){
      var cx = clamp(x, o.x, o.x + o.w), cy = clamp(y, o.y, o.y + o.h);
      var ax = x - cx, ay = y - cy; if (ax * ax + ay * ay < BR * BR) return o;
    }
    else if (o.type === 'lava'){ if (x > o.x0 - BR && x < o.x1 + BR && y > o.yTop - BR) return o; }
  }
  return null;
}
function windAt(x, y){
  var a = 0;
  for (var i = 0; i < obs.length; i++) { var o = obs[i];
    if (o.type === 'wind' && x > o.x0 && x < o.x1 && y > o.y0 && y < o.y1) a += o.ax; }
  return a;
}
function padsAt(x, y, grounded){
  for (var i = 0; i < obs.length; i++) {
    var o = obs[i];
    if (o.type === 'boost' && grounded && Math.abs(x - o.x) < 30 && Math.abs(y - o.y) < 34) return o;
    if (o.type === 'spring' && Math.abs(x - o.x) < 28 && y > o.y - 40 && y < o.y + 26) return o;
  }
  return null;
}

// convert flips completed in the air into score — on a clean landing or on crossing the flag
function landFlips(){
  if (flips <= 0) return;
  var add = flips * 250;
  trickScore += add;
  trickPop(flips === 1 ? 'FLIP +250' : (flips + '× FLIP +' + add));
  toast(pick(QUIPS3.trick), 900);
  ART3.fxTrick(bike.x, bike.y);
  flips = 0; bike.flips = 0;
}

function physStep(dt){
  var b = bike;
  if (b.state !== 'ride') return;
  rideT += dt;

  if (!b.airborne) {
    var m = groundSlope(b.x), n = Math.sqrt(1 + m * m);
    var a = ENGINE + G * (m / n) - DRAG * b.speed;
    b.speed += a * dt;
    if (m < -0.18 && b.speed < 26) { b.stallT += dt; if (b.stallT > 0.28 || b.speed <= 0) { fail('steep'); return; } }
    else b.stallT = 0;
    if (b.speed < 0) b.speed = 0;
    var nx = Math.min(b.x + (b.speed / n) * dt, W - 2);
    var gy = groundY(nx);
    b.vx = b.speed / n; b.vy = b.speed * m / n;
    if (gy !== gy) b.airborne = true;
    else {
      var by = b.y + b.vy * dt + 0.5 * G * dt * dt;
      if (gy > by + 1.2) b.airborne = true;
      else if (gy < b.y - STEP_HOP) { fail('crash'); return; }
      else {
        if (gy < b.y - 7) b.speed *= 0.93;
        b.x = nx; b.y = gy; b.angle = Math.atan2(m, 1); b.dist += b.speed * dt;
        b.lean = lerp(b.lean, clamp(-m * 1.6, -1, 1), Math.min(1, dt * 8));
        if (b.speed > 260 && Math.random() < 0.4) ART3.fxDust(b.x - 15, b.y, b.speed);
      }
    }
    if (!b.airborne) {
      var pad = padsAt(b.x, b.y, true);
      if (pad) {
        if (pad.type === 'boost' && pad.fired <= 0) {
          b.speed = Math.max(b.speed, pad.power); pad.fired = 1;
          AUDIO3.boost(); ART3.fxBoost(pad.x, pad.y, pad.angle); ART3.shake(5);
        } else if (pad.type === 'spring' && pad.fired <= 0) {
          b.airborne = true; b.vx = b.speed; b.vy = -pad.power; pad.fired = 1;
          AUDIO3.spring(); ART3.fxSpring(pad.x, pad.y); ART3.shake(6);
        }
      }
    }
    if (b.airborne) { spinAcc = 0; }
  }

  if (b.airborne) {
    if (isTouch && !seenAir && !save.coached) {   // first time in the air: teach the lean zones
      seenAir = true; el.coach.classList.add('show');
      setTimeout(function(){ el.coach.classList.remove('show'); save.coached = 1; persist(); }, 2600);
    }
    var oldY = b.y, gOld = groundY(b.x);
    var wax = windAt(b.x, b.y);
    if (wax) { b.vx += wax * dt; AUDIO3.wind(true); } else AUDIO3.wind(false);
    b.vy += G * dt;
    b.x = Math.min(b.x + b.vx * dt, W - 2); b.y += b.vy * dt;
    // air control: player rotation, else settle toward velocity vector
    if (leanInput) {
      var d = leanInput * AIR_ROT * dt;
      b.angle += d; spinAcc += d; b.lean = leanInput;
      while (spinAcc >= 6.28318) { spinAcc -= 6.28318; flips++; b.flips = flips; ART3.fxTrick(b.x, b.y); AUDIO3.trick(flips); }
      while (spinAcc <= -6.28318) { spinAcc += 6.28318; flips++; b.flips = flips; ART3.fxTrick(b.x, b.y); AUDIO3.trick(flips); }
    } else {
      var va = Math.atan2(b.vy, b.vx);
      b.angle += (va * 0.6 - b.angle) * Math.min(1, dt * 3.2);
      b.lean = lerp(b.lean, 0, Math.min(1, dt * 4));
    }
    // keep the angle in (-PI, PI] so settling after a spin is symmetric: an unwrapped -2PI
    // used to settle the long way round and land upside down while +2PI landed clean
    b.angle -= 6.28318 * Math.floor((b.angle + Math.PI) / 6.28318);
    var spd = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
    b.speed = spd;
    if (b.y > H + 70) { fail('fall'); return; }
    var pad2 = padsAt(b.x, b.y, false);
    if (pad2 && pad2.type === 'spring' && pad2.fired <= 0 && b.vy > 0) {
      b.vy = -pad2.power; pad2.fired = 1; AUDIO3.spring(); ART3.fxSpring(pad2.x, pad2.y); ART3.shake(6);
    }
    var g = groundY(b.x);
    if (g === g && b.y >= g) {
      var deep = b.y - g;
      if (gOld === gOld && oldY > gOld + 30 && deep > 40) { fail('crash'); return; }  // hit a cliff face
      var m2 = groundSlope(b.x), n2 = Math.sqrt(1 + m2 * m2);
      var tx = 1 / n2, ty = m2 / n2;
      var fwd = b.vx * tx + b.vy * ty;
      var vmag = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
      var slopeAng = Math.atan2(m2, 1);
      // wrap to (-PI, PI] with floor, not %: JS keeps the sign, so left spins (angle < -3PI)
      // used to report a huge mismatch and always crashed
      var dA = b.angle - slopeAng;
      dA -= 6.28318 * Math.floor((dA + Math.PI) / 6.28318);
      var mis = Math.abs(dA);
      if (vmag > 300 && (fwd / vmag < 0.25 || mis > LAND_TOL)) { b.y = g; fail('crash'); return; }
      landFlips();
      b.airborne = false; b.y = g; b.speed = Math.max(fwd, 45); b.angle = slopeAng; spinAcc = 0;
      var hard = vmag > 480;
      ART3.fxLand(b.x, b.y, hard);
      if (hard) ART3.shake(5);
      AUDIO3.wind(false);
    }
  }

  b.dist += (b.airborne ? Math.sqrt(b.vx * b.vx + b.vy * b.vy) * 0.25 : 0) * dt;

  // hazards + pickups
  if (hitObstacle(b.x, b.y - 12)) { fail('crash'); return; }
  for (var i = 0; i < stars.length; i++) {
    var s = stars[i];
    if (!s.got) {
      var sdx = b.x - s.x, sdy = (b.y - 12) - s.y;
      if (sdx * sdx + sdy * sdy < STAR_R * STAR_R) {
        s.got = true; var idx = 0; for (var j = 0; j < stars.length; j++) if (stars[j].got) idx++;
        AUDIO3.star(idx - 1); ART3.fxStar(s.x, s.y); updateStarRow(); buzz(18);
      }
    }
  }
  // ghost recording
  ghostAcc += dt;
  if (ghostRec && ghostAcc >= 1 / GHOST_HZ) { ghostAcc = 0; ghostRec.push(Math.round(b.x), Math.round(b.y), Math.round(b.angle * 100) / 100); }
  // flag
  if (b.x >= flag.x - 6) {
    if (!b.airborne) { landFlips(); winLevel(); return; }
    if (b.y > flag.y - 150) {
      b.airborne = false; var fg = groundY(b.x); b.y = (fg === fg) ? fg : flag.y;
      landFlips(); winLevel(); return;
    }
  }
}

// ---------------- render ----------------
function render(t, dt){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, cssW, cssH);
  ctx.fillStyle = '#07060f';
  ctx.fillRect(0, 0, cssW, cssH);                     // letterbox backdrop
  applyOrientation();                                  // portrait phones play a quarter turn round
  var v = camView(), sh = ART3.shakeOffset();
  ctx.save();
  ctx.beginPath(); ctx.rect(offX, offY, W * scale, H * scale); ctx.clip();
  ctx.translate(offX + sh.x, offY + sh.y);
  ctx.scale(scale * cam.zoom, scale * cam.zoom);
  ctx.translate(-v.x0, -v.y0);

  var th = L ? (L.theme | 0) : 0;
  // art must see the SAME camera the transform used, i.e. clamped to the world, or its
  // parallax plates land off-view; the sky backfill covers any gap a plate can't reach.
  camView2.x = v.x0 + v.vw / 2; camView2.y = v.y0 + v.vh / 2; camView2.zoom = cam.zoom;
  skyFill(th);
  ART3.drawBackground(ctx, camView2, W, H, th, t);
  if (L) {
    ART3.drawZones(ctx, zones, H, t);
    var i, o;
    for (i = 0; i < obs.length; i++) { o = obs[i];
      if (o.type === 'lava') ART3.drawLava(ctx, o.x0, o.x1, o.yTop, H, t);
      else if (o.type === 'wind') ART3.drawWind(ctx, o.x0, o.y0, o.x1, o.y1, o.ax, t); }
    ART3.drawPlatforms(ctx, plats, th, t);
    ART3.drawTerrain(ctx, ys, DX, W, H, th, strokeDirty); strokeDirty = false;
    for (i = 0; i < obs.length; i++) { o = obs[i];
      if (o.type === 'boost') ART3.drawBoost(ctx, o.x, o.y, o.angle, t);
      else if (o.type === 'spring') ART3.drawSpring(ctx, o.x, o.y, t, o.fired || 0); }
    for (i = 0; i < obs.length; i++) { o = obs[i];
      if (o.type === 'saw') ART3.drawSaw(ctx, o.x, o.y, o.r, t);
      else if (o.type === 'block') ART3.drawBlock(ctx, o.x, o.y, o.w, o.h, th, t, !!o.osc); }
    for (i = 0; i < stars.length; i++) ART3.drawStar(ctx, stars[i].x, stars[i].y, t, stars[i].got);
    ART3.drawFlag(ctx, flag.x, flag.y, t, !!(bike && bike.state === 'win'));

    // ghost of your best run
    if (phase === 'ride' && ghostPlay && ghostPlay.length >= 3 && bike.state === 'ride') {
      var gi = Math.min(Math.floor(rideT * GHOST_HZ), (ghostPlay.length / 3 | 0) - 1) * 3;
      ART3.drawGhost(ctx, { x: ghostPlay[gi], y: ghostPlay[gi + 1], angle: ghostPlay[gi + 2] }, t);
    }
    if (phase === 'draw' && inkUsed < 10) {
      var px = plats[0].x1, py = plats[0].y, pu = (Math.sin(t * 4) + 1) / 2;
      ctx.globalAlpha = 0.45 + pu * 0.5; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(px + 10, py); ctx.lineTo(px + 54 + pu * 12, py); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(px + 44 + pu * 12, py - 9); ctx.lineTo(px + 58 + pu * 12, py);
      ctx.lineTo(px + 44 + pu * 12, py + 9); ctx.stroke(); ctx.globalAlpha = 1;
    }
    if (bike) {
      if (bike.state === 'crash') bike.crashT += dt;
      bikeProxy.x = bike.x; bikeProxy.y = bike.y - 12; bikeProxy.angle = bike.angle; bikeProxy.speed = bike.speed;
      bikeProxy.airborne = bike.airborne; bikeProxy.state = bike.state; bikeProxy.crashT = bike.crashT;
      bikeProxy.dist = bike.dist; bikeProxy.flips = bike.flips; bikeProxy.lean = bike.lean;
      if (bikeVis > 1.01) {                       // scale about the rider so it grows in place
        ctx.save();
        ctx.translate(bikeProxy.x, bikeProxy.y);
        ctx.scale(bikeVis, bikeVis);
        ctx.translate(-bikeProxy.x, -bikeProxy.y);
        ART3.drawBike(ctx, bikeProxy, t);
        ctx.restore();
      } else {
        ART3.drawBike(ctx, bikeProxy, t);
      }
    }
    ART3.fxUpdateDraw(ctx, dt);
    if (phase === 'ride' && bike && bike.state === 'ride') {
      var sn = clamp((bike.speed / VMAX - 0.45) / 0.55, 0, 1);   // streaks only kick in when genuinely fast
      if (sn > 0) ART3.drawSpeedFx(ctx, cam, W, H, sn * sn);
    }
  }
  ctx.restore();
}
var bikeProxy = { x:0, y:0, angle:0, speed:0, airborne:false, state:'idle', crashT:0, dist:0, flips:0, lean:0 };
var camView2 = { x: 0, y: 0, zoom: 1 };
var skyGrad = null, skyGradTheme = -1;
function skyFill(themeIdx){
  if (skyGradTheme !== themeIdx || !skyGrad) {
    var pal = (ART3.THEMES && ART3.THEMES[themeIdx] && ART3.THEMES[themeIdx].sky) || ['#0e0b22', '#191233', '#2a1b3d', '#3b2340'];
    skyGrad = ctx.createLinearGradient(0, 0, 0, H);
    for (var i = 0; i < pal.length; i++) skyGrad.addColorStop(i / (pal.length - 1), pal[i]);
    skyGradTheme = themeIdx;
  }
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H);
}

// ---------------- loop ----------------
function toggleFullscreen(){
  try {
    var d = document, r = d.documentElement;
    if (d.fullscreenElement || d.webkitFullscreenElement) { (d.exitFullscreen || d.webkitExitFullscreen).call(d); }
    else { (r.requestFullscreen || r.webkitRequestFullscreen).call(r); }
  } catch(e){}
  setTimeout(function(){ resize(true); }, 200);
}
function hideOnboarding(){
  if (el.onboard && !el.onboard.hidden) { el.onboard.hidden = true; save.onboarded = 1; persist(); }
}
function buzz(pattern){ if (navigator.vibrate) { try { navigator.vibrate(pattern); } catch(e){} } }

function update(dt, t){
  animObs(t);
  if (paused) return;
  if (phase !== 'ride') return;
  if (bike.state === 'ride') {
    var sd = dt / SUB;
    for (var i = 0; i < SUB; i++) { physStep(sd); if (bike.state !== 'ride') break; }
    AUDIO3.engineSet(clamp(bike.speed / VMAX, 0, 1), bike.airborne);
    var best = save.best[li];
    el.timer.textContent = rideT.toFixed(1) + 's' + (best ? ' · best ' + best.toFixed(1) : ' · par ' + L.par);
    el.timer.style.color = rideT <= L.par ? '#ffd76a' : (rideT <= L.par * 1.35 ? '#dfe6f5' : (rideT <= L.par * 1.8 ? '#e0a072' : '#ff6b8f'));
  } else if (bike.state === 'crash') {
    crashTimer -= dt;
    if (crashTimer <= 0) { resetBike(); phase = 'draw'; updateButtons(); }
  } else if (bike.state === 'win') {
    winTimer -= dt;
    if (bike.speed > 0) { bike.speed = Math.max(0, bike.speed - 950 * dt); bike.x = Math.min(bike.x + bike.speed * dt, W - 16); bike.dist += bike.speed * dt; }
    if (winTimer <= 0) showWin();
  }
}
function step(){
  lastFrameAt = nowS();
  var t = nowS() - startClock;
  var dt = clamp(nowS() - prevT, 0, 0.05); prevT = nowS();
  // hazards run off ride time during a run, so every attempt (and the ghost) sees the same phase
  var hazT = (phase === 'ride' && bike && bike.state === 'ride') ? rideT : t;
  resize(); update(dt, hazT); updateCamera(dt); render(t, dt);
}
function frame(){ step(); requestAnimationFrame(frame); }
// keep ticking when rAF is throttled, but never while the page is hidden — a backgrounded
// phone used to keep riding (and crashing) with the screen off
setInterval(function(){ if (!document.hidden && nowS() - lastFrameAt > 0.15) step(); }, 66);

// ---------------- boot ----------------
function boot(){
  buildDOM(); bindInput();
  flipped = !!save.flipped;
  resize(true);
  if (save.mute) { AUDIO3.toggleMute(); el.btnMute.textContent = '✕'; }
  loadLevel(clamp(save.unlocked, 0, window.LEVELS3.length - 1));
  showTitle();
  requestAnimationFrame(frame);
}
// test/debug hooks (harmless in production)
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
})();

;

</script>
